<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>バス v5</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">バス v5 — 丸みのあるかわいいボクセルバス</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(12,8,12);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(5,3,2);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(15,25,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

// windowにカメラ・シーンを公開（デバッグ用）
window.camera=camera;window.scene=scene;

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildBus(){
  const v=[];

  // 色定義
  const YL=0xecd040;   // 黄色メイン
  const YLD=0xd8b830;  // 黄色暗め
  const CR=0xf5ede0;   // クリーム（屋根）
  const BRN=0x7a5a30;  // 茶色
  const GL=0x88c8e8;   // ガラス水色
  const BK=0x222222;   // 黒タイヤ
  const MT=0x999999;   // メタル
  const WH=0xf8f8e8;   // 白
  const RD=0xd04030;   // 赤
  const OR=0xe89030;   // オレンジ

  // バス 10x5x4 (LxHxW) — コンパクト
  // y=0: 車軸（空間）
  // y=1: 車体底
  // y=2: 車体下
  // y=3-4: 窓エリア
  // y=5: 屋根

  // === タイヤ（大きめ、しっかり見える） ===
  for(const[tx,tz] of [[1.5,-0.3],[1.5,3.3],[7.5,-0.3],[7.5,3.3]]){
    v.push([tx,0.3,tz,BK,1.8,1.8,0.8]);
    v.push([tx+0.3,0.3,tz<0?tz-0.15:tz+0.15,MT,1,1,0.2]);
  }

  // === 車体底面 y=1 ===
  for(let x=0;x<10;x++) for(let z=0;z<4;z++) v.push([x,1,z,BRN]);

  // === 車体 ===

  // --- 左右壁 z=0, z=3 ---
  for(const zw of [0,3]){
    for(let x=0;x<10;x++){
      // y=2: 下部（暗い黄色+オレンジライン）
      v.push([x,2,zw,YLD]);
      // y=3-4: 窓エリア
      for(let y=3;y<=4;y++){
        const isWin = (x>=1&&x<=2)||(x>=4&&x<=5)||(x>=7&&x<=8);
        v.push([x,y,zw+(zw===0?-0.05:0.05), isWin?GL:YL]);
      }
    }
    // オレンジ帯（y=2の上辺）
    v.push([0,2.8,zw+(zw===0?-0.1:0.1),OR,10,0.2,0.1]);
  }

  // --- 前面 x=-0.05 ---
  for(let z=0;z<4;z++){
    v.push([0,2,z,YLD]);
    const isFrontGlass = z>=1&&z<=2;
    v.push([-0.05,3,z, isFrontGlass?GL:YL]);
    v.push([-0.05,4,z, isFrontGlass?GL:YL]);
  }
  // 前面オレンジ帯
  v.push([-0.1,2.8,0,OR,0.1,0.2,4]);

  // --- 後面 x=9.05 ---
  for(let z=0;z<4;z++){
    v.push([9,2,z,YLD]);
    v.push([9,3,z,YL]);
    const isRearGlass = z>=1&&z<=2;
    v.push([9.05,4,z, isRearGlass?GL:YL]);
  }
  // 後面オレンジ帯
  v.push([9.1,2.8,0,OR,0.1,0.2,4]);

  // === 屋根 y=5（車体と同じ幅、薄め） ===
  for(let x=0;x<10;x++) for(let z=0;z<4;z++){
    v.push([x,5,z,CR,1,0.35,1]);
  }

  // === 前面ディテール ===
  // ヘッドライト（丸っこい感じ）
  v.push([-0.2,2.3,0.2,WH,0.3,0.6,0.6]);
  v.push([-0.2,2.3,3,WH,0.3,0.6,0.6]);
  // ウインカー
  v.push([-0.15,1.8,0.2,OR,0.2,0.4,0.4]);
  v.push([-0.15,1.8,3.2,OR,0.2,0.4,0.4]);
  // バンパー
  v.push([-0.15,1.5,0,MT,0.2,0.4,4]);
  // ナンバープレート
  v.push([-0.15,2,1.3,WH,0.15,0.6,1.2]);

  // === 後面ディテール ===
  // テールライト
  v.push([9.2,2.5,0.2,RD,0.3,0.6,0.6]);
  v.push([9.2,2.5,3,RD,0.3,0.6,0.6]);
  // リアウインカー
  v.push([9.15,1.8,0.2,OR,0.2,0.4,0.4]);
  v.push([9.15,1.8,3.2,OR,0.2,0.4,0.4]);
  // リアバンパー
  v.push([9.15,1.5,0,MT,0.2,0.4,4]);

  // === サイドミラー（小さめ） ===
  v.push([-0.3,4,-0.3,MT,0.25,0.25,0.3]);
  v.push([-0.3,4,3.8,MT,0.25,0.25,0.3]);

  // === 行先表示板（前面上部、控えめ） ===
  v.push([-0.08,4.5,1,BRN,0.1,0.5,1.8]);

  return v;
}

scene.add(bm(buildBus()));
scene.add(new THREE.GridHelper(30,15,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
