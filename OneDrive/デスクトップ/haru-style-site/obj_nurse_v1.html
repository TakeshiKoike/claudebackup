<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>看護師ボクセル v1</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">看護師 v1 — ドット絵風（医師と並べて表示）</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(20,12,20);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(5,5,0);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(10,20,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

const S=0xf0c8a0, SD=0xe0b890, E=0x202020;
const BR=0x6a4a2a, BRD=0x8a6a3a;
const PK=0xf0a0b0, PKD=0xe08898, PKL=0xf8c0d0;
const WH=0xf0f0e8, NV=0x2a3a6a, SH=0x3a3a3a;
const RD=0xe05040, GY=0x808080;
const D=3;

// ============================================================
// 看護師（女性、ポニーテール、ピンクウェア、クリップボード）
// ============================================================
function buildNurse(){
  const v=[];

  // Hair top
  for(let x=1;x<=7;x++) v.push([x,14,0,BR,1,1,D]);
  for(let x=0;x<=8;x++) v.push([x,13,0,BR,1,1,D]);
  // Ponytail (extends back, thicker at depth)
  v.push([7,13,D,BR,2,1,2]);
  v.push([8,12,D,BR,2,1,2]);
  v.push([8,11,D+1,BR,1,2,2]);

  // Face
  v.push([0,12,0,BR,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,12,0,S,1,1,D]);
  v.push([8,12,0,BR,1,1,D]);

  // Eyes
  v.push([0,11,0,BR,1,1,D]);
  v.push([1,11,0,S,1,1,D]);
  v.push([2,11,0,E,1,1,D]);
  v.push([3,11,0,S,1,1,D]);
  v.push([4,11,0,S,1,1,D]);
  v.push([5,11,0,S,1,1,D]);
  v.push([6,11,0,E,1,1,D]);
  v.push([7,11,0,S,1,1,D]);
  v.push([8,11,0,BR,1,1,D]);

  // Cheeks + nose
  for(let x=1;x<=7;x++) v.push([x,10,0,S,1,1,D]);
  v.push([2,10,0,PKL,1,1,D]);
  v.push([6,10,0,PKL,1,1,D]);

  // Mouth (small smile)
  for(let x=1;x<=7;x++) v.push([x,9,0,S,1,1,D]);
  v.push([3,9,0,SD,1,1,D]);
  v.push([5,9,0,SD,1,1,D]);

  // Neck
  v.push([3,8,0,S,1,1,D]);
  v.push([4,8,0,S,1,1,D]);
  v.push([5,8,0,S,1,1,D]);

  // Nurse uniform (pink) — shoulders
  for(let x=0;x<=8;x++) v.push([x,7,0,PK,1,1,D]);

  // Body + arms
  v.push([0,6,0,PK,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,6,0,PK,1,1,D]);
  v.push([8,6,0,PK,1,1,D]);

  // Row 5 (body + name tag)
  v.push([0,5,0,S,1,1,D]); // left hand
  for(let x=1;x<=7;x++) v.push([x,5,0,PK,1,1,D]);
  v.push([2,5,0,WH,1,1,D]); // name tag
  v.push([8,5,0,S,1,1,D]); // right hand

  // Row 4 (holding clipboard in right hand)
  v.push([0,4,0,S,1,1,D]); // left hand
  for(let x=1;x<=7;x++) v.push([x,4,0,PK,1,1,D]);
  v.push([8,4,0,GY,1,1,D]); // clipboard
  v.push([9,4,0,GY,1,1,D]);
  v.push([9,5,0,WH,1,1,D]); // paper on clipboard
  v.push([9,6,0,WH,1,1,D]);

  // Row 3 (lower uniform / skirt)
  for(let x=1;x<=7;x++) v.push([x,3,0,PKD,1,1,D]);

  // Legs
  v.push([2,2,0,S,1,1,D]);
  v.push([3,2,0,S,1,1,D]);
  v.push([5,2,0,S,1,1,D]);
  v.push([6,2,0,S,1,1,D]);

  v.push([2,1,0,S,1,1,D]);
  v.push([3,1,0,S,1,1,D]);
  v.push([5,1,0,S,1,1,D]);
  v.push([6,1,0,S,1,1,D]);

  // Shoes (white nurse shoes)
  v.push([1,0,0,WH,1,1,D]);
  v.push([2,0,0,WH,1,1,D]);
  v.push([3,0,0,WH,1,1,D]);
  v.push([5,0,0,WH,1,1,D]);
  v.push([6,0,0,WH,1,1,D]);
  v.push([7,0,0,WH,1,1,D]);

  return v;
}

// ============================================================
// 医師（v2から再利用）
// ============================================================
function buildDoctor(){
  const v=[];
  const H=0x3a2a1a, BL=0x4090c8;

  for(let x=1;x<=7;x++) v.push([x,13,0,H,1,1,D]);
  for(let x=0;x<=8;x++) v.push([x,12,0,H,1,1,D]);
  v.push([0,11,0,H,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,11,0,S,1,1,D]);
  v.push([8,11,0,H,1,1,D]);
  v.push([0,10,0,H,1,1,D]); v.push([1,10,0,S,1,1,D]); v.push([2,10,0,E,1,1,D]);
  v.push([3,10,0,S,1,1,D]); v.push([4,10,0,S,1,1,D]); v.push([5,10,0,S,1,1,D]);
  v.push([6,10,0,E,1,1,D]); v.push([7,10,0,S,1,1,D]); v.push([8,10,0,H,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,9,0,S,1,1,D]);
  v.push([2,9,0,PKL,1,1,D]); v.push([6,9,0,PKL,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,8,0,S,1,1,D]);
  v.push([3,8,0,SD,1,1,D]); v.push([4,8,0,SD,1,1,D]); v.push([5,8,0,SD,1,1,D]);
  v.push([3,7,0,S,1,1,D]); v.push([4,7,0,S,1,1,D]); v.push([5,7,0,S,1,1,D]);
  for(let x=0;x<=8;x++) v.push([x,6,0,WH,1,1,D]);
  v.push([0,5,0,WH,1,1,D]); for(let x=1;x<=7;x++) v.push([x,5,0,WH,1,1,D]); v.push([8,5,0,WH,1,1,D]);
  v.push([0,4,0,S,1,1,D]); for(let x=1;x<=7;x++) v.push([x,4,0,WH,1,1,D]);
  v.push([3,4,0,BL,1,1,D]); v.push([4,4,0,BL,1,1,D]); v.push([8,4,0,S,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,3,0,WH,1,1,D]); v.push([4,3,0,BL,1,1,D]);
  v.push([2,2,0,NV,1,1,D]); v.push([3,2,0,NV,1,1,D]);
  v.push([5,2,0,NV,1,1,D]); v.push([6,2,0,NV,1,1,D]);
  v.push([2,1,0,NV,1,1,D]); v.push([3,1,0,NV,1,1,D]);
  v.push([5,1,0,NV,1,1,D]); v.push([6,1,0,NV,1,1,D]);
  v.push([1,0,0,SH,1,1,D]); v.push([2,0,0,SH,1,1,D]); v.push([3,0,0,SH,1,1,D]);
  v.push([5,0,0,SH,1,1,D]); v.push([6,0,0,SH,1,1,D]); v.push([7,0,0,SH,1,1,D]);

  return v;
}

// Place both side by side
const doctor = bm(buildDoctor());
doctor.position.set(-2,0,0);
scene.add(doctor);

const nurse = bm(buildNurse());
nurse.position.set(12,0,0);
scene.add(nurse);

scene.add(new THREE.GridHelper(30,15,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
