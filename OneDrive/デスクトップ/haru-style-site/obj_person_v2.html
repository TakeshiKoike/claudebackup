<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>人間ボクセル v2 — 一人を確実に</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">人間 v2 — 見本準拠（薄型ドット絵風、1人をしっかり）</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(12,10,12);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,5,0);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(10,20,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

// ============================================================
// 見本に合わせた人間
// 見本: 2.0 x 1.7 x 0.4 → ドット絵風、薄い
// 大きく作る: 各ピクセル=1ユニット、全体 約10x14x3
// 街に置くとき scale(0.15) → 約1.5x2.1x0.45 ≈ 見本サイズ
// ============================================================

const S=0xf0c8a0;  // skin
const SD=0xe0b890; // skin shadow
const H=0x3a2a1a;  // dark hair
const E=0x202020;  // eyes
const WH=0xf0f0e8; // white coat
const BL=0x4090c8;  // blue
const NV=0x2a3a6a;  // navy pants
const SH=0x3a3a3a;  // shoes
const PK=0xf0a0b0;  // pink accent

const v=[];

// Pixel art approach: build front face (x,y), depth z=0..2
// Each "pixel" is 1x1x3 (thin depth of 3 units)
const D=3; // depth

// === Hair (top of head) ===
// Row 13 (top)
for(let x=1;x<=7;x++) v.push([x,13,0,H,1,1,D]);
// Row 12
for(let x=0;x<=8;x++) v.push([x,12,0,H,1,1,D]);

// === Face ===
// Row 11 (forehead + hair sides)
v.push([0,11,0,H,1,1,D]);
for(let x=1;x<=7;x++) v.push([x,11,0,S,1,1,D]);
v.push([8,11,0,H,1,1,D]);

// Row 10 (eyes)
v.push([0,10,0,H,1,1,D]);
v.push([1,10,0,S,1,1,D]);
v.push([2,10,0,E,1,1,D]);  // left eye
v.push([3,10,0,S,1,1,D]);
v.push([4,10,0,S,1,1,D]);
v.push([5,10,0,S,1,1,D]);
v.push([6,10,0,E,1,1,D]);  // right eye
v.push([7,10,0,S,1,1,D]);
v.push([8,10,0,H,1,1,D]);

// Row 9 (nose/cheeks)
for(let x=1;x<=7;x++) v.push([x,9,0,S,1,1,D]);
v.push([2,9,0,PK,1,1,D]);  // blush left
v.push([6,9,0,PK,1,1,D]);  // blush right

// Row 8 (mouth)
for(let x=1;x<=7;x++) v.push([x,8,0,S,1,1,D]);
v.push([3,8,0,SD,1,1,D]);  // mouth left
v.push([4,8,0,SD,1,1,D]);  // mouth center
v.push([5,8,0,SD,1,1,D]);  // mouth right

// === Neck ===
// Row 7
v.push([3,7,0,S,1,1,D]);
v.push([4,7,0,S,1,1,D]);
v.push([5,7,0,S,1,1,D]);

// === White coat / body ===
// Row 6 (shoulders)
for(let x=0;x<=8;x++) v.push([x,6,0,WH,1,1,D]);

// Row 5 (upper body + arms)
v.push([0,5,0,WH,1,1,D]);  // left arm
for(let x=1;x<=7;x++) v.push([x,5,0,WH,1,1,D]);
v.push([8,5,0,WH,1,1,D]);  // right arm

// Row 4 (body + stethoscope)
v.push([0,4,0,S,1,1,D]);   // left hand
for(let x=1;x<=7;x++) v.push([x,4,0,WH,1,1,D]);
v.push([3,4,0,BL,1,1,D]);  // stethoscope
v.push([4,4,0,BL,1,1,D]);
v.push([8,4,0,S,1,1,D]);   // right hand

// Row 3 (lower body)
for(let x=1;x<=7;x++) v.push([x,3,0,WH,1,1,D]);
v.push([4,3,0,BL,1,1,D]);  // stethoscope end

// === Pants ===
// Row 2
v.push([2,2,0,NV,1,1,D]);
v.push([3,2,0,NV,1,1,D]);
v.push([4,2,0,NV,1,1,D]); // gap
v.push([5,2,0,NV,1,1,D]);
v.push([6,2,0,NV,1,1,D]);

// Row 1 (lower legs)
v.push([2,1,0,NV,1,1,D]);
v.push([3,1,0,NV,1,1,D]);
v.push([5,1,0,NV,1,1,D]);
v.push([6,1,0,NV,1,1,D]);

// === Shoes ===
// Row 0
v.push([1,0,0,SH,1,1,D]);
v.push([2,0,0,SH,1,1,D]);
v.push([3,0,0,SH,1,1,D]);
v.push([5,0,0,SH,1,1,D]);
v.push([6,0,0,SH,1,1,D]);
v.push([7,0,0,SH,1,1,D]);

const person = bm(v);
scene.add(person);

// Add a scale reference cube (1 unit)
const ref = bm([[-3,0,0,0xcccccc]]);
scene.add(ref);

// Grid
scene.add(new THREE.GridHelper(30,15,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
