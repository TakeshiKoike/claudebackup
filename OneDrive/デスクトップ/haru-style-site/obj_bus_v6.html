<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>バス v6</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">バス v6</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(10,7,10);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(4,2.5,1.5);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(15,25,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
window.camera=camera;

// ボクセル生成: [x,y,z,color] で1x1x1ボックスを配置
// x,y,zはボックスの左下奥隅（0始点）
function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const d of data){
    const x=d[0]+0.5, y=d[1]+0.5, z=d[2]+0.5;
    c.set(d[3]);
    const sx=d[4]||1, sy=d[5]||1, sz=d[6]||1;
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildBus(){
  const v=[];

  // 色
  const Y1=0xf0d040; // 黄色メイン（明るい）
  const Y2=0xd8b828; // 黄色暗め（下部）
  const RF=0xf0e8d8; // 屋根クリーム
  const GL=0x80c0e0; // ガラス
  const BK=0x222222; // 黒
  const BR=0x6a4a28; // 茶
  const MT=0x999999; // メタル
  const WH=0xf0f0e0; // 白
  const RD=0xc83828; // 赤
  const OR=0xe88830; // オレンジ

  // バス: 9(L) x 5(H) x 4(W) ボクセル
  // 断面図 (左壁 z=0 側から見た面):
  // y4: [RF RF RF RF RF RF RF RF RF]  ← 屋根
  // y3: [Y1 GL GL Y1 GL GL Y1 GL Y1]  ← 窓列上
  // y2: [Y1 GL GL Y1 GL GL Y1 GL Y1]  ← 窓列下
  // y1: [Y2 Y2 Y2 Y2 Y2 Y2 Y2 Y2 Y2]  ← 下部
  // y0: [BR ■■ BR BR BR BR ■■ BR BR]  ← フレーム+タイヤ

  // --- y=0: シャシー（タイヤ隙間あり） ---
  for(let x=0;x<9;x++) for(let z=0;z<4;z++){
    // タイヤ位置にはシャシーを置かない
    const isTireX = (x===1||x===2||x===6||x===7);
    if(!isTireX){
      v.push([x,0,z,BR]);
    }
  }

  // --- タイヤ（車体の外にはみ出す、しっかり見える） ---
  for(const tx of [1.5,6.5]){
    for(const tz of [-0.3,3.3]){
      v.push([tx,0,tz,BK,1.5,1.5,0.7]);
      // ホイール
      v.push([tx,0,tz<0?tz-0.15:tz+0.15,MT,0.7,0.7,0.15]);
    }
  }

  // --- y=1: 車体下部（暗い黄色） ---
  for(let x=0;x<9;x++) for(let z=0;z<4;z++){
    v.push([x,1,z,Y2]);
  }

  // --- y=2,3: 車体上部（窓付き） ---
  // 左壁(z=0) と 右壁(z=3)
  for(const zw of [0,3]){
    for(let x=0;x<9;x++){
      for(let y=2;y<=3;y++){
        // 窓位置: x=1-3(3幅), x=5-7(3幅) ← 大きな窓2つ
        const isWin = (x>=1&&x<=3)||(x>=5&&x<=7);
        v.push([x,y,zw, isWin?GL:Y1]);
      }
    }
  }
  // 前壁(x=0前面)
  for(let z=0;z<4;z++){
    for(let y=2;y<=3;y++){
      const isFG = z>=1&&z<=2;
      v.push([0,y,z, isFG?GL:Y1]);
    }
  }
  // 後壁(x=8後面)
  for(let z=0;z<4;z++){
    v.push([8,2,z,Y1]);
    const isRG = z>=1&&z<=2;
    v.push([8,3,z, isRG?GL:Y1]);
  }
  // 天井面（y=2,3の内側の天井は不要、上はy=4の屋根で塞ぐ）

  // --- y=4: 屋根 ---
  for(let x=0;x<9;x++) for(let z=0;z<4;z++){
    v.push([x,4,z,RF]);
  }

  // === ディテール ===

  // ヘッドライト（前面、大きく目立つ）
  v.push([-0.4,1,0,WH,0.5,0.8,0.8]);
  v.push([-0.4,1,3,WH,0.5,0.8,0.8]);

  // バンパー前（太め）
  v.push([-0.3,0.5,0,MT,0.35,0.4,4]);

  // 行先表示板（前面窓上、目立つ）
  v.push([-0.2,3.5,0.5,BR,0.25,0.5,2.8]);
  v.push([-0.15,3.6,0.7,WH,0.15,0.3,2.4]);

  // テールライト（大きめ）
  v.push([8.4,1,0,RD,0.5,0.8,0.8]);
  v.push([8.4,1,3,RD,0.5,0.8,0.8]);

  // バンパー後（太め）
  v.push([8.4,0.5,0,MT,0.35,0.4,4]);

  // サイドミラー（小さいキューブ）
  v.push([-0.3,3,-0.3,MT,0.25,0.3,0.3]);
  v.push([-0.3,3,3.8,MT,0.25,0.3,0.3]);

  // ドアライン（左壁 z=0, x=3）薄い溝
  v.push([3.4,1.5,-0.06,BR,0.06,1.8,0.06]);

  return v;
}

scene.add(bm(buildBus()));
scene.add(new THREE.GridHelper(24,12,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
