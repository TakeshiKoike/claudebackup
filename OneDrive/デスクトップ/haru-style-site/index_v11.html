<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>医療の街ジオラマ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-daytime: #f0e2bb;
      --bg-night: #1a295c;
      --text-daytime: #422612;
      --text-night: #c8d8f0;
      --accent: #e05030;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text-daytime);
      background-color: var(--bg-daytime);
      transition: background-color 0.8s, color 0.8s;
    }
    body.is-night { background-color: var(--bg-night); color: var(--text-night); }

    .canvas-view {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1; cursor: grab;
    }
    .canvas-view:active { cursor: grabbing; }
    .canvas-view canvas {
      width: 100%; height: 100%; display: block;
      filter: saturate(1.1) contrast(1.05);
    }

    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-daytime); z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-text { font-size: 14px; color: var(--text-daytime); }

    .card-container {
      position: fixed; top: 50%; left: 60px;
      transform: translateY(-50%) translateX(-20px);
      z-index: 10; width: 400px; max-width: 40vw;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
      border-radius: 16px; padding: 32px 36px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      opacity: 0; transition: opacity 0.5s, transform 0.5s;
    }
    .card-container.show { opacity: 1; transform: translateY(-50%) translateX(0); }
    body.is-night .card-container { background: rgba(14,27,61,0.92); }

    .card-title-en {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
    }
    .card-title { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
    .card-description { font-size: 12px; line-height: 1.8; opacity: 0.6; margin-top: 12px; }
    .card-subtitle { font-size: 14px; line-height: 1.7; opacity: 0.8; white-space: pre-line; }

    .card-dots { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .card-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(26,58,74,0.2); cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    .card-dot.active { background: var(--accent); transform: scale(1.3); }
    body.is-night .card-dot { background: rgba(200,216,240,0.25); }
    body.is-night .card-dot.active { background: var(--accent); }

    .appearance-toggle {
      position: fixed; top: 24px; right: 24px; z-index: 20;
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 20px; transition: background 0.3s;
    }
    .appearance-toggle:hover { background: rgba(255,255,255,0.9); }
    body.is-night .appearance-toggle { background: rgba(14,27,61,0.7); }

    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; padding: 16px 24px; gap: 32px;
    }
    .top-nav-logo { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
    .top-nav-links { display: flex; gap: 24px; margin-left: auto; }
    .top-nav-links a {
      font-size: 12px; font-weight: 700; text-decoration: none;
      color: inherit; opacity: 0.6; transition: opacity 0.2s;
    }
    .top-nav-links a:hover { opacity: 1; }

    .noise-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5; pointer-events: none; opacity: 0.03;
      background-image: url('images/common/noise.png'); background-repeat: repeat;
    }

    @media (max-width: 768px) {
      .card-container {
        top: auto; bottom: 24px; left: 16px; right: 16px;
        width: auto; max-width: none; transform: translateY(20px); padding: 24px;
      }
      .card-container.show { transform: translateY(0); }
      .card-title { font-size: 20px; }
      .top-nav-links { display: none; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading"><div class="loading-text">島を構築中...</div></div>
  <div class="noise-overlay"></div>
  <div class="canvas-view" id="canvas-view"><canvas id="canvas"></canvas></div>
  <button class="appearance-toggle" id="appearance-toggle">🌙</button>

  <nav class="top-nav">
    <div class="top-nav-logo">医療の街</div>
    <div class="top-nav-links">
      <a href="#">総合病院</a><a href="#">ヘリポート</a><a href="#">訪問看護</a>
      <a href="#">薬局</a><a href="#">研修センター</a><a href="#">お問い合わせ</a>
    </div>
  </nav>

  <div class="card-container" id="card">
    <div class="card-title-en" id="card-title-en"></div>
    <div class="card-title" id="card-title"></div>
    <div class="card-subtitle" id="card-subtitle"></div>
    <div class="card-description" id="card-description"></div>
    <div class="card-dots" id="card-dots"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }}
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ============================================================
    // 医療離島ジオラマ — haru-ni.net骨格流用
    // ============================================================

    // Color palette (shared voxel colors)
    const C = {
      grass1: 0x5a9e4b, grass2: 0x4a8e3b, grass3: 0x6ab85a,
      dirt: 0x8b6b4a, dirtDark: 0x6b4b2a, rock: 0x7a7a7a, rockDark: 0x5a5a5a,
      sand: 0xe8d8a0, water: 0x4a90c8, waterDeep: 0x2a6098,
      white: 0xf0f0f0, wallWhite: 0xe8e8e0, wallCream: 0xf0e8d0,
      roof: 0xc85030, roofBlue: 0x4070a0, roofGreen: 0x408060,
      wood: 0x9a7a50, woodDark: 0x7a5a30,
      red: 0xe04030, orange: 0xf09030, yellow: 0xf0d040,
      blue: 0x4080d0, lightBlue: 0x80c0e0, darkBlue: 0x203060,
      green: 0x40a050, darkGreen: 0x2a6030,
      concrete: 0xb0b0a8, asphalt: 0x606060,
      helipad: 0xd0d0c8, heliYellow: 0xf0d000,
      glass: 0xa0d8e8, metalGray: 0x808890,
      skin: 0xf0c8a0, nurseWhite: 0xf8f8f8, doctorBlue: 0x5090c0,
      pink: 0xf0a0b0, flower1: 0xf06080, flower2: 0xf0e040, flower3: 0xa060d0,
      trunk: 0x6a4a2a, leaves1: 0x3a8a3a, leaves2: 0x50a050, leaves3: 0x2a7a2a,
      lighthouse: 0xf0f0e0, lighthouseRed: 0xd04030,
      boat: 0xd0c0a0, boatRed: 0xc04030,
    };

    const CARDS = [
      { title: "総合病院", titleEn: "Hospital",
        subtitle: "地域医療の中核\n24時間救急対応",
        description: "内科・外科・小児科・産婦人科を備えた総合病院。最新の遠隔診療システムも導入しています。",
        birdRadianFrom: 0.5 },
      { title: "ヘリポート", titleEn: "Heliport",
        subtitle: "緊急搬送の命綱\nドクターヘリ発着場",
        description: "重症患者を高度医療機関へ搬送するための緊急ヘリポート。24時間離着陸可能です。",
        birdRadianFrom: 1.5 },
      { title: "訪問看護ステーション", titleEn: "Home Nursing",
        subtitle: "地域に寄り添う\n在宅ケアの拠点",
        description: "訪問看護師が地域を巡回し、在宅療養中の患者さんのケアを行っています。",
        birdRadianFrom: 2.8 },
      { title: "薬局・調剤センター", titleEn: "Pharmacy",
        subtitle: "くすりと健康の\nよろず相談所",
        description: "処方薬の調剤から健康相談まで。お薬手帳の電子化にも対応しています。",
        birdRadianFrom: 3.8 },
      { title: "研修センター", titleEn: "Training Center",
        subtitle: "次世代の医療人を\n育てる学びの場",
        description: "看護学生・医学生の実習受け入れ、シミュレーション教育を行っています。",
        birdRadianFrom: 5.0 },
      { title: "お問い合わせ", titleEn: "Contact",
        subtitle: "医療の街に興味のある方\nお気軽にご連絡ください",
        description: "見学・研修プログラムへの参加をお待ちしています。",
        birdRadianFrom: 5.8 },
    ];

    let scene, camera, renderer, mainGroup;
    let isDaytime = true, currentCardIndex = 0;
    let birdRadian = 0, birdRadianTarget = 0.5, birdAutoRotate = 0;
    let isDragging = false, dragStartX = 0, dragCurrent = 0, dragTarget = 0;
    const clock = new THREE.Clock();

    // ============================================================
    // Merged voxel builder (vertex colors, single draw call)
    // ============================================================
    function mergedVoxels(voxelData) {
      const positions = [], normals = [], colors = [];
      const color = new THREE.Color();
      const box = new THREE.BoxGeometry(1,1,1);
      const pa = box.attributes.position, na = box.attributes.normal, ix = box.index;
      for (const [x,y,z,c,sx=1,sy=1,sz=1] of voxelData) {
        color.set(c);
        for (let i = 0; i < ix.count; i++) {
          const vi = ix.getX(i);
          positions.push(pa.getX(vi)*sx+x, pa.getY(vi)*sy+y, pa.getZ(vi)*sz+z);
          normals.push(na.getX(vi), na.getY(vi), na.getZ(vi));
          colors.push(color.r, color.g, color.b);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
      mesh.castShadow = true; mesh.receiveShadow = true;
      return mesh;
    }

    // ============================================================
    // Build city — haru-ni.net風の密集ボクセル街（医療テーマ）
    // 1ボクセル = 0.5単位（細かいピクセル感）
    // ============================================================
    function buildCity() {
      const group = new THREE.Group();
      const v = [];
      const S = 0.5; // voxel size

      // Helper: box of voxels
      function box(bx, by, bz, w, h, d, c) {
        for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) for (let z = 0; z < d; z++)
          v.push([bx+x*S, by+y*S, bz+z*S, c, S, S, S]);
      }
      // Helper: single voxel
      function sv(x,y,z,c,s=S) { v.push([x,y,z,c,s,s,s]); }

      // === Ground platform (green base like haru-ni.net) ===
      for (let x = -30; x < 30; x++) for (let z = -24; z < 24; z++) {
        const d = (x*x)/(30*30) + (z*z)/(24*24);
        if (d < 1) {
          const c = Math.random()>0.4 ? C.grass1 : (Math.random()>0.5 ? C.grass2 : C.grass3);
          v.push([x*S, 0, z*S, c, S, S*0.6, S]);
        }
      }
      // Underground layers
      for (let layer = -1; layer >= -6; layer--) {
        const r = 30 + layer * 2;
        const rz = 24 + layer * 1.5;
        for (let x = -r; x < r; x+=1) for (let z = -rz; z < rz; z+=1) {
          if ((x*x)/(r*r) + (z*z)/(rz*rz) < 1)
            v.push([x*S, layer*S, z*S, layer>-3?C.dirt:(Math.random()>0.3?C.rock:C.rockDark), S,S,S]);
        }
      }

      // === Roads (asphalt) ===
      for (let x = -28; x < 28; x++) {
        v.push([x*S, 0.3, 0, C.asphalt, S, S*0.1, S*3]);
        v.push([x*S, 0.3, 10*S, C.asphalt, S, S*0.1, S*3]);
      }
      for (let z = -22; z < 22; z++) {
        v.push([0, 0.3, z*S, C.asphalt, S*3, S*0.1, S]);
        v.push([-14*S, 0.3, z*S, C.asphalt, S*3, S*0.1, S]);
      }
      // Sidewalks
      for (let x = -28; x < 28; x++) {
        v.push([x*S, 0.35, -2*S, C.concrete, S, S*0.15, S]);
        v.push([x*S, 0.35, 2*S, C.concrete, S, S*0.15, S]);
      }

      // === 1. Hospital (large, center-right, tall) ===
      const hx=4, hz=-8;
      box(hx*S, S*0.5, hz*S, 16, 20, 14, C.wallWhite);
      // Roof
      box(hx*S-S, S*0.5+20*S, hz*S-S, 18, 2, 16, C.roofBlue);
      // Red cross
      for (let dy=8; dy<16; dy++) sv(hx*S-0.01, S*0.5+dy*S, (hz+7)*S, C.red);
      for (let dz=4; dz<11; dz++) sv(hx*S-0.01, S*0.5+12*S, (hz+dz)*S, C.red);
      // Windows (rows)
      for (let floor=0; floor<4; floor++) for (let wz=1; wz<13; wz+=2) {
        sv((hx+16)*S+0.01, S*0.5+(3+floor*5)*S, (hz+wz)*S, C.glass);
        sv((hx+16)*S+0.01, S*0.5+(4+floor*5)*S, (hz+wz)*S, C.glass);
        sv(hx*S-0.01, S*0.5+(3+floor*5)*S, (hz+wz)*S, C.glass);
        sv(hx*S-0.01, S*0.5+(4+floor*5)*S, (hz+wz)*S, C.glass);
      }
      // Entrance
      box(hx*S-0.01, S*0.5, (hz+5)*S, 1, 5, 4, C.lightBlue);
      // Rooftop equipment
      box((hx+6)*S, S*0.5+22*S, (hz+4)*S, 4, 3, 4, C.metalGray);
      box((hx+12)*S, S*0.5+22*S, (hz+8)*S, 3, 2, 3, C.metalGray);

      // === 2. Heliport (on hospital roof) ===
      box((hx+2)*S, S*0.5+22*S, (hz-2)*S, 10, 1, 10, C.helipad);
      // H
      for (let i=0;i<6;i++) { sv((hx+4)*S, S*0.5+22.5*S, (hz+i)*S, C.heliYellow); sv((hx+8)*S, S*0.5+22.5*S, (hz+i)*S, C.heliYellow); }
      for (let i=4;i<=8;i++) sv((hx+i)*S, S*0.5+22.5*S, (hz+3)*S, C.heliYellow);
      // Helicopter
      box((hx+5)*S, S*0.5+23*S, (hz+1)*S, 5, 3, 3, C.red);
      box((hx+10)*S, S*0.5+23.5*S, (hz+2)*S, 3, 1, 1, C.metalGray);
      v.push([(hx+6)*S, S*0.5+26*S, (hz+2.5)*S, C.metalGray, S*0.3, S*0.3, S*7]);

      // === 3. Nursing station (left) ===
      const nx=-18, nz=4;
      box(nx*S, S*0.5, nz*S, 12, 10, 10, C.wallCream);
      box(nx*S-S, S*0.5+10*S, nz*S-S, 14, 2, 12, C.roofGreen);
      // Pink cross
      for (let dy=3;dy<8;dy++) sv((nx+12)*S+0.01, S*0.5+dy*S, (nz+5)*S, C.pink);
      for (let dz=2;dz<8;dz++) sv((nx+12)*S+0.01, S*0.5+5*S, (nz+dz)*S, C.pink);
      // Windows
      for (let wz=1;wz<9;wz+=2) {
        sv((nx+12)*S+0.01, S*0.5+3*S, (nz+wz)*S, C.glass);
        sv((nx+12)*S+0.01, S*0.5+7*S, (nz+wz)*S, C.glass);
      }
      // Bike (nursing vehicle)
      sv((nx+13)*S, S*0.5, (nz+3)*S, C.pink, S*2);
      sv((nx+13)*S, S*0.5+S, (nz+3)*S, C.nurseWhite, S);

      // === 4. Pharmacy (small, right of road) ===
      const fx=10, fz=5;
      box(fx*S, S*0.5, fz*S, 8, 8, 8, C.wallWhite);
      box(fx*S-S, S*0.5+8*S, fz*S-S, 10, 2, 10, C.roof);
      // Green cross (pharmacy symbol)
      for (let dy=2;dy<6;dy++) sv(fx*S-0.01, S*0.5+dy*S, (fz+4)*S, C.green);
      for (let dz=2;dz<6;dz++) sv(fx*S-0.01, S*0.5+4*S, (fz+dz)*S, C.green);

      // === 5. Training center (back-left) ===
      const tx=-10, tz=-14;
      box(tx*S, S*0.5, tz*S, 14, 14, 10, C.wallWhite);
      box(tx*S-S, S*0.5+14*S, tz*S-S, 16, 2, 12, C.roofBlue);
      // Clock tower
      box((tx+5)*S, S*0.5+14*S, (tz+3)*S, 4, 8, 4, C.wallCream);
      box((tx+5)*S-S*0.5, S*0.5+22*S, (tz+3)*S-S*0.5, 5, 2, 5, C.roofBlue);
      // Clock face
      sv((tx+5)*S-0.01, S*0.5+18*S, (tz+5)*S, C.wallWhite, S*3);
      sv((tx+5)*S-0.01, S*0.5+19*S, (tz+5)*S, C.darkBlue, S*0.3);

      // === Small buildings (dense fill) ===
      const smalls = [
        [-6,-6,6,6,C.wallCream,C.roof], [16,-4,6,6,C.orange,C.roofGreen],
        [-22,-8,6,8,C.wallWhite,C.roofBlue], [20,8,6,6,C.wallCream,C.roof],
        [-8,12,8,6,C.wallWhite,C.roofGreen], [16,12,6,8,C.orange,C.roofBlue],
        [-20,14,6,6,C.wallCream,C.roof], [6,14,8,6,C.wallWhite,C.roofGreen],
        [22,-10,6,6,C.wallCream,C.roofBlue], [-24,0,6,6,C.orange,C.roof],
        [-4,8,4,8,C.wallWhite,C.roofBlue], [24,2,6,6,C.wallCream,C.roofGreen],
      ];
      for (const [bx,bz,bw,bd,wc,rc] of smalls) {
        const bh = 4 + Math.floor(Math.random()*8);
        box(bx*S, S*0.5, bz*S, bw, bh, bd, wc);
        box(bx*S-S, S*0.5+bh*S, bz*S-S, bw+2, 1, bd+2, rc);
        // Windows
        for (let wy=2;wy<bh;wy+=3) for (let wz=1;wz<bd-1;wz+=2) {
          sv((bx+bw)*S+0.01, S*0.5+wy*S, (bz+wz)*S, C.glass);
        }
      }

      // === Trees ===
      const treePositions = [];
      for (let i=0; i<50; i++) {
        const ttx = (Math.random()*52-26);
        const ttz = (Math.random()*40-20);
        if ((ttx*ttx)/(28*28)+(ttz*ttz)/(22*22) < 0.85) treePositions.push([ttx, ttz]);
      }
      for (const [ttx, ttz] of treePositions) {
        const h = 3+Math.floor(Math.random()*4);
        for (let y=0;y<h;y++) sv(ttx*S, S*0.5+y*S, ttz*S, C.trunk, S*0.5);
        const lc = [C.leaves1,C.leaves2,C.leaves3][Math.floor(Math.random()*3)];
        for (let dx=-1;dx<=1;dx++) for (let dz=-1;dz<=1;dz++) for (let dy=0;dy<=1;dy++) {
          if (Math.abs(dx)+Math.abs(dz)+dy<3)
            sv((ttx+dx)*S, S*0.5+(h+dy)*S, (ttz+dz)*S, lc);
        }
      }

      // === Flowers ===
      for (let i=0;i<80;i++) {
        const ffx=(Math.random()*50-25), ffz=(Math.random()*40-20);
        if ((ffx*ffx)/(28*28)+(ffz*ffz)/(22*22)<0.8) {
          const fc=[C.flower1,C.flower2,C.flower3,C.pink][Math.floor(Math.random()*4)];
          sv(ffx*S, S*0.5, ffz*S, fc, S*0.4);
        }
      }

      // === People (tiny) ===
      const peopleData = [
        [5,0,-6,C.doctorBlue], [7,0,-6,C.nurseWhite], [3,0,-6,C.nurseWhite],
        [-16,0,8,C.nurseWhite], [-14,0,9,C.pink],
        [12,0,7,C.green], [-8,0,-12,C.blue],
        [0,0,2,C.orange], [18,0,10,C.doctorBlue],
        [-20,0,16,C.nurseWhite], [8,0,16,C.skin],
      ];
      for (const [px2,py2,pz2,pc] of peopleData) {
        sv(px2*S, S*0.5+py2*S, pz2*S, C.skin, S*0.4);
        sv(px2*S, S*0.5+(py2+0.6)*S, pz2*S, pc, S*0.5);
      }

      // === Ambulance ===
      box(3*S, S*0.5, -5*S, 5, 3, 3, C.wallWhite);
      v.push([3*S, S*0.5+3*S, -5*S, C.red, S*5*0.5, S*0.5, S*3*0.5]);

      // === Street lamps ===
      for (let lx2=-24;lx2<24;lx2+=8) {
        for (let y2=0;y2<6;y2++) sv(lx2*S, S*0.5+y2*S, -2.5*S, C.metalGray, S*0.3);
        sv(lx2*S, S*0.5+6*S, -2.5*S, C.yellow, S*0.6);
      }

      // === Bench/park area ===
      const parkX=-2, parkZ=6;
      for (let x2=0;x2<6;x2++) for (let z2=0;z2<6;z2++) {
        sv((parkX+x2)*S, S*0.35, (parkZ+z2)*S, C.grass3, S);
      }
      // Benches
      box((parkX+1)*S, S*0.5, (parkZ+1)*S, 4, 1, 1, C.wood);
      box((parkX+1)*S, S*0.5, (parkZ+4)*S, 4, 1, 1, C.wood);

      // Build merged mesh
      group.add(mergedVoxels(v));

      // Floor with circular fade
      const floorGeo = new THREE.PlaneGeometry(120, 120);
      const floorMat = new THREE.MeshLambertMaterial({ color: 0xe0c67b, transparent: true, opacity: 0.4 });
      floorMat.onBeforeCompile = (shader) => {
        shader.vertexShader = 'varying vec3 vWP;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace('void main() {', 'void main() {\nvWP = (modelMatrix * vec4(position, 1.0)).xyz;');
        shader.fragmentShader = 'varying vec3 vWP;\n' + shader.fragmentShader;
        shader.fragmentShader = shader.fragmentShader.replace('#include <dithering_fragment>',
          '#include <dithering_fragment>\ngl_FragColor.a *= max(0.0, 1.0 - (vWP.x*vWP.x+vWP.z*vWP.z)/3600.0);');
      };
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI/2; floor.position.y = -3; floor.receiveShadow = true;
      group.add(floor);

      return group;
    }

    // ============================================================
    // Init (same skeleton as v9)
    // ============================================================
    async function init() {
      const canvas = document.getElementById('canvas');
      renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0.878, 0.776, 0.482);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 3, 300);

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambient);

      const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
      sun.position.set(40, 60, 30);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -60;
      sun.shadow.camera.right = 60;
      sun.shadow.camera.top = 60;
      sun.shadow.camera.bottom = -60;
      sun.shadow.camera.near = 10;
      sun.shadow.camera.far = 150;
      scene.add(sun);

      const fill = new THREE.DirectionalLight(0xc0d8f0, 0.5);
      fill.position.set(-30, 20, -20);
      scene.add(fill);

      // Build island
      mainGroup = buildCity();
      scene.add(mainGroup);

      onResize();
      window.addEventListener('resize', onResize);

      document.getElementById('loading').classList.add('hidden');
      setTimeout(() => {
        document.getElementById('card').classList.add('show');
        updateCard(0);
      }, 400);

      setupDots();
      setupEvents();
      animate();
    }

    // ============================================================
    // Card, events, camera — same as v9
    // ============================================================
    function updateCard(index) {
      currentCardIndex = index;
      const card = CARDS[index];
      document.getElementById('card-title-en').textContent = card.titleEn;
      document.getElementById('card-title').textContent = card.title;
      document.getElementById('card-subtitle').textContent = card.subtitle;
      document.getElementById('card-description').textContent = card.description;
      document.querySelectorAll('.card-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
      birdRadianTarget = card.birdRadianFrom;
    }

    function setupDots() {
      const dc = document.getElementById('card-dots');
      CARDS.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'card-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => updateCard(i));
        dc.appendChild(dot);
      });
    }

    function toggleAppearance() {
      isDaytime = !isDaytime;
      document.body.classList.toggle('is-night', !isDaytime);
      document.getElementById('appearance-toggle').textContent = isDaytime ? '🌙' : '☀️';

      const tc = isDaytime ? {r:0.878,g:0.776,b:0.482} : {r:0.1,g:0.16,b:0.36};
      const bg = {r: scene.background.r, g: scene.background.g, b: scene.background.b};
      gsap.to(bg, {
        r: tc.r, g: tc.g, b: tc.b, duration: 0.8,
        onUpdate: () => scene.background.setRGB(bg.r, bg.g, bg.b),
      });

      scene.traverse((child) => {
        if (child.isAmbientLight) gsap.to(child, { intensity: isDaytime ? 1.2 : 0.3, duration: 0.8 });
        if (child.isDirectionalLight) gsap.to(child, { intensity: isDaytime ? 2.0 : 0.3, duration: 0.8 });
      });
    }

    function setupEvents() {
      const view = document.getElementById('canvas-view');
      view.addEventListener('mousedown', onDragStart);
      view.addEventListener('mousemove', onDragMove);
      view.addEventListener('mouseup', onDragEnd);
      view.addEventListener('mouseleave', onDragEnd);
      view.addEventListener('touchstart', onDragStart, { passive: true });
      view.addEventListener('touchmove', onDragMove, { passive: true });
      view.addEventListener('touchend', onDragEnd);
      document.body.addEventListener('wheel', onWheel, { passive: false });
      document.getElementById('appearance-toggle').addEventListener('click', toggleAppearance);
    }

    function getClientX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
    function onDragStart(e) { isDragging = true; dragStartX = getClientX(e); }
    function onDragMove(e) {
      if (!isDragging) return;
      const x = getClientX(e);
      dragTarget -= (x - dragStartX) / 3000;
      dragStartX = x;
    }
    function onDragEnd() { isDragging = false; }
    function onWheel(e) {
      e.preventDefault();
      if (Math.abs(e.deltaY) < 10) return;
      const dir = e.deltaY > 0 ? 1 : -1;
      const next = Math.max(0, Math.min(CARDS.length - 1, currentCardIndex + dir));
      if (next !== currentCardIndex) updateCard(next);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateBirdCamera(dt) {
      dragCurrent += (dragTarget - dragCurrent) * Math.min(0.004 * dt, 1);
      birdAutoRotate += dt / 10000;
      birdRadian += (birdRadianTarget - birdRadian) * 0.03;

      const totalRadian = birdRadian + birdAutoRotate + dragCurrent;
      const radius = 65;
      const height = 40;

      camera.position.set(
        radius * Math.sin(totalRadian),
        height,
        radius * Math.cos(totalRadian)
      );
      camera.rotation.order = 'YXZ';
      camera.rotation.set(-0.45, -totalRadian + Math.PI, 0);
      camera.setFocalLength(18);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta() * 1000;
      updateBirdCamera(dt);
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);
    }

    init().catch(console.error);
  </script>
</body>
</html>
