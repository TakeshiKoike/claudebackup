<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>路面電車 v2</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">路面電車 v2 — 見本準拠</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(20,12,18);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(10,4,3);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(15,25,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildTram(){
  const v=[];

  const YL=0xe0c848;   // yellow upper
  const CR=0xf0e8d0;   // cream lower
  const BRN=0x8a6040;  // brown trim/frames
  const BRND=0x5a3a20; // dark brown (undercarriage)
  const GL=0xa8d0e8;   // glass
  const GLD=0x88b0c8;  // glass darker
  const BK=0x303030;
  const MT=0x707070;
  const RD=0xc83828;   // red light
  const YLL=0xf0e060;  // yellow light
  const WH=0xf0f0e0;
  const OR=0xd8a030;   // orange/gold trim

  // 電車: 20L(x) x 8H(y) x 7W(z)
  // ドット絵的に1ボクセル=1単位で丁寧に

  // === 車体下部（茶色フレーム） ===
  for(let x=1;x<19;x++) for(let z=0;z<7;z++) v.push([x,0,z,BRND]);
  // 前後の角を丸める（1ボクセル削る）
  for(let z=1;z<6;z++) v.push([0,0,z,BRND]);
  for(let z=1;z<6;z++) v.push([19,0,z,BRND]);

  // === 車輪（茶色） ===
  for(const wx of [2,5,14,17]){
    v.push([wx,-1,0,BRND,1,1,1]);
    v.push([wx,-1,6,BRND,1,1,1]);
  }

  // === 下半分 クリーム色 (y=1,2) ===
  for(let x=1;x<19;x++) for(let z=0;z<7;z++){
    v.push([x,1,z,CR]); v.push([x,2,z,CR]);
  }
  // 前端（丸め）
  for(let z=1;z<6;z++){ v.push([0,1,z,CR]); v.push([0,2,z,CR]); }
  for(let z=1;z<6;z++){ v.push([19,1,z,CR]); v.push([19,2,z,CR]); }

  // === 茶色ライン（クリームと黄色の境） ===
  for(let x=0;x<20;x++){
    v.push([x,3,-0.1,OR,1,1,0.1]);
    v.push([x,3,7.1,OR,1,1,0.1]);
  }
  for(let z=0;z<7;z++){
    v.push([-0.1,3,z,OR,0.1,1,1]);
    v.push([19.1,3,z,OR,0.1,1,1]);
  }

  // === 上半分 黄色 (y=3,4,5,6) ===
  for(let x=1;x<19;x++) for(let y=3;y<=6;y++){
    v.push([x,y,0,YL]); v.push([x,y,6,YL]);
  }
  for(let z=1;z<6;z++) for(let y=3;y<=6;y++){
    v.push([1,y,z,YL]); v.push([18,y,z,YL]);
  }
  // 前後壁
  for(let z=1;z<6;z++) for(let y=3;y<=6;y++){
    v.push([0,y,z,YL]); v.push([19,y,z,YL]);
  }
  // 前端上部角を丸める
  for(let y=5;y<=6;y++){
    // 角を削除（黄色を置かない）→ 背景色で丸く見える
  }

  // === 窓 + 茶色窓枠 ===
  // 左側 (z=0面) — 4つの窓、各3幅x3高
  for(const wx of [3,7,11,15]){
    // 窓枠（茶色）
    v.push([wx-0.5,3,-0.1,BRN,4,5,0.15]);
    // ガラス（窓枠の内側）
    v.push([wx,4,-0.15,GL,3,3,0.15]);
    // 窓枠上部アーチ（丸みの表現）
    v.push([wx,6.5,-0.1,BRN,3,0.5,0.15]);
    v.push([wx+0.5,7,-0.1,BRN,2,0.5,0.15]);
  }
  // 右側 (z=6面)
  for(const wx of [3,7,11,15]){
    v.push([wx-0.5,3,6.1,BRN,4,5,0.15]);
    v.push([wx,4,6.15,GL,3,3,0.15]);
    v.push([wx,6.5,6.1,BRN,3,0.5,0.15]);
    v.push([wx+0.5,7,6.1,BRN,2,0.5,0.15]);
  }

  // === 前面窓（大きめ） ===
  v.push([-0.15,3,1,BRN,0.15,5,5]);
  v.push([-0.2,4,1.5,GL,0.2,3,4]);
  // 前面ワイパー的な装飾
  v.push([-0.25,5,3,BRND,0.25,0.3,0.3]);

  // === 後面窓 ===
  v.push([19.15,3,1,BRN,0.15,5,5]);
  v.push([19.2,4,1.5,GL,0.2,3,4]);

  // === ヘッドライト（前面） ===
  v.push([-0.3,2,1,YLL,0.3,1,1]);   // 左ヘッドライト（黄）
  v.push([-0.3,2,5,YLL,0.3,1,1]);   // 右ヘッドライト（黄）
  v.push([-0.3,1,1,RD,0.3,0.8,0.8]); // 左下ライト（赤）
  v.push([-0.3,1,5,RD,0.3,0.8,0.8]); // 右下ライト（赤）

  // === テールライト（後面） ===
  v.push([19.3,2,1,RD,0.3,1,1]);
  v.push([19.3,2,5,RD,0.3,1,1]);

  // === サイドミラー ===
  v.push([-0.5,5,0,BRN,0.5,0.5,0.5]);
  v.push([-0.5,5,6.5,BRN,0.5,0.5,0.5]);

  // === 屋根（少し丸みを持たせる） ===
  for(let x=0;x<20;x++) for(let z=0;z<7;z++) v.push([x,7,z,YL]);
  // 屋根上面にブラウンの縁
  for(let x=0;x<20;x++){
    v.push([x,7.5,-0.1,BRN,1,0.5,0.2]);
    v.push([x,7.5,6.9,BRN,1,0.5,0.2]);
  }
  for(let z=0;z<7;z++){
    v.push([-0.1,7.5,z,BRN,0.2,0.5,1]);
    v.push([19.1,7.5,z,BRN,0.2,0.5,1]);
  }

  // === 行先表示板（屋根上、大きく） ===
  // 板（黒地）
  for(let x=4;x<16;x++) v.push([x,8,2,BRND]);
  for(let x=4;x<16;x++) v.push([x,9,2,BRND]);
  // 枠（茶色）
  v.push([3,8,2,BRN,1,2,1]);
  v.push([16,8,2,BRN,1,2,1]);
  for(let x=3;x<=16;x++) v.push([x,10,2,BRN,1,0.5,1]);
  // 文字エリア（ドット文字風、黄色ドット）
  // "MEDICAL" をドットで表現（簡略化）
  const textDots = [
    // M
    [5,9],[5,8],[6,9],[7,9],[7,8],
    // E
    [8.5,9],[8.5,8],[9.5,9],[9.5,8.5],
    // D
    [11,9],[11,8],[12,9],[12,8],
    // I
    [13.5,9],[13.5,8],
    // C
    [15,9],[15,8],[14.5,9],
  ];
  for(const [dx,dy] of textDots) v.push([dx,dy,1.9,YLL,0.5,0.5,0.2]);

  // === ドア（左側中央） ===
  v.push([9,1,-0.15,BRN,2,6,0.15]);
  v.push([9.2,1.5,-0.2,GLD,1.6,5,0.2]);

  // === 内部シート（オレンジ） ===
  for(let x=2;x<9;x+=2){ v.push([x,1,1,OR,1,1,1]); v.push([x,1,5,OR,1,1,1]); }
  for(let x=12;x<18;x+=2){ v.push([x,1,1,OR,1,1,1]); v.push([x,1,5,OR,1,1,1]); }

  // === つり革バー ===
  v.push([2,6,3,MT,16,0.3,0.3]);

  return v;
}

scene.add(bm(buildTram()));

// 線路
{const rv=[];
const _MT=0x707070, _BR=0x5a3a20;
for(let x=-3;x<25;x++){
  rv.push([x,-1.5,0.5,_MT,1,0.5,0.5]);
  rv.push([x,-1.5,5.5,_MT,1,0.5,0.5]);
}
for(let x=-3;x<25;x+=2) rv.push([x,-1.5,-0.5,_BR,1,0.3,8]);
scene.add(bm(rv));}

scene.add(new THREE.GridHelper(60,30,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
