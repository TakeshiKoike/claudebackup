<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>カラフルビル v2 — 賑やか版</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">カラフルビル v2 — 賑やかな街</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,500);
camera.position.set(55,35,-25);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(12,10,12);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(30,50,20);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function box(v,bx,by,bz,w,h,d,c){
  for(let x=0;x<w;x++) for(let y=0;y<h;y++) for(let z=0;z<d;z++) v.push([bx+x,by+y,bz+z,c]);
}

function buildCity(){
  const v=[];

  // Palette
  const PK=0xe8788a, PKL=0xf0a0a8, PKD=0xd06070;
  const BL=0x4090c8, BLD=0x306898;
  const YL=0xe8c840, YLD=0xc8a830;
  const CR=0xf0e0c8, CRD=0xd8c8a8;
  const CY=0x60c8c0, CYD=0x48a8a0;
  const OR=0xf09030, ORD=0xd07820;
  const GR=0x50a050, GRD=0x3a8038, GRL=0x70c070;
  const RD=0xe05040, WH=0xf0f0e8, GL=0x90c8e0;
  const MT=0x808888, WD=0x9a7a50, CN=0xb0b0a8;
  const BK=0x404040, BR=0x8a6040;
  const SKN=0xf0c8a0;

  // =====================================================
  // PINK TOWER — massive stacked irregular blocks (centerpiece)
  // Like the original: multiple boxes overlapping at different heights
  // =====================================================
  // Base block
  box(v, 8,0,6, 10,8,8, PK);
  // Second tier (offset)
  box(v, 6,8,4, 8,6,10, PK);
  // Third tier (narrower, taller)
  box(v, 9,14,6, 6,6,6, PKL);
  // Fourth (top piece, offset again)
  box(v, 7,20,8, 5,4,4, PKL);
  // Side protrusion
  box(v, 18,0,8, 4,12,5, PK);
  // Small stacked piece
  box(v, 10,24,9, 3,3,2, PKD);

  // Pink windows (small square holes — darker pink insets)
  for(let fy=2;fy<8;fy+=3) for(let fz=7;fz<13;fz+=3) v.push([7.9,fy,fz,PKD,0.1,1.5,1.5]);
  for(let fy=10;fy<14;fy+=3) for(let fz=5;fz<12;fz+=3) v.push([5.9,fy,fz,GL,0.1,1.5,1.5]);
  for(let fy=16;fy<20;fy+=3) for(let fz=7;fz<11;fz+=3) v.push([8.9,fy,fz,GL,0.1,1.5,1.5]);

  // =====================================================
  // BLUE BUILDING (left of pink, tall narrow)
  // =====================================================
  box(v, 2,0,6, 6,14,5, BL);
  box(v, 2,14,7, 4,4,3, BLD);
  // Windows
  for(let fy=2;fy<14;fy+=3) for(let fz=7;fz<10;fz+=2) v.push([1.9,fy,fz,GL,0.1,2,1.5]);
  // Balconies
  for(let fy=5;fy<14;fy+=4){
    box(v, 0,fy,7, 2,1,3, CN);
    v.push([0,fy+1,7,MT,0.2,1,0.2]); v.push([0,fy+1,9,MT,0.2,1,0.2]);
  }

  // =====================================================
  // YELLOW BUILDING (right side)
  // =====================================================
  box(v, 18,0,0, 8,10,6, YL);
  box(v, 19,10,1, 6,4,4, YLD);
  // Roof
  box(v, 17,10,0, 10,1,7, BR);
  box(v, 18,14,1, 8,1,5, BR);
  // Windows
  for(let fy=2;fy<10;fy+=3) for(let fx=19;fx<25;fx+=2) v.push([fx,fy,-0.1,GL,1.5,2,0.1]);
  // Big sign
  box(v, 20,7,0, 5,2,0, WH); // sign board front
  v.push([20,7,-0.2,YLD,5,2,0.2]);

  // =====================================================
  // 1F SHOPS & STREET LEVEL — the busy part
  // =====================================================

  // -- Green-roofed shop row (front, ground level) --
  // Shop 1: bookshop/library
  box(v, 2,0,0, 5,4,5, CR);
  box(v, 1,4,0, 7,1,6, GR); // green roof
  // Open front (glass)
  for(let fz=1;fz<4;fz++) v.push([1.9,1,fz,GL,0.1,2,1]);
  // Interior: bookshelf
  box(v, 4,1,1, 1,3,1, BR); box(v, 4,1,3, 1,3,1, BR);
  // Sign
  v.push([2,3,-0.2,WH,4,1,0.2]);

  // Shop 2: cafe
  box(v, 8,0,0, 5,4,5, WH);
  box(v, 7,4,0, 7,1,6, OR); // orange roof
  // Striped awning
  for(let z=0;z<5;z++) v.push([7.5,3.5,z, z%2===0?YL:WH, 1,0.3,1]);
  // Tables inside (visible)
  v.push([9,1,2,BR,1,0.5,1]); v.push([11,1,2,BR,1,0.5,1]);
  // Chairs
  v.push([9,0.5,1,WD,0.5,0.5,0.5]); v.push([11,0.5,1,WD,0.5,0.5,0.5]);
  // Front window
  for(let fz=1;fz<4;fz++) v.push([7.9,1,fz,GL,0.1,2,1]);

  // Shop 3: IT Adventure (教育)
  box(v, 14,0,0, 5,4,5, GRL);
  box(v, 13,4,0, 7,1,6, GR);
  // Computers inside
  v.push([15,1,2,MT,1,0.8,0.5]); v.push([17,1,2,MT,1,0.8,0.5]);
  // Screens (colored)
  v.push([15,1.8,2,BL,0.8,0.6,0.1]); v.push([17,1.8,2,GR,0.8,0.6,0.1]);
  // Sign
  v.push([14,3,-0.2,WH,5,1,0.2]);
  // Front window
  for(let fz=1;fz<4;fz++) v.push([13.9,1,fz,GL,0.1,2,1]);

  // =====================================================
  // CREAM BUILDING (behind shops, 2nd row)
  // =====================================================
  box(v, 0,0,12, 7,6,6, CR);
  box(v, 0,6,13, 5,3,4, CRD);
  // Pink roof
  box(v, -1,6,12, 9,1,7, PKL);
  // Windows
  for(let fy=2;fy<6;fy+=3) for(let fx=1;fx<6;fx+=2) v.push([fx,fy,11.9,GL,1.5,2,0.1]);

  // =====================================================
  // CYAN/TEAL BUILDING (far right)
  // =====================================================
  box(v, 22,0,8, 5,8,6, CY);
  box(v, 21,8,9, 7,1,5, CYD);
  // Stairs going up side
  for(let s=0;s<5;s++) box(v, 27,s,9+s, 1,1,1, YL);
  // Windows
  for(let fy=2;fy<8;fy+=3) for(let fz=9;fz<13;fz+=2) v.push([21.9,fy,fz,GL,0.1,2,1.5]);

  // =====================================================
  // DETAILS: Signs, awnings, street furniture
  // =====================================================

  // Striped awnings on pink building ground floor
  for(let z=6;z<13;z++) v.push([7.5,3,z, z%2===0?RD:WH, 1.5,0.3,1]);

  // "GAME" sign on pink building
  box(v, 14,10,5.8, 4,2,0, RD);
  v.push([14,10,5.7,BK,4,2,0.3]);

  // "DEVELOP" sign
  box(v, 14,8,5.8, 5,1.5,0, WH);
  v.push([14,8,5.7,BK,5,1.5,0.3]);

  // Street lamps
  for(const[lx,lz] of [[0,3],[7,3],[14,3],[21,3]]){
    v.push([lx,0,lz,MT,0.3,4,0.3]);
    v.push([lx,4,lz,YL,0.8,0.5,0.8]);
  }

  // Trees
  for(const[tx,tz] of [[1,4],[13,4],[27,4],[27,14]]){
    v.push([tx,0,tz,WD,1,2,1]);
    box(v, tx-1,2,tz-1, 3,2,3, GR);
  }

  // Planters with flowers
  for(const[px,pz] of [[6,4],[20,4]]){
    v.push([px,0,pz,BR,1.5,1,1.5]);
    v.push([px+0.25,1,pz+0.25,RD,0.5,0.5,0.5]);
    v.push([px+0.75,1,pz+0.25,YL,0.5,0.5,0.5]);
    v.push([px+0.25,1,pz+0.75,PK,0.5,0.5,0.5]);
  }

  // Benches
  v.push([4,0,3,WD,2,0.5,1]); v.push([17,0,3,WD,2,0.5,1]);

  // === Road on FRONT side (z=-3 to z=0) — visible from default camera ===
  for(let x=-2;x<30;x++){
    v.push([x,0,-4, GR, 1,0.1,0.5]);
    v.push([x,0,-3, GRD, 1,0.1,1.5]);
    v.push([x,0,-1.5, GR, 1,0.1,0.5]);
  }
  // Sidewalk
  for(let x=-2;x<30;x++) v.push([x,0,-1, CN, 1,0.15,1]);
  for(let x=-2;x<30;x++) v.push([x,0,-5, CN, 1,0.15,1]);

  // === Bus (bigger, on front road) ===
  box(v, 20,0,-4, 6,2,3, YL);
  box(v, 20,2,-4, 6,2,3, YLD);
  // Windows
  for(let fx=21;fx<25;fx++) v.push([fx,2,-4.1,GL,1,1.5,0.1]);
  // Wheels
  v.push([21,0,-4.5,BK,1,1,0.5]); v.push([25,0,-4.5,BK,1,1,0.5]);
  // Windshield
  v.push([20,2,-4.1,GL,0.1,1.5,3]);

  // === Road on back side too ===
  for(let z=18;z<22;z++) for(let x=0;x<28;x++){
    v.push([x,0,z, z===19||z===20?GRD:GR, 1,0.1,1]);
  }

  // =====================================================
  // PEOPLE (small voxel figures scattered around)
  // =====================================================
  // People — bigger (2.5 units tall), placed on front sidewalk and around
  function person(px,py,pz,bodyColor,hairColor=BK){
    // Legs (2 separate)
    v.push([px-0.3,py,pz,BLD,0.5,1,0.5]);
    v.push([px+0.3,py,pz,BLD,0.5,1,0.5]);
    // Body
    v.push([px,py+1,pz,bodyColor,1,1.2,0.8]);
    // Head
    v.push([px,py+2.2,pz,SKN,0.8,0.8,0.8]);
    // Hair
    v.push([px,py+2.8,pz,hairColor,0.8,0.3,0.8]);
  }
  // Front sidewalk people
  person(3,0,-1,BL);
  person(6,0,-1,RD);
  person(10,0,-1,GR);
  person(14,0,-1,WH,BR);
  person(18,0,-1,OR);
  person(24,0,-5,CY);    // near bus
  // Around buildings
  person(1,0,5,PK);
  person(9,0,5,YL);
  person(16,0,5,BL,BR);
  person(22,0,5,WH);
  // Upper levels
  person(5,6,8,WH);      // on balcony
  person(9,9,11,RD);     // visible inside pink building

  // =====================================================
  // ROOFTOP DETAILS
  // =====================================================
  // AC units on pink
  box(v, 12,8,9, 2,1,2, MT);
  box(v, 16,8,10, 2,1,2, MT);
  // Water tank on yellow
  box(v, 21,10,2, 2,2,2, CY);
  v.push([21,12,2,MT,2,0.3,2]);
  // Antenna on pink
  v.push([11,27,10,MT,0.3,3,0.3]);
  // Flag
  v.push([22,15,3,MT,0.2,2,0.2]);
  v.push([22.2,16,3,RD,1.5,1,0.1]);

  // =====================================================
  // INTERIOR VISIBLE (open wall sections on pink building)
  // =====================================================
  // Open section at floor 2 of pink (showing room inside)
  // Floor
  box(v, 8,4,10, 4,1,3, WD);
  // Desk
  v.push([9,5,11,BR,2,0.5,1]);
  // Chair
  v.push([10,5,10.5,RD,0.8,0.8,0.5]);
  // Monitor on desk
  v.push([9.5,5.5,11.3,MT,1,0.8,0.3]);
  v.push([9.5,6.3,11.3,BL,0.8,0.6,0.1]);

  // Open section at floor 3 of pink
  box(v, 8,8,10, 4,1,3, CR);
  // Sofa
  box(v, 9,9,11, 2,1,1, CY);
  // Plant
  v.push([11,9,10.5,BR,0.5,0.5,0.5]);
  v.push([11,9.5,10.5,GR,0.8,0.8,0.8]);

  console.log('Total voxels:', v.length);
  return bm(v);
}

scene.add(buildCity());
scene.add(new THREE.GridHelper(60,30,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
