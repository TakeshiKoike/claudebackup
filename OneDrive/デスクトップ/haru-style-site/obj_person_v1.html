<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>人間ボクセル v1</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">人間ボクセル v1 — 大きく作成（縮小して街に配置する前提）</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,500);
camera.position.set(30,15,30);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,6,0);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(20,30,15);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

// Palette
const SKN=0xf0c8a0, SKND=0xe0b890;
const BK=0x303030, BR=0x6a4a2a, BRD=0x8a6a3a;
const WH=0xf0f0e8, RD=0xe05040, BL=0x4090c8, GR=0x50a050;
const PK=0xf0a0b0, YL=0xe8c840, OR=0xf09030, CY=0x60c8c0;
const NV=0x2a3a6a, GY=0x808080;

// ============================================================
// Build a person at large scale (1 voxel = 1 unit)
// Full height ~14 units → will be scaled to ~2-3 units in city
// ============================================================
function buildPerson(config){
  const v=[];
  const {shirt, pants, hair, hairStyle='short', shoes=BK, accessory=null} = config;

  // === Shoes (2x1x2 each) ===
  v.push([-1,0,-0.5,shoes,2,1,3]);  // left shoe
  v.push([1,0,-0.5,shoes,2,1,3]);   // right shoe

  // === Legs (2x4x2 each) ===
  v.push([-1,1,0,pants,2,4,2]);     // left leg
  v.push([1,1,0,pants,2,4,2]);      // right leg

  // === Body/torso (4x5x2) ===
  v.push([-1.5,5,0,shirt,5,5,2]);

  // === Arms (1x4x1 each) ===
  v.push([-3,5.5,0.5,shirt,1.5,4,1]);  // left arm
  v.push([3,5.5,0.5,shirt,1.5,4,1]);   // right arm

  // === Hands ===
  v.push([-3,5,0.5,SKN,1.5,1,1]);   // left hand
  v.push([3,5,0.5,SKN,1.5,1,1]);    // right hand

  // === Neck ===
  v.push([0,10,0.5,SKN,2,1,1]);

  // === Head (4x4x4) ===
  v.push([-1.5,11,-0.5,SKN,5,4,4]);

  // === Face details ===
  // Eyes
  v.push([-1,13,-0.6,BK,0.8,0.8,0.2]);  // left eye
  v.push([1,13,-0.6,BK,0.8,0.8,0.2]);   // right eye
  // Mouth
  v.push([0,12,-0.6,SKND,1.5,0.5,0.2]);

  // === Hair ===
  if(hairStyle==='short'){
    v.push([-1.8,14,-0.8,hair,5.5,1.5,4.5]); // top
    v.push([-1.8,11,2.5,hair,5.5,4,1]);       // back
  } else if(hairStyle==='long'){
    v.push([-1.8,14,-0.8,hair,5.5,1.5,4.5]); // top
    v.push([-1.8,11,2.5,hair,5.5,5,1]);       // back (longer)
    v.push([-2.5,11,-0.5,hair,1,4,4]);        // left side
    v.push([3,11,-0.5,hair,1,4,4]);           // right side
  } else if(hairStyle==='ponytail'){
    v.push([-1.8,14,-0.8,hair,5.5,1.5,4.5]); // top
    v.push([0,12,3,hair,2,2,3]);              // ponytail
  }

  // === Accessories ===
  if(accessory==='stethoscope'){
    // Stethoscope around neck
    v.push([-0.5,9.5,-0.3,GY,1,1,0.5]);
    v.push([0.5,9.5,-0.3,GY,1,1,0.5]);
    v.push([0,8,-0.3,GY,0.5,2,0.3]);
  } else if(accessory==='clipboard'){
    // Clipboard in hand
    v.push([3.5,6,-0.5,BR,1.5,2,0.3]);
    v.push([3.5,7,-0.5,WH,1.2,1.5,0.1]);
  } else if(accessory==='bag'){
    v.push([3,6,0,BR,2,2.5,1.5]);
  } else if(accessory==='hat'){
    v.push([-2,15,-1,WH,6,1,5]);
    v.push([-1.5,15.5,-0.5,WH,5,1,4]);
  }

  return v;
}

// ============================================================
// Create multiple characters
// ============================================================
const characters = [
  { name:'医師', config:{shirt:WH, pants:NV, hair:BK, hairStyle:'short', accessory:'stethoscope'}, pos:[-12,0,0] },
  { name:'看護師', config:{shirt:PK, pants:WH, hair:BR, hairStyle:'ponytail', accessory:'clipboard'}, pos:[-6,0,0] },
  { name:'患者(男)', config:{shirt:BL, pants:GY, hair:BK, hairStyle:'short', accessory:null}, pos:[0,0,0] },
  { name:'患者(女)', config:{shirt:YL, pants:NV, hair:BRD, hairStyle:'long', accessory:'bag'}, pos:[6,0,0] },
  { name:'子供', config:{shirt:RD, pants:BL, hair:BK, hairStyle:'short', shoes:WH, accessory:'hat'}, pos:[12,0,0] },
];

for(const ch of characters){
  const voxels = buildPerson(ch.config);
  const mesh = bm(voxels);
  mesh.position.set(...ch.pos);
  scene.add(mesh);

  // Label (text sprite would be better, but just a colored marker)
  const marker = bm([[0,17,0, 0xf4a000, 3,0.5,0.5]]);
  marker.position.set(...ch.pos);
  scene.add(marker);
}

// Ground
scene.add(new THREE.GridHelper(60,30,0xccbb99,0xddccaa));

// Show scale reference: a 1-unit cube
const ref = bm([[18,0,0,0xcccccc]]);
scene.add(ref);
const ref2 = bm([[18,0,1,0xe05040,1,0.1,0.1]]);
scene.add(ref2);

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
