<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>バス v1</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">バス v1 — 大きく作成</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(22,12,18);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(8,4,3);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(15,25,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildBus(){
  const v=[];

  const YL=0xe0c848;   // yellow main
  const YLD=0xc8a828;  // yellow dark
  const CR=0xf0e8d0;   // cream
  const OR=0xd8a030;   // orange stripe
  const BRN=0x6a4a2a;  // brown
  const GL=0xa8d0e8;   // glass
  const GLD=0x88b0c8;  // glass dark
  const BK=0x303030;   // black
  const MT=0x707070;   // metal
  const RD=0xc83828;   // red
  const WH=0xf0f0e0;   // white
  const GR=0x50a050;   // green
  const ORS=0xf09030;  // orange seat

  // バス: 18L(x) x 7H(y) x 6W(z)

  // === タイヤ ===
  for(const[tx,tz] of [[2,-1],[2,6],[14,-1],[14,6]]){
    v.push([tx,0,tz,BK,2,2,1]);
    // ホイールキャップ
    v.push([tx+0.5,0.5,tz+(tz<0?-0.1:1),MT,1,1,0.2]);
  }

  // === 車体下部フレーム ===
  for(let x=0;x<18;x++) for(let z=0;z<6;z++) v.push([x,0,z,BK]);
  for(let x=0;x<18;x++) for(let z=0;z<6;z++) v.push([x,1,z,YLD]);

  // === 車体 クリーム下半分 (y=2) ===
  // 左壁
  for(let x=0;x<18;x++) v.push([x,2,0,CR]);
  // 右壁
  for(let x=0;x<18;x++) v.push([x,2,5,CR]);
  // 前壁
  for(let z=0;z<6;z++) v.push([0,2,z,CR]);
  // 後壁
  for(let z=0;z<6;z++) v.push([17,2,z,CR]);

  // === オレンジライン (y=3) ===
  for(let x=0;x<18;x++){ v.push([x,3,0,OR]); v.push([x,3,5,OR]); }
  for(let z=0;z<6;z++){ v.push([0,3,z,OR]); v.push([17,3,z,OR]); }

  // === 車体 黄色上半分 (y=4,5,6) ===
  for(let y=4;y<=6;y++){
    for(let x=0;x<18;x++){ v.push([x,y,0,YL]); v.push([x,y,5,YL]); }
    for(let z=0;z<6;z++){ v.push([0,y,z,YL]); v.push([17,y,z,YL]); }
  }

  // === 窓（左側 z=0面）===
  // 茶色窓枠 + ガラス、4窓
  for(const wx of [2,6,10,14]){
    // 枠
    v.push([wx-0.5,3.5,-0.1,BRN,3.5,4,0.15]);
    // ガラス
    v.push([wx,4,-0.15,GL,2.5,2.5,0.15]);
    // 枠上部アーチ風
    v.push([wx+0.3,6.2,-0.1,BRN,2,0.5,0.15]);
  }

  // === 窓（右側 z=5面）===
  for(const wx of [2,6,10,14]){
    v.push([wx-0.5,3.5,5.1,BRN,3.5,4,0.15]);
    v.push([wx,4,5.15,GL,2.5,2.5,0.15]);
    v.push([wx+0.3,6.2,5.1,BRN,2,0.5,0.15]);
  }

  // === フロントガラス ===
  v.push([-0.1,3,0.5,BRN,0.15,4.5,5]);
  v.push([-0.2,4,1,GL,0.2,2.5,4]);

  // === リアガラス ===
  v.push([17.1,3,0.5,BRN,0.15,4.5,5]);
  v.push([17.2,4,1.5,GL,0.2,2,3]);

  // === ヘッドライト ===
  v.push([-0.3,2,0.5,WH,0.3,1,1]);    // 左
  v.push([-0.3,2,4.5,WH,0.3,1,1]);    // 右
  v.push([-0.3,1.5,0.5,RD,0.3,0.5,0.5]); // 左下（ウインカー）
  v.push([-0.3,1.5,4.5,RD,0.3,0.5,0.5]);

  // === テールライト ===
  v.push([17.3,2,0.5,RD,0.3,1,1]);
  v.push([17.3,2,4.5,RD,0.3,1,1]);
  v.push([17.3,3,0.5,ORS,0.3,0.5,0.5]); // ウインカー
  v.push([17.3,3,4.5,ORS,0.3,0.5,0.5]);

  // === サイドミラー ===
  v.push([-0.8,5,0,MT,0.8,0.5,0.5]);
  v.push([-0.8,5,5.5,MT,0.8,0.5,0.5]);
  // ミラー支柱
  v.push([-0.3,4.5,0,MT,0.3,1,0.3]);
  v.push([-0.3,4.5,5.5,MT,0.3,1,0.3]);

  // === ドア（左側中央） ===
  v.push([8,1,-0.15,BRN,2,5.5,0.15]);
  v.push([8.3,1.5,-0.2,GLD,1.4,4.5,0.2]);

  // === 屋根 ===
  for(let x=-0.5;x<18.5;x++) for(let z=-0.5;z<6.5;z++) v.push([x,7,z,CR,1,0.5,1]);

  // === 行先表示板（前面上部） ===
  v.push([-0.2,6,1,BK,0.2,1,4]);
  // 行先文字エリア（白地）
  v.push([-0.25,6.2,1.5,WH,0.25,0.6,3]);

  // === ナンバープレート ===
  v.push([-0.25,1.5,2,WH,0.25,1,2]);

  // === 内部 ===
  // 座席（左列）
  for(let x=1;x<8;x+=2) v.push([x,1,1,ORS,1,1,1]);
  for(let x=10;x<17;x+=2) v.push([x,1,1,ORS,1,1,1]);
  // 座席（右列）
  for(let x=1;x<8;x+=2) v.push([x,1,4,ORS,1,1,1]);
  for(let x=10;x<17;x+=2) v.push([x,1,4,ORS,1,1,1]);
  // 運転席
  v.push([1,1,1,BK,1,2,1]);
  // ハンドル
  v.push([0.5,3,1.5,MT,0.3,0.3,1]);

  // === バス停ポール（横に） ===
  v.push([-3,0,2.5,MT,0.3,5,0.3]);
  v.push([-3,5,2,GR,1,1,0.3]);    // バス停看板
  v.push([-3,4,2,YL,1,0.8,0.3]);  // 看板下部

  return v;
}

scene.add(bm(buildBus()));
scene.add(new THREE.GridHelper(40,20,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
