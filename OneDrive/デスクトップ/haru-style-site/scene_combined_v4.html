<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x88ccee);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,500);
camera.position.set(15,28,-40);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(15,8,10);
controls.minDistance=10;controls.maxDistance=80;
controls.maxPolarAngle=Math.PI/2.1;

// ライティング
const ambient=new THREE.AmbientLight(0xffffff,1.3);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(30,50,20);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60;sun.shadow.camera.right=60;
sun.shadow.camera.top=60;sun.shadow.camera.bottom=-20;
scene.add(sun);

// 霧（奥行き感）
scene.fog=new THREE.FogExp2(0x88ccee,0.008);

// 昼夜切替状態
let isNight=false;
let autoRotate=false;

window.toggleDayNight=function(){
  isNight=!isNight;
  document.getElementById('btnNight').classList.toggle('active',isNight);
  if(isNight){
    scene.background.set(0x1a2a4a);
    scene.fog.color.set(0x1a2a4a);
    ambient.intensity=0.3;ambient.color.set(0x6688bb);
    sun.intensity=0.2;sun.color.set(0x4466aa);
  }else{
    scene.background.set(0x88ccee);
    scene.fog.color.set(0x88ccee);
    ambient.intensity=1.3;ambient.color.set(0xffffff);
    sun.intensity=2;sun.color.set(0xfff5e0);
  }
};

window.toggleAutoRotate=function(){
  autoRotate=!autoRotate;
  document.getElementById('btnRotate').classList.toggle('active',autoRotate);
};

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function box(v,bx,by,bz,w,h,d,c){
  for(let x=0;x<w;x++) for(let y=0;y<h;y++) for(let z=0;z<d;z++) v.push([bx+x,by+y,bz+z,c]);
}

// =====================================================
// 1. 建物群（buildCity）
// =====================================================
function buildCity(){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);

  const PK=0xe8788a,PKL=0xf0a0a8,PKD=0xd06070;
  const BL=0x4090c8,BLD=0x306898;
  const YL=0xe8c840,YLD=0xc8a830;
  const CR=0xf0e0c8,CRD=0xd8c8a8;
  const CY=0x60c8c0,CYD=0x48a8a0;
  const OR=0xf09030,ORD=0xd07820;
  const GR=0x50a050,GRD=0x3a8038,GRL=0x70c070;
  const RD=0xe05040,WH=0xf0f0e8,GL=0x80c8e8,GLD=0x68b0d0;
  const MT=0x808888,WD=0x9a7a50,CN=0xb0b0a8;
  const BK=0x404040,BR=0x8a6040,BRD=0x6a4a20;
  const SKN=0xf0c8a0;

  function sbox(bx,by,bz,w,h,d,c){
    for(let x=0;x<w;x++)for(let y=0;y<h;y++)for(let z=0;z<d;z++) p(bx+x,by+y,bz+z,c);
  }
  function window(wx,wy,wz,ww,wh,face,frameC){
    const fc=frameC||WH;
    for(let dx=0;dx<ww;dx++)for(let dy=0;dy<wh;dy++){
      const isFrame=dx===0||dx===ww-1||dy===0||dy===wh-1;
      const gc=isFrame?fc:((dx+dy)%2===0?GL:GLD);
      if(face==='z-') p(wx+dx,wy+dy,wz,gc);
      else if(face==='z+') p(wx+dx,wy+dy,wz,gc);
      else if(face==='x-') p(wx,wy+dy,wz+dx,gc);
      else p(wx,wy+dy,wz+dx,gc);
    }
  }

  // ==============================================
  // ピンクタワー
  // ==============================================
  sbox(16,0,12, 20,16,16, PK);
  for(let x=16;x<36;x++)for(let z=12;z<28;z++){
    p(x,4,z,PKL);p(x,8,z,PKD);p(x,12,z,PKL);
  }
  sbox(12,16,8, 16,12,20, PK);
  for(let x=12;x<28;x++)for(let z=8;z<28;z++) p(x,20,z,PKL);
  sbox(18,28,12, 12,12,12, PKL);
  for(let x=18;x<30;x++)for(let z=12;z<24;z++) p(x,34,z,PK);
  sbox(14,40,16, 10,8,8, PKL);
  sbox(20,48,18, 6,6,4, PKD);
  sbox(36,0,16, 8,24,10, PK);
  for(let z=16;z<26;z++){p(36,8,z,PKD);p(36,16,z,PKD);}

  // ピンクタワー窓
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wx=18;wx<34;wx+=4) window(wx,fy,11,3,3,'z-',PKD);
  }
  for(let fl=0;fl<2;fl++){const fy=18+fl*5;
    for(let wx=14;wx<26;wx+=4) window(wx,fy,7,3,3,'z-',PKD);
  }
  for(let fl=0;fl<2;fl++){const fy=30+fl*5;
    for(let wx=20;wx<28;wx+=4) window(wx,fy,11,3,3,'z-',PKD);
  }
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wz=14;wz<26;wz+=4) window(36,fy,wz,3,3,'x-',PKD);
  }
  for(let z=12;z<28;z++){p(15,5,z,z%2===0?RD:WH);p(15,6,z,z%2===0?WH:RD);}
  sbox(24,20,7, 6,3,1, BK); sbox(25,21,6, 4,1,1, RD);
  for(let y=48;y<56;y++) p(22,y,20,MT);
  // 背面
  for(let x=16;x<36;x++){p(x,4,28,PKL);p(x,8,28,PKD);p(x,12,28,PKL);}
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wx=18;wx<34;wx+=4) window(wx,fy,28,3,3,'z+',PKD);
  }
  for(let z2=12;z2<28;z2++){p(36,5,z2,z2%2===0?RD:WH);p(36,6,z2,z2%2===0?WH:RD);}
  for(let z=12;z<28;z++){p(35,4,z,PKL);p(35,8,z,PKD);p(35,12,z,PKL);}
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wz=14;wz<26;wz+=4) window(35,fy,wz,3,3,'x+',PKD);
  }
  for(let x=12;x<28;x++) p(x,20,28,PKL);
  for(let fl=0;fl<2;fl++){const fy=18+fl*5;
    for(let wx=14;wx<26;wx+=4) window(wx,fy,28,3,3,'z+',PKD);
  }
  for(let x=18;x<30;x++) p(x,34,24,PK);
  for(let fl=0;fl<2;fl++){const fy=30+fl*5;
    for(let wx=20;wx<28;wx+=4) window(wx,fy,24,3,3,'z+',PKD);
  }
  for(let z=16;z<26;z++){p(44,8,z,PKD);p(44,16,z,PKD);}
  for(let fl=0;fl<3;fl++){const fy=2+fl*7;
    for(let wz=18;wz<24;wz+=3) window(44,fy,wz,2,3,'x+',PKD);
  }

  // ピンクタワー内装（1F〜3F）
  // 1F: ロビー（受付デスク+ソファ+観葉植物）
  sbox(18,1,14, 14,1,10, CR); // 床
  sbox(22,1,14, 6,2,2, WD); // 受付デスク
  p(24,3,14,MT); p(25,3,14,BL); // PC
  sbox(18,1,22, 4,2,2, CY); // ソファ
  sbox(30,1,22, 2,1,2, WD); // サイドテーブル
  p(30,2,22,GR); p(30,3,22,GR); p(30,4,22,GR); // 観葉植物
  // 2F: オフィス（デスク2台+棚）
  sbox(18,8,14, 14,1,10, WD);
  p(20,9,16,BR);p(20,10,16,BR);p(21,9,16,BR);
  p(20,11,16,MT);p(20,12,16,BL);
  p(22,9,18,RD);
  // 2台目デスク
  p(26,9,16,BR);p(26,10,16,BR);p(27,9,16,BR);
  p(26,11,16,MT);p(26,12,16,BL);
  p(24,9,18,0x4090c8); // 椅子
  sbox(28,9,14, 2,4,1, BR);
  p(29,9,15,GR);p(29,10,15,GR);p(29,11,15,GR);
  // 2F: ホワイトボード
  sbox(18,10,23, 6,4,1, WH);
  p(19,12,23,BK);p(20,12,23,BK);p(21,11,23,RD);
  // 3F: ソファ＋テーブル＋テレビ
  sbox(18,16,14, 14,1,10, CR);
  sbox(20,17,18, 4,2,2, CY);
  p(22,17,16,BR);p(22,18,16,WH);
  // テレビ
  sbox(18,17,14, 1,3,4, BK);
  sbox(18,18,15, 1,2,2, BL); // 画面

  // ==============================================
  // 青ビル
  // ==============================================
  sbox(4,0,12, 12,28,10, BL);
  for(let x=4;x<16;x++)for(let z=12;z<22;z++){
    for(const fy of [0,7,14,21]) p(x,fy,z,BLD);
  }
  sbox(4,28,14, 8,8,6, BLD);
  for(let fl=0;fl<4;fl++){const fy=2+fl*7;
    for(let wz=14;wz<20;wz+=3) window(3,fy,wz,2,4,'x-');
  }
  for(let fl=0;fl<4;fl++){const fy=1+fl*7;
    sbox(1,fy,13, 3,1,7, CN);
    for(let wz=13;wz<20;wz+=2){p(1,fy+1,wz,MT);p(1,fy+2,wz,MT);}
    p(1,fy+2,13,MT);p(1,fy+2,19,MT);
    for(let wz=13;wz<=19;wz++) p(1,fy+2,wz,MT);
  }
  for(let fl=0;fl<4;fl++){const fy=2+fl*7;
    for(let wz=14;wz<20;wz+=3) window(16,fy,wz,2,4,'x+');
  }
  for(let x=4;x<16;x++)for(const fy of [0,7,14,21]) p(x,fy,22,BLD);
  for(let fl=0;fl<4;fl++){const fy=2+fl*7;
    for(let wx=6;wx<14;wx+=4) window(wx,fy,22,2,4,'z+');
  }
  for(let fl=0;fl<4;fl++){const fy=1+fl*7;
    sbox(5,fy,23, 8,1,2, CN);
    for(let wx=5;wx<=12;wx+=2) p(wx,fy+2,24,MT);
    for(let wx=5;wx<=12;wx++) p(wx,fy+2,24,MT);
  }

  // ==============================================
  // 黄色ビル
  // ==============================================
  sbox(36,0,0, 16,20,12, YL);
  for(let x=36;x<52;x++)for(let z=0;z<12;z++){p(x,0,z,YLD);p(x,10,z,YLD);}
  sbox(38,20,2, 12,8,8, YLD);
  sbox(34,20,0, 20,2,14, BR);
  sbox(36,28,2, 16,2,10, BRD);
  for(let fl=0;fl<3;fl++){const fy=2+fl*6;
    for(let wx=38;wx<50;wx+=4){
      window(wx,fy,-1,3,4,'z-',BR);
      for(let dx=0;dx<3;dx++) p(wx+dx,fy+4,-2,BR);
    }
  }
  sbox(40,14,-2, 10,4,1, WH);
  sbox(40,14,-3, 10,1,1, YLD);sbox(40,18,-3, 10,1,1, YLD);
  for(let dx=1;dx<9;dx+=2) p(41+dx,16,-3,BK);
  for(let fl=0;fl<3;fl++){const fy=2+fl*6;
    for(let wx=38;wx<50;wx+=4) window(wx,fy,12,3,4,'z+',BR);
  }
  for(let fl=0;fl<3;fl++){const fy=2+fl*6;
    for(let wz=2;wz<10;wz+=4) window(52,fy,wz,3,4,'x+',BR);
  }

  // ==============================================
  // ショップ3軒（内装充実版）
  // ==============================================
  // 本屋（クリーム色）
  sbox(4,0,0, 10,8,10, CR);
  sbox(2,8,0, 14,2,12, GR);
  sbox(3,10,1, 12,1,10, GRD);
  for(let z=1;z<9;z++)for(let y=1;y<7;y++) p(3,y,z,y<6?GL:GLD);
  // 本棚3列（奥に充実した棚）
  for(let y=1;y<7;y++){sbox(10,y,2,2,1,1,BR);sbox(10,y,5,2,1,1,BR);sbox(10,y,7,2,1,1,WD);}
  for(let y=1;y<7;y++){p(11,y,2,RD);p(11,y,5,BL);p(11,y,7,GR);}
  // 追加: 中央の本棚島
  sbox(7,1,3, 2,4,1, BR);
  for(let y=1;y<=4;y++){p(7,y,3,y%2===0?RD:BL);p(8,y,3,y%2===0?GR:YL);}
  // 追加: レジカウンター
  sbox(5,1,8, 3,2,1, WD);
  p(6,3,8,MT); // レジ
  // 追加: 本の山（床に積まれた本）
  p(5,1,2,RD);p(5,2,2,BL);p(5,3,2,GR);
  // 看板
  sbox(4,6,-3, 10,3,1, WH);
  sbox(4,6,-4, 10,1,1, GRD);sbox(4,9,-4, 10,1,1, GRD);
  p(5,8,-4,BK);p(5,7,-4,BK);p(6,7,-4,BK);
  p(7,8,-4,BK);p(7,7,-4,BK);
  p(8,8,-4,BK);p(8,7,-4,BK);p(9,7,-4,BK);p(9,8,-4,BK);
  p(10,8,-4,BK);p(10,7,-4,BK);p(11,8,-4,BK);
  sbox(12,2,-2, 2,3,1, BK);
  p(12,4,-3,WH);p(13,3,-3,WH);

  // カフェ（白+オレンジ屋根）
  sbox(16,0,0, 10,8,10, WH);
  sbox(14,8,0, 14,2,12, OR);
  sbox(15,10,1, 12,1,10, ORD);
  for(let z=-2;z<10;z++) p(15,7,z,z%2===0?YL:WH);
  for(let z=-2;z<10;z++) p(15,6,z,z%2===0?WH:YL);
  for(let z=1;z<9;z++)for(let y=1;y<6;y++) p(15,y,z,GL);
  // 内装充実: カウンター+棚+エスプレッソマシン
  sbox(23,1,2, 2,3,6, WD); // カウンター
  p(23,4,3,MT);p(23,4,4,MT); // エスプレッソマシン
  p(23,5,3,BK);p(23,5,4,RD); // マシン上部
  // 棚（カップ・瓶）
  sbox(24,1,1, 1,6,1, WD);
  for(let y=2;y<=5;y++){p(24,y,1,y%2===0?WH:0x60c8c0);}
  // テーブル+椅子（2セット）
  p(18,1,3,WD);p(18,2,3,BR);p(19,1,2,WD);p(19,1,4,WD);
  p(22,1,5,WD);p(22,2,5,BR);p(23,1,4,WD);p(23,1,6,WD);
  // 追加: 3つ目テーブル
  p(20,1,7,WD);p(20,2,7,BR);p(19,1,7,WD);p(21,1,7,WD);
  p(18,3,3,WH);p(22,3,5,RD);p(20,3,7,0x60c8c0); // カップ

// =====================================================
function buildFerrisWheel(){
  const F=0xd4a020,FD=0xb88a18,WH=0xe8e4d8,HB=0x707070;
  const BP=0xa09888,BG=0x706860,LT=0xf8f0a0,SP=0x999999;
  const GC=[0xe05040,0x4090d0,0x50a850,0xf0c030,0xe07030,0xd050a0,0x6060c0,0x40b0a0];
  const RIM_R=10,GOND_R=17,HUB_Y=GOND_R+10,NGON=8,S=0.5;

  const vs=[];
  for(const zz of[-2,2]){
    for(let y=0;y<=HUB_Y;y++){const t=y/HUB_Y;
      const lx=-7*(1-t);vs.push([lx,y,zz,F]);vs.push([lx+1,y,zz,F]);
      const rx=7*(1-t);vs.push([rx,y,zz,F]);vs.push([rx-1,y,zz,F]);}
    for(const y of[6,14]){const t=y/HUB_Y;const l=Math.floor(-7*(1-t)),r=Math.ceil(7*(1-t));
      for(let x=l;x<=r;x++)vs.push([x,y,zz,FD]);}
  }
  for(let y=0;y<=HUB_Y;y+=4)for(let z=-2;z<=2;z++)vs.push([0,y,z,FD,0.5,0.5,0.5]);
  for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){if(dx*dx+dy*dy<=5)for(let z=-2;z<=2;z++)vs.push([dx,HUB_Y+dy,z,HB]);}
  for(let x=-9;x<=9;x++)for(let z=-4;z<=4;z++)vs.push([x,0,z,BP]);
  for(let x=-8;x<=8;x++)for(let z=-3;z<=3;z++)vs.push([x,-1,z,BG]);

  const staticMesh=bm(vs);

  const vw=[];
  {const set=new Set();
  for(const r of[RIM_R-0.5,RIM_R,RIM_R+0.5]){
    for(let i=0;i<200;i++){const a=(i/200)*Math.PI*2;
      const rx=Math.round(Math.cos(a)*r/S)*S,ry=Math.round(Math.sin(a)*r/S)*S;
      const k=rx+','+ry;if(set.has(k))continue;set.add(k);
      for(let z=-2;z<=2;z++)vw.push([rx,ry,z,WH,S,S,S]);}}}
  for(let g=0;g<NGON;g++){const a=(g/NGON)*Math.PI*2;const cos=Math.cos(a),sin=Math.sin(a);
    for(let r=3;r<=GOND_R;r++){vw.push([cos*r,sin*r,-1,F]);vw.push([cos*r,sin*r,0,F]);vw.push([cos*r,sin*r,1,F]);}}
  for(let g=0;g<NGON;g++){const a=(g/NGON)*Math.PI*2;
    vw.push([Math.cos(a)*(GOND_R+1),Math.sin(a)*(GOND_R+1),-2,LT,0.5,0.5,0.5]);
    vw.push([Math.cos(a)*(GOND_R+1),Math.sin(a)*(GOND_R+1),2,LT,0.5,0.5,0.5]);}

  const wheelMesh=bm(vw);
  const wheelGroup=new THREE.Group();
  wheelGroup.position.set(0,HUB_Y,0);
  wheelGroup.add(wheelMesh);

  const gondolaGroups=[];
  for(let g=0;g<NGON;g++){
    const a=(g/NGON)*Math.PI*2;const gx=Math.cos(a)*GOND_R,gy=Math.sin(a)*GOND_R;
    const gc=GC[g];const gv=[];
    for(let t=0;t<3;t++){gv.push([-0.3,-t,0,SP,0.3,1,0.3]);gv.push([0.3,-t,0,SP,0.3,1,0.3]);}
    const cx=-2,cy=-6,cz=-1.5;
    for(let x=0;x<4;x++)for(let z=0;z<3;z++)gv.push([cx+x,cy,cz+z,gc]);
    for(let y=1;y<=3;y++){gv.push([cx,cy+y,cz,gc]);gv.push([cx+3,cy+y,cz,gc]);gv.push([cx,cy+y,cz+2,gc]);gv.push([cx+3,cy+y,cz+2,gc]);}
    for(let x=0;x<4;x++){gv.push([cx+x,cy+3,cz,gc]);gv.push([cx+x,cy+3,cz+2,gc]);gv.push([cx+x,cy+1,cz,gc]);gv.push([cx+x,cy+1,cz+2,gc]);}
    for(let z=0;z<3;z++){gv.push([cx,cy+3,cz+z,gc]);gv.push([cx+3,cy+3,cz+z,gc]);}
    for(let x=-0.5;x<4.5;x++)for(let z=-0.5;z<3.5;z++)gv.push([cx+x,cy+4,cz+z,gc,1,0.4,1]);
    const gm=bm(gv);const gg=new THREE.Group();gg.position.set(gx,gy,0);gg.add(gm);
    wheelGroup.add(gg);gondolaGroups.push(gg);
  }

  const group=new THREE.Group();
  group.add(staticMesh);group.add(wheelGroup);
  return {group,wheelGroup,gondolaGroups};
}

// =====================================================
// 2.5. メリーゴーランド
// =====================================================
function buildCarousel(){
  const S=0.5;
  const v=[];
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);

  const WH=0xf0f0e8, CR=0xf0e0c8, GD=0xd4a020, GDD=0xb88a18;
  const RD=0xe05040, BL=0x4090c8, GR=0x50a050, PK=0xf0a0b0, YL=0xe8c840, CY=0x60c8c0;
  const MT=0x808888, BK=0x404040, BR=0x8a6040, LT=0xf8f0a0;
  const horseC=[RD,BL,GR,PK,YL,CY,0xd050a0,0xf09030];

  // 土台（八角形っぽい円盤）
  const R=8;
  for(let dx=-R;dx<=R;dx++)for(let dz=-R;dz<=R;dz++){
    if(dx*dx+dz*dz<=R*R){
      p(dx,0,dz,GDD); p(dx,1,dz,GD);
    }
  }
  // 土台の装飾（縁）
  for(let dx=-R;dx<=R;dx++)for(let dz=-R;dz<=R;dz++){
    const d2=dx*dx+dz*dz;
    if(d2<=R*R && d2>(R-1)*(R-1)){
      p(dx,2,dz,WH);
    }
  }

  // 中心の柱
  for(let y=2;y<=18;y++){p(0,y,0,MT);p(1,y,0,MT);p(0,y,1,MT);p(1,y,1,MT);}

  // 屋根（円錐型）
  for(let layer=0;layer<6;layer++){
    const rr=R-layer;
    const yy=16+layer;
    for(let dx=-rr;dx<=rr;dx++)for(let dz=-rr;dz<=rr;dz++){
      if(dx*dx+dz*dz<=rr*rr){
        const stripe=((dx+dz+20)%4<2)?RD:WH;
        p(dx,yy,dz,stripe);
      }
    }
  }
  // 屋根の頂点フラッグ
  p(0,22,0,GD);p(1,22,0,GD);p(0,23,0,RD);p(1,23,0,YL);

  // 屋根の縁ライト
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2;
    const lx=Math.round(Math.cos(a)*(R+0.5));
    const lz=Math.round(Math.sin(a)*(R+0.5));
    p(lx,16,lz,i%2===0?LT:RD);
  }

  // 支柱（屋根を支える8本の柱）
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const px=Math.round(Math.cos(a)*5);
    const pz=Math.round(Math.sin(a)*5);
    for(let y=2;y<=16;y++) p(px,y,pz,GD);
    // 柱の上部装飾
    p(px,17,pz,GDD);
  }

  const staticMesh=bm(v);

  // 回転部分（馬8頭＋床面ライト）
  const rv=[];
  const rp=(x,y,z,c)=>rv.push([x*S,y*S,z*S,c,S,S,S]);

  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const hx=Math.round(Math.cos(a)*5);
    const hz=Math.round(Math.sin(a)*5);
    const hc=horseC[i];

    // ポール
    for(let y=3;y<=14;y++) rp(hx,y,hz,MT);

    // 馬の体（横向き、簡略化）— ポールの横に配置
    const ox=Math.round(Math.cos(a+0.3)*5);
    const oz=Math.round(Math.sin(a+0.3)*5);
    // 胴体
    for(let dy=0;dy<3;dy++) rp(ox,6+dy,oz,hc);
    rp(ox+Math.round(Math.cos(a)),6,oz+Math.round(Math.sin(a)),hc); // 長い胴
    rp(ox+Math.round(Math.cos(a)),7,oz+Math.round(Math.sin(a)),hc);
    // 頭
    rp(ox+Math.round(Math.cos(a)*2),8,oz+Math.round(Math.sin(a)*2),hc);
    rp(ox+Math.round(Math.cos(a)*2),9,oz+Math.round(Math.sin(a)*2),hc);
    // 脚（4本）
    rp(ox,4,oz,hc); rp(ox,5,oz,hc);
    const bx=ox+Math.round(Math.cos(a));
    const bz=oz+Math.round(Math.sin(a));
    rp(bx,4,bz,hc); rp(bx,5,bz,hc);
    // サドル
    rp(ox,9,oz,GD);
  }

  // 床面装飾ライト
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2;
    const lx=Math.round(Math.cos(a)*3);
    const lz=Math.round(Math.sin(a)*3);
    rp(lx,2,lz,i%3===0?LT:i%3===1?PK:CY);
  }

  const rotateMesh=bm(rv);
  const rotateGroup=new THREE.Group();
  rotateGroup.add(rotateMesh);

  const group=new THREE.Group();
  group.add(staticMesh);
  group.add(rotateGroup);
  return {group, rotateGroup};
}

  const RF=0xf0e8d8,RFD=0xe8dcc8;
  const GL=0x80c8e8,GLD=0x68b0d0;
  const BK=0x1a1a1a,MT=0x999999,MTD=0x777777;
  const WH=0xf8f8e8,RD=0xd04030,OR=0xe88830;
  const BR=0x7a5a30,BRD=0x5a3a18;
  const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);

  function isWinX(x){return(x>=2&&x<=6)||(x>=8&&x<=12)||(x>=14&&x<=17);}

  for(let x=0;x<20;x++)for(let z=0;z<8;z++){
    const isTireGap=(x>=2&&x<=4)||(x>=14&&x<=16);
    if(!isTireGap){p(x,0,z,BRD);p(x,1,z,BRD);}
  }
  for(let x=0;x<20;x++)for(let z=0;z<8;z++){p(x,2,z,Y3);p(x,3,z,Y3);}
  for(let x=0;x<20;x++){p(x,4,0,OR);p(x,4,7,OR);if(x===0||x===19)for(let z=1;z<7;z++)p(x,4,z,OR);}
  for(const zw of[0,7]){for(let x=0;x<20;x++)for(let y=5;y<=7;y++){
    if(isWinX(x)){const gc=(y===5||y===7)?GLD:GL;p(x,y,zw,gc);}else p(x,y,zw,Y1);}}
  for(let z=0;z<8;z++){for(let y=5;y<=7;y++){const isFG=z>=2&&z<=5;p(0,y,z,isFG?((y===5||y===7)?GLD:GL):Y1);}}
  p(0,7,0,RF);p(0,7,7,RF);
  for(let z=0;z<8;z++){for(let y=5;y<=7;y++){const isRG=z>=2&&z<=5&&y>=6;p(19,y,z,isRG?GL:Y1);}}

  for(let x=0;x<20;x++)for(let z=0;z<8;z++){

function buildChar(opts={}){
  const S=0.5;
  const DH=3, DB=2;
  const SK=opts.skin||0xf0c8a0;
  const E=0x202020, PKL=0xf8c0d0, MO=0xd8a080;
  const hc=opts.hair||0x3a2a1a;
  const sc=opts.shirt||0xf0f0e8, scD=opts.shirtD||0xe0e0d0;
  const pc=opts.pants||0x2a3a6a;
  const sh=opts.shoe||0x3a3a3a;

  function make(fn){
    const vv=[];
    const pp=(x,y,z,c)=>vv.push([x*S,y*S,z*S,c,S,S,S]);
    const fl=(x,y,c,d)=>{for(let z=0;z<d;z++)pp(x,y,z,c);};
    const fb=(x,y,cf,cm,cb,d)=>{pp(x,y,0,cf);for(let z=1;z<d-1;z++)pp(x,y,z,cm);pp(x,y,d-1,cb);};
    fn(pp,fl,fb);
    return bm(vv);
  }

  const root=new THREE.Group();

  // torso+head
  const torso=make((pp,fl,fb)=>{
    for(let x=2;x<=5;x++) fl(x,24,hc,DH);
    for(let x=1;x<=6;x++) fl(x,23,hc,DH);
    for(let x=1;x<=6;x++) fb(x,22,SK,SK,hc,DH);
    pp(2,22,0,E); pp(5,22,0,E);
    for(let x=1;x<=6;x++) fb(x,21,SK,SK,hc,DH);
    pp(1,21,0,PKL); pp(6,21,0,PKL);
    for(let x=1;x<=6;x++) fb(x,20,SK,SK,hc,DH);
    pp(3,20,0,MO); pp(4,20,0,MO);

    if(opts.hat){
      const hC=opts.hatC||0xe05040;
      for(let x=1;x<=6;x++) fl(x,25,hC,DH);
      for(let x=2;x<=5;x++) fl(x,26,hC,DH);
    }
    if(opts.longHair){
      for(let y=12;y<=23;y++){pp(0,y,0,hc);pp(0,y,1,hc);pp(7,y,0,hc);pp(7,y,1,hc);}
      for(let x=2;x<=5;x++) for(let y=10;y<=23;y++) pp(x,y,DH,hc);
    }
    if(opts.ponytail){
      for(let y=20;y<=24;y++){pp(3,y,DH,hc);pp(4,y,DH,hc);}
      pp(3,22,DH+1,hc); pp(4,20,DH+1,hc);
    }

    // neck
    fb(3,19,SK,SK,SK,DB); fb(4,19,SK,SK,SK,DB);

    // torso y=12~18
    for(let x=0;x<=7;x++) fl(x,18,sc,DB);
    pp(3,18,0,scD);pp(4,18,0,scD);
    for(let x=0;x<=7;x++) fl(x,17,sc,DB);
    for(let x=1;x<=6;x++) fl(x,16,sc,DB);
    for(let x=1;x<=6;x++) fl(x,15,sc,DB);
    for(let x=1;x<=6;x++) fl(x,14,sc,DB);
    for(let x=1;x<=6;x++) fl(x,13,scD,DB);
    for(let x=1;x<=6;x++) fl(x,12,sc,DB);

    if(opts.bag){
      const bC=opts.bagC||0x8a6040;
      for(let x=2;x<=5;x++) for(let y=14;y<=17;y++){pp(x,y,DB,bC);pp(x,y,DB+1,bC);}
    }
    if(opts.skirt){
      const skC=opts.skirtC||pc;
      for(let x=1;x<=6;x++) fl(x,11,skC,DB);
      for(let x=0;x<=7;x++) fl(x,10,skC,DB);
      for(let x=0;x<=7;x++) fl(x,9,skC,DB);
    }
  });
  root.add(torso);

  // left arm
  const laGrp=new THREE.Group();
  laGrp.position.set(-1*S, 18*S, (DB/2)*S);
  const laM=make((pp,fl,fb)=>{
    for(let y=-1;y>=-5;y--) fl(0,y,sc,DB);
    fb(0,-6,SK,SK,SK,DB); fb(0,-7,SK,SK,SK,DB);
  });
  laGrp.add(laM); root.add(laGrp);

  // right arm
  const raGrp=new THREE.Group();
  raGrp.position.set(8*S, 18*S, (DB/2)*S);
  const raM=make((pp,fl,fb)=>{
    for(let y=-1;y>=-5;y--) fl(0,y,sc,DB);
    fb(0,-6,SK,SK,SK,DB); fb(0,-7,SK,SK,SK,DB);
  });
  raGrp.add(raM); root.add(raGrp);

  // left leg
  const llGrp=new THREE.Group();
  llGrp.position.set(1.5*S, 12*S, (DB/2)*S);
  const llM=make((pp,fl,fb)=>{
    const legC=opts.skirt?SK:pc;
    for(let y=-1;y>=-10;y--){fl(0,y,legC,DB);fl(1,y,legC,DB);}
    for(let y=-11;y>=-12;y--){fl(0,y,sh,DB);fl(1,y,sh,DB);}
  });
  llGrp.add(llM); root.add(llGrp);

  // right leg
  const rlGrp=new THREE.Group();
  rlGrp.position.set(5*S, 12*S, (DB/2)*S);
  const rlM=make((pp,fl,fb)=>{
    const legC=opts.skirt?SK:pc;
    for(let y=-1;y>=-10;y--){fl(0,y,legC,DB);fl(1,y,legC,DB);}
    for(let y=-11;y>=-12;y--){fl(0,y,sh,DB);fl(1,y,sh,DB);}
  });
  rlGrp.add(rlM); root.add(rlGrp);

  return {root, laGrp, raGrp, llGrp, rlGrp};
}

function buildTree(trunkH, crownR){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);
  const TC=[0x8a6a40,0x7a5a30,0x9a7a50];
  const LC=[0x48a848,0x58b858,0x40a040,0x68c868,0x50b050,0x3a9a3a];
  let seed=trunkH*17+crownR*31;
  function rng(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  for(let y=0;y<trunkH*2;y++){
    for(let dx=0;dx<=1;dx++)for(let dz=0;dz<=1;dz++){
      p(dx,y,dz,TC[Math.floor(rng()*TC.length)]);
    }
    if(y<3){p(-1,y,0,TC[0]);p(2,y,0,TC[0]);p(0,y,-1,TC[0]);p(0,y,2,TC[0]);}
  }
  const cy=trunkH*2+crownR;
  const r2=crownR*crownR;
  for(let dx=-crownR;dx<=crownR;dx++)for(let dy=-crownR;dy<=crownR;dy++)for(let dz=-crownR;dz<=crownR;dz++){
    const d2=dx*dx+dy*dy+dz*dz;
    if(d2<=r2){
      const surface=d2>r2*0.6;
      const lc=surface?LC[Math.floor(rng()*3)+3]:LC[Math.floor(rng()*3)];
      if(rng()>0.12) p(dx,cy+dy,dz,lc);
    }
  }
  for(let i=0;i<4;i++){
    const ax=Math.floor(rng()*crownR*2-crownR);
    const az=Math.floor(rng()*crownR*2-crownR);
    if(ax*ax+az*az<r2*0.5){
      p(ax,cy+crownR,az,LC[3+Math.floor(rng()*3)]);
      p(ax+1,cy+crownR,az,LC[3+Math.floor(rng()*3)]);
    }
  }
  return v;
}

// 雲（浮遊するボクセル雲）
function buildCloud(seed,size){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);
  let s=seed;
  function rng(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;}
  const WH=0xffffff,WHL=0xf0f0f8;
  for(let dx=-size;dx<=size;dx++)for(let dz=-size;dz<=size;dz++){
    const d2=dx*dx+dz*dz;
    if(d2<=size*size&&rng()>0.2){
      const h=Math.max(1,Math.floor((1-d2/(size*size))*3));
      for(let dy=0;dy<h;dy++) p(dx,dy,dz,rng()>0.5?WH:WHL);
    }
  }
  return v;
}

// アニメーション
// =====================================================
const SPEED=(Math.PI*2)/29;
const clock=new THREE.Clock();
let autoRotAngle=0;

function animate(time){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // 観覧車回転
  const angle=time*0.001*SPEED;
  fw.wheelGroup.rotation.z=angle;
  for(const g of fw.gondolaGroups) g.rotation.z=-angle;

  // メリーゴーランド回転
  carousel.rotateGroup.rotation.y = t * 0.5;

  // バス走行
  busGroup.position.x = 5 + Math.sin(t*0.4)*12;

  // Walking characters
  for(const wc of walkChars) {
    const from = wc.path[wc.pathIdx];
    const to = wc.path[(wc.pathIdx+1) % wc.path.length];
    const dx = to.x - from.x, dz = to.z - from.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    wc.pathT += wc.speed * dt / dist;

    if(wc.pathT >= 1) {
      wc.pathT -= 1;
      wc.pathIdx = (wc.pathIdx + 1) % wc.path.length;
    }

    const cur = wc.path[wc.pathIdx];
    const nxt = wc.path[(wc.pathIdx+1) % wc.path.length];
    wc.root.position.x = cur.x + (nxt.x - cur.x) * wc.pathT;
    wc.root.position.z = cur.z + (nxt.z - cur.z) * wc.pathT;

    // Face walking direction
    const ang = Math.atan2(nxt.x - cur.x, nxt.z - cur.z);
    wc.root.rotation.y = ang;

    // Walk animation (arms and legs swing)
    const sw = 0.4, phase = t * 4;
    wc.laGrp.rotation.x = Math.sin(phase) * sw;
    wc.raGrp.rotation.x = -Math.sin(phase) * sw;
    wc.llGrp.rotation.x = -Math.sin(phase) * sw;
    wc.rlGrp.rotation.x = Math.sin(phase) * sw;
  }

  // Standing characters (slight sway)
  for(let i = 0; i < standChars.length; i++) {
    const sc = standChars[i];
    sc.root.rotation.y = sc.baseRotY + Math.sin(t*0.8 + i*0.9) * 0.08;
    // Slight arm swing for idle
    sc.laGrp.rotation.x = Math.sin(t*0.5 + i) * 0.05;
    sc.raGrp.rotation.x = -Math.sin(t*0.5 + i) * 0.05;
  }

  // Cloud drift
  for(const child of scene.children) {
    if(child._isCloud) {
      child.position.x = child._baseX + Math.sin(t*0.05 + child._baseX)*3;
    }
  }

  // カメラ自動回転
  if(autoRotate){
    autoRotAngle += 0.003;
    const radius = 40;
    camera.position.x = 15 + Math.cos(autoRotAngle)*radius;
    camera.position.z = 10 + Math.sin(autoRotAngle)*radius;
    camera.position.y = 25;
    camera.lookAt(15,8,10);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate(0);
