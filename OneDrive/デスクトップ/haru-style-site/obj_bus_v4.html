<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>バス v4</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">バス v4 — コンパクト・かわいいボクセルバス</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(14,10,14);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(5,3,2);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(15,25,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildBus(){
  const v=[];

  // 色定義
  const YL=0xecd040;   // 黄色（メイン）
  const YLD=0xd0b030;  // 黄色暗め（下部）
  const CR=0xf5ede0;   // クリーム（屋根）
  const BRN=0x8a6a40;  // 茶（窓枠・アクセント）
  const GL=0x88c8e8;   // ガラス水色
  const BK=0x2a2a2a;   // 黒（タイヤ）
  const MT=0x888888;   // メタル（ホイール）
  const WH=0xf0f0e0;   // 白（ライト）
  const RD=0xd04030;   // 赤（テールライト）
  const OR=0xe89030;   // オレンジ（帯・ウインカー）

  // バスサイズ: 12L(x) x 6H(y) x 5W(z)
  // y=0: タイヤの中心
  // y=1: 車体底面
  // y=2-3: 車体下部（黄色暗め）
  // y=4-5: 車体上部（黄色）+ 窓
  // y=6: 屋根

  // === タイヤ（4本、しっかり見える） ===
  for(const[tx,tz] of [[2,-.5],[2,4.5],[9,-.5],[9,4.5]]){
    // タイヤ本体
    v.push([tx,0,tz,BK,1.4,1.4,1]);
    // ホイールキャップ
    v.push([tx+0.2,0.2,tz<0?tz-0.2:tz+0.2,MT,0.8,0.8,0.3]);
  }

  // === 車体底面フレーム y=1 ===
  for(let x=0;x<12;x++) for(let z=0;z<5;z++) v.push([x,1,z,BRN]);

  // === 車体側面 ===
  // 左壁 z=0, 右壁 z=4
  for(const zw of [0,4]){
    const zo = zw===0 ? -0.05 : 0.05; // 少し外側
    for(let x=0;x<12;x++){
      // y=2: 下帯（暗い黄色）
      v.push([x,2,zw,YLD]);
      // y=3: オレンジ帯
      v.push([x,3,zw,OR]);
      // y=4-5: 窓エリア
      for(let y=4;y<=5;y++){
        // 窓の位置判定
        const isWindow =
          (x>=2&&x<=3) ||   // 窓1
          (x>=5&&x<=6) ||   // 窓2
          (x>=8&&x<=9);     // 窓3
        if(isWindow){
          v.push([x,y,zw+zo,GL]);
        } else {
          v.push([x,y,zw,YL]);
        }
      }
    }
  }

  // === 前面 x=0 ===
  for(let z=0;z<5;z++){
    v.push([0,2,z,YLD]);
    v.push([0,3,z,OR]);
    // フロントガラス
    if(z>=1&&z<=3){
      v.push([-0.05,4,z,GL]);
      v.push([-0.05,5,z,GL]);
    } else {
      v.push([0,4,z,YL]);
      v.push([0,5,z,YL]);
    }
  }

  // === 後面 x=11 ===
  for(let z=0;z<5;z++){
    v.push([11,2,z,YLD]);
    v.push([11,3,z,OR]);
    // リアガラス（小さめ）
    if(z>=1&&z<=3){
      v.push([11.05,5,z,GL]);
    }
    v.push([11,4,z,YL]);
    if(!(z>=1&&z<=3)) v.push([11,5,z,YL]);
  }

  // === 屋根 y=6 ===
  for(let x=0;x<12;x++) for(let z=0;z<5;z++) v.push([x,6,z,CR]);

  // === ヘッドライト ===
  v.push([-0.2,3,0.5,WH,0.3,0.8,0.8]);
  v.push([-0.2,3,3.5,WH,0.3,0.8,0.8]);
  // ウインカー
  v.push([-0.2,2,0.5,OR,0.3,0.6,0.6]);
  v.push([-0.2,2,3.5,OR,0.3,0.6,0.6]);

  // === テールライト ===
  v.push([11.2,3,0.3,RD,0.3,0.8,0.8]);
  v.push([11.2,3,3.7,RD,0.3,0.8,0.8]);
  // リアウインカー
  v.push([11.2,2,0.3,OR,0.3,0.6,0.6]);
  v.push([11.2,2,3.7,OR,0.3,0.6,0.6]);

  // === サイドミラー ===
  v.push([-0.3,5,-0.3,BRN,0.4,0.4,0.5]);
  v.push([-0.3,5,4.6,BRN,0.4,0.4,0.5]);
  // ミラーアーム
  v.push([0,4.5,-0.1,BRN,0.2,0.8,0.2]);
  v.push([0,4.5,4.5,BRN,0.2,0.8,0.2]);

  // === 行先表示板 ===
  v.push([-0.1,5.5,1,BRN,0.15,0.8,2.8]);
  v.push([-0.08,5.7,1.3,YL,0.08,0.4,2.2]);

  // === ドア（左側 z=0） ===
  // x=4 にドアの凹み
  // ドアはガラス+暗い黄色
  // (左壁のx=4は既にYLが置かれている→上書きはないが視覚的にドアを表現)
  // ドアのステップ
  v.push([4,1.5,-0.15,MT,1,0.3,0.2]);

  // === ナンバープレート ===
  v.push([-0.15,2,1.8,WH,0.2,0.7,1.2]);

  return v;
}

scene.add(bm(buildBus()));

// グリッド
scene.add(new THREE.GridHelper(30,15,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
