<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,500);
camera.position.set(15,25,-35);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(15,10,10);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(30,50,20);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60;sun.shadow.camera.right=60;
sun.shadow.camera.top=60;sun.shadow.camera.bottom=-20;
scene.add(sun);
window.camera=camera;

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function box(v,bx,by,bz,w,h,d,c){
  for(let x=0;x<w;x++) for(let y=0;y<h;y++) for(let z=0;z<d;z++) v.push([bx+x,by+y,bz+z,c]);
}

// =====================================================
// 1. 建物群（buildCity）
// =====================================================
function buildCity(){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);

  const PK=0xe8788a,PKL=0xf0a0a8,PKD=0xd06070;
  const BL=0x4090c8,BLD=0x306898;
  const YL=0xe8c840,YLD=0xc8a830;
  const CR=0xf0e0c8,CRD=0xd8c8a8;
  const CY=0x60c8c0,CYD=0x48a8a0;
  const OR=0xf09030,ORD=0xd07820;
  const GR=0x50a050,GRD=0x3a8038,GRL=0x70c070;
  const RD=0xe05040,WH=0xf0f0e8,GL=0x80c8e8,GLD=0x68b0d0;
  const MT=0x808888,WD=0x9a7a50,CN=0xb0b0a8;
  const BK=0x404040,BR=0x8a6040,BRD=0x6a4a20;
  const SKN=0xf0c8a0;

  // ソリッドbox
  function sbox(bx,by,bz,w,h,d,c){
    for(let x=0;x<w;x++)for(let y=0;y<h;y++)for(let z=0;z<d;z++) p(bx+x,by+y,bz+z,c);
  }
  // 窓（凹み+ガラス+枠）
  function window(wx,wy,wz,ww,wh,face,frameC){
    const fc=frameC||WH;
    for(let dx=0;dx<ww;dx++)for(let dy=0;dy<wh;dy++){
      const isFrame=dx===0||dx===ww-1||dy===0||dy===wh-1;
      const gc=isFrame?fc:((dx+dy)%2===0?GL:GLD);
      if(face==='z-') p(wx+dx,wy+dy,wz,gc);
      else if(face==='z+') p(wx+dx,wy+dy,wz,gc);
      else if(face==='x-') p(wx,wy+dy,wz+dx,gc);
      else p(wx,wy+dy,wz+dx,gc);
    }
  }

  // ==============================================
  // ピンクタワー（見本のような積み上げ不規則ブロック）
  // ==============================================
  // 1段目（大きいベース）
  sbox(16,0,12, 20,16,16, PK);
  // 1段目の表面に色差（横ラインで層を表現）
  for(let x=16;x<36;x++)for(let z=12;z<28;z++){
    p(x,4,z,PKL);p(x,8,z,PKD);p(x,12,z,PKL);
  }
  // 2段目（ずらして積む）
  sbox(12,16,8, 16,12,20, PK);
  for(let x=12;x<28;x++)for(let z=8;z<28;z++) p(x,20,z,PKL);
  // 3段目
  sbox(18,28,12, 12,12,12, PKL);
  for(let x=18;x<30;x++)for(let z=12;z<24;z++) p(x,34,z,PK);
  // 4段目（頂上）
  sbox(14,40,16, 10,8,8, PKL);
  // 小さな頂上
  sbox(20,48,18, 6,6,4, PKD);
  // 横に突き出た棟
  sbox(36,0,16, 8,24,10, PK);
  for(let z=16;z<26;z++){p(36,8,z,PKD);p(36,16,z,PKD);}

  // ピンクタワー窓（窓枠付き、正面）
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wx=18;wx<34;wx+=4) window(wx,fy,11,3,3,'z-',PKD);
  }
  for(let fl=0;fl<2;fl++){const fy=18+fl*5;
    for(let wx=14;wx<26;wx+=4) window(wx,fy,7,3,3,'z-',PKD);
  }
  for(let fl=0;fl<2;fl++){const fy=30+fl*5;
    for(let wx=20;wx<28;wx+=4) window(wx,fy,11,3,3,'z-',PKD);
  }
  // 側面窓
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wz=14;wz<26;wz+=4) window(36,fy,wz,3,3,'x-',PKD);
  }
  // 赤白ストライプひさし（1F正面）
  for(let z=12;z<28;z++){p(15,5,z,z%2===0?RD:WH);p(15,6,z,z%2===0?WH:RD);}
  // 看板（GAME等）
  sbox(24,20,7, 6,3,1, BK); sbox(25,21,6, 4,1,1, RD);
  // 屋上アンテナ
  for(let y=48;y<56;y++) p(22,y,20,MT);
  // ★ピンクタワー背面（z=28側）— 表と同じ色層+窓+ひさし
  for(let x=16;x<36;x++){p(x,4,28,PKL);p(x,8,28,PKD);p(x,12,28,PKL);}
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wx=18;wx<34;wx+=4) window(wx,fy,28,3,3,'z+',PKD);
  }
  // 背面ひさし（赤白ストライプ）
  for(let z2=12;z2<28;z2++){p(36,5,z2,z2%2===0?RD:WH);p(36,6,z2,z2%2===0?WH:RD);}
  // ★右側面（x=35）— 色層+窓
  for(let z=12;z<28;z++){p(35,4,z,PKL);p(35,8,z,PKD);p(35,12,z,PKL);}
  for(let fl=0;fl<3;fl++){const fy=2+fl*5;
    for(let wz=14;wz<26;wz+=4) window(35,fy,wz,3,3,'x+',PKD);
  }
  // ★2段目背面（z=28）
  for(let x=12;x<28;x++) p(x,20,28,PKL);
  for(let fl=0;fl<2;fl++){const fy=18+fl*5;
    for(let wx=14;wx<26;wx+=4) window(wx,fy,28,3,3,'z+',PKD);
  }
  // ★3段目背面
  for(let x=18;x<30;x++) p(x,34,24,PK);
  for(let fl=0;fl<2;fl++){const fy=30+fl*5;
    for(let wx=20;wx<28;wx+=4) window(wx,fy,24,3,3,'z+',PKD);
  }
  // ★横棟背面（x=44側）— 色層+窓
  for(let z=16;z<26;z++){p(44,8,z,PKD);p(44,16,z,PKD);}
  for(let fl=0;fl<3;fl++){const fy=2+fl*7;
    for(let wz=18;wz<24;wz+=3) window(44,fy,wz,2,3,'x+',PKD);
  }

  // ==============================================
  // 青ビル（窓たくさん、バルコニー各階）
  // ==============================================
  sbox(4,0,12, 12,28,10, BL);
  // 色の層（フロア区切り）
  for(let x=4;x<16;x++)for(let z=12;z<22;z++){
    for(const fy of [0,7,14,21]) p(x,fy,z,BLD);
  }
  // 上の小さい階
  sbox(4,28,14, 8,8,6, BLD);
  // 窓（正面x=3、窓枠白、各フロア3窓）
  for(let fl=0;fl<4;fl++){const fy=2+fl*7;
    for(let wz=14;wz<20;wz+=3) window(3,fy,wz,2,4,'x-');
  }
  // バルコニー（各フロア）
  for(let fl=0;fl<4;fl++){const fy=1+fl*7;
    sbox(1,fy,13, 3,1,7, CN);
    // 手すり（柵）
    for(let wz=13;wz<20;wz+=2){p(1,fy+1,wz,MT);p(1,fy+2,wz,MT);}
    p(1,fy+2,13,MT);p(1,fy+2,19,MT);
    // 手すり横棒
    for(let wz=13;wz<=19;wz++) p(1,fy+2,wz,MT);
  }
  // 背面窓（x=16側）
  for(let fl=0;fl<4;fl++){const fy=2+fl*7;
    for(let wz=14;wz<20;wz+=3) window(16,fy,wz,2,4,'x+');
  }
  // ★青ビル背面（z=22側）— 色層+窓+バルコニー（表と同じ）
  for(let x=4;x<16;x++)for(const fy of [0,7,14,21]) p(x,fy,22,BLD);
  for(let fl=0;fl<4;fl++){const fy=2+fl*7;
    for(let wx=6;wx<14;wx+=4) window(wx,fy,22,2,4,'z+');
  }
  // 背面バルコニー
  for(let fl=0;fl<4;fl++){const fy=1+fl*7;
    sbox(5,fy,23, 8,1,2, CN);
    for(let wx=5;wx<=12;wx+=2) p(wx,fy+2,24,MT);
    for(let wx=5;wx<=12;wx++) p(wx,fy+2,24,MT);
  }

  // ==============================================
  // 黄色ビル（窓+看板+茶屋根）
  // ==============================================
  sbox(36,0,0, 16,20,12, YL);
  // 色の層
  for(let x=36;x<52;x++)for(let z=0;z<12;z++){p(x,0,z,YLD);p(x,10,z,YLD);}
  // 上階
  sbox(38,20,2, 12,8,8, YLD);
  // 茶色屋根（段差）
  sbox(34,20,0, 20,2,14, BR);
  sbox(36,28,2, 16,2,10, BRD);
  // 窓（正面z=-1に突き出す窓枠）
  for(let fl=0;fl<3;fl++){const fy=2+fl*6;
    for(let wx=38;wx<50;wx+=4){
      window(wx,fy,-1,3,4,'z-',BR);
      // 窓の庇
      for(let dx=0;dx<3;dx++) p(wx+dx,fy+4,-2,BR);
    }
  }
  // 大看板
  sbox(40,14,-2, 10,4,1, WH);
  sbox(40,14,-3, 10,1,1, YLD);sbox(40,18,-3, 10,1,1, YLD);
  for(let dx=1;dx<9;dx+=2) p(41+dx,16,-3,BK);
  // ★黄色ビル背面窓（z=12側）
  for(let fl=0;fl<3;fl++){const fy=2+fl*6;
    for(let wx=38;wx<50;wx+=4) window(wx,fy,12,3,4,'z+',BR);
  }
  // ★黄色ビル左側面窓（x=36側はピンクタワーと隣接するので右側面x=52のみ）
  for(let fl=0;fl<3;fl++){const fy=2+fl*6;
    for(let wz=2;wz<10;wz+=4) window(52,fy,wz,3,4,'x+',BR);
  }

  // ==============================================
  // ショップ3軒（ガラス張り+内装+看板+庇）
  // ==============================================
  // 本屋（クリーム色）
  sbox(4,0,0, 10,8,10, CR);
  // 緑屋根
  sbox(2,8,0, 14,2,12, GR);
  sbox(3,10,1, 12,1,10, GRD);
  // ガラス正面（全面）
  for(let z=1;z<9;z++)for(let y=1;y<7;y++) p(3,y,z,y<6?GL:GLD);
  // 棚（奥に本がぎっしり）
  for(let y=1;y<7;y++){sbox(10,y,2,2,1,1,BR);sbox(10,y,5,2,1,1,BR);sbox(10,y,7,2,1,1,WD);}
  // 本の色
  for(let y=1;y<7;y++){p(11,y,2,RD);p(11,y,5,BL);p(11,y,7,GR);}
  // 看板
  sbox(4,6,-2, 8,2,1, WH); p(5,7,-3,BK);p(6,7,-3,BK);p(7,7,-3,BK);p(8,7,-3,BK);

  // カフェ（白+オレンジ屋根）
  sbox(16,0,0, 10,8,10, WH);
  sbox(14,8,0, 14,2,12, OR);
  sbox(15,10,1, 12,1,10, ORD);
  // ストライプひさし（前面に突き出す）
  for(let z=-2;z<10;z++) p(15,7,z,z%2===0?YL:WH);
  for(let z=-2;z<10;z++) p(15,6,z,z%2===0?WH:YL);
  // ガラス正面
  for(let z=1;z<9;z++)for(let y=1;y<6;y++) p(15,y,z,GL);
  // テーブル+椅子
  p(18,1,3,WD);p(18,2,3,BR);p(19,1,2,WD);p(19,1,4,WD); // テーブル+椅子
  p(22,1,5,WD);p(22,2,5,BR);p(23,1,4,WD);p(23,1,6,WD);
  // カップ
  p(18,3,3,WH);p(22,3,5,RD);

  // IT教室（緑）
  sbox(28,0,0, 10,8,10, GRL);
  sbox(26,8,0, 14,2,12, GR);
  sbox(27,10,1, 12,1,10, GRD);
  // ガラス正面
  for(let z=1;z<9;z++)for(let y=1;y<6;y++) p(27,y,z,GL);
  // PC3台（モニター+キーボード）
  for(const pz of [2,5,7]){
    p(32,1,pz,MT);p(32,2,pz,MT);
    p(32,3,pz,BK);p(32,4,pz,BL);
    p(33,2,pz,MT);p(31,1,pz,BK);
  }
  // ★ショップ3軒の背面窓
  // 本屋背面（x=14）
  for(let wz=2;wz<8;wz+=3) window(14,2,wz,2,3,'x+',CRD);
  // カフェ背面（x=26）
  for(let wz=2;wz<8;wz+=3) window(26,2,wz,2,3,'x+',CR);
  // IT教室背面（x=38）
  for(let wz=2;wz<8;wz+=3) window(38,2,wz,2,3,'x+',GRD);
  // ★ショップ側面窓
  // 本屋側面z=10
  window(6,2,10,3,3,'z+',CRD);
  // カフェ側面z=10
  window(18,2,10,3,3,'z+',CR);
  // IT教室側面z=10
  window(30,2,10,3,3,'z+',GRD);

  // ==============================================
  // クリーム色ビル（奥、窓枠+ピンク屋根）
  // ==============================================
  sbox(0,0,24, 14,12,12, CR);
  // 色の層
  for(let x=0;x<14;x++)for(let z=24;z<36;z++){p(x,0,z,CRD);p(x,6,z,CRD);}
  sbox(0,12,26, 10,6,8, CRD);
  // ピンク屋根（段差付き）
  sbox(-2,12,22, 18,2,16, PKL);
  sbox(0,18,26, 12,1,8, PKD);
  // 窓（正面z=23に窓枠付き）
  for(let fl=0;fl<2;fl++){const fy=2+fl*6;
    for(let wx=2;wx<12;wx+=3){
      window(wx,fy,23,2,3,'z-',CRD);
      // 窓の下に花台
      p(wx,fy-1,22,BR);p(wx+1,fy-1,22,BR);
      p(wx,fy,22,GR);p(wx+1,fy,22,RD); // 花
    }
  }

  // ==============================================
  // シアンビル（右奥、外階段+窓）
  // ==============================================
  sbox(44,0,16, 10,16,12, CY);
  for(let x=44;x<54;x++)for(let z=16;z<28;z++){p(x,0,z,CYD);p(x,8,z,CYD);}
  // 屋根
  sbox(42,16,14, 14,2,16, CYD);
  // 窓（枠付き）
  for(let fl=0;fl<2;fl++){const fy=2+fl*8;
    for(let wz=18;wz<26;wz+=4) window(43,fy,wz,3,4,'x-',CYD);
  }
  // 外階段（きちんと段差）
  for(let s=0;s<10;s++){
    p(54,s,17+s,YL);p(55,s,17+s,YL);
    p(54,s+1,17+s,MT);
  }
  // ★シアンビル背面窓（z=28側）
  for(let fl=0;fl<2;fl++){const fy=2+fl*8;
    for(let wx=46;wx<52;wx+=3) window(wx,fy,28,3,4,'z+',CYD);
  }
  // ★シアンビル右側面窓（x=54側）
  for(let fl=0;fl<2;fl++){const fy=2+fl*8;
    for(let wz=18;wz<26;wz+=4) window(54,fy,wz,3,4,'x+',CYD);
  }

  // ★クリームビル背面窓（z=36側）
  for(let fl=0;fl<2;fl++){const fy=2+fl*6;
    for(let wx=2;wx<12;wx+=3) window(wx,fy,36,2,3,'z+',CRD);
  }
  // ★クリームビル右側面窓（x=14側）
  for(let fl=0;fl<2;fl++){const fy=2+fl*6;
    for(let wz=26;wz<34;wz+=4) window(14,fy,wz,2,3,'x+',CRD);
  }

  // ==============================================
  // 道路（歩道+車道+白線+マンホール）
  // ==============================================
  for(let x=-4;x<60;x++){p(x,0,-2,CN);p(x,0,-3,CN);}
  for(let x=-4;x<60;x++){p(x,-1,-4,GRD);p(x,-1,-5,GRD);p(x,-1,-6,GRD);p(x,-1,-7,GRD);}
  for(let x=-4;x<60;x++){p(x,0,-8,CN);p(x,0,-9,CN);}
  for(let x=-4;x<60;x+=4){p(x,-1,-5,WH);p(x+1,-1,-5,WH);}
  p(10,-1,-6,MT);p(11,-1,-6,MT);p(10,-1,-5,MT);p(11,-1,-5,MT);
  p(30,-1,-6,MT);p(31,-1,-6,MT);

  // ==============================================
  // ★裏通り（建物の奥側にも道路・歩道・小物を配置）
  // ==============================================
  // 裏の道路（z=30〜34あたり）
  for(let x=-4;x<60;x++){
    p(x,0,30,CN);p(x,0,31,CN); // 歩道
    p(x,-1,32,GRD);p(x,-1,33,GRD);p(x,-1,34,GRD); // 車道
    p(x,0,35,CN);p(x,0,36,CN); // 反対歩道
  }
  // 白線
  for(let x=-4;x<60;x+=4){p(x,-1,33,WH);p(x+1,-1,33,WH);}

  // 裏通りの人々もbuildCity外で配置

  // 裏通りの植木鉢
  for(const px of [6,14,22,30,38,46]){
    p(px,1,31,BR);p(px,2,31,GR);p(px,3,31,px%3===0?RD:YL);
  }

  // ベンチ（裏通り）
  sbox(10,1,36, 4,1,2, WD);sbox(10,2,37, 4,1,1, WD); // 座面+背もたれ
  sbox(26,1,36, 4,1,2, WD);sbox(26,2,37, 4,1,1, WD);

  const RIM_R=10,GOND_R=17,HUB_Y=GOND_R+10,NGON=8,S=0.5;

  const vs=[];
  for(const zz of[-2,2]){
    for(let y=0;y<=HUB_Y;y++){const t=y/HUB_Y;
      const lx=-7*(1-t);vs.push([lx,y,zz,F]);vs.push([lx+1,y,zz,F]);
      const rx=7*(1-t);vs.push([rx,y,zz,F]);vs.push([rx-1,y,zz,F]);}
    for(const y of[6,14]){const t=y/HUB_Y;const l=Math.floor(-7*(1-t)),r=Math.ceil(7*(1-t));
      for(let x=l;x<=r;x++)vs.push([x,y,zz,FD]);}
  }
  for(let y=0;y<=HUB_Y;y+=4)for(let z=-2;z<=2;z++)vs.push([0,y,z,FD,0.5,0.5,0.5]);
  for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){if(dx*dx+dy*dy<=5)for(let z=-2;z<=2;z++)vs.push([dx,HUB_Y+dy,z,HB]);}
  for(let x=-9;x<=9;x++)for(let z=-4;z<=4;z++)vs.push([x,0,z,BP]);
  for(let x=-8;x<=8;x++)for(let z=-3;z<=3;z++)vs.push([x,-1,z,BG]);

  const staticMesh=bm(vs);

  const vw=[];
  {const set=new Set();
  for(const r of[RIM_R-0.5,RIM_R,RIM_R+0.5]){
    for(let i=0;i<200;i++){const a=(i/200)*Math.PI*2;
      const rx=Math.round(Math.cos(a)*r/S)*S,ry=Math.round(Math.sin(a)*r/S)*S;
      const k=rx+','+ry;if(set.has(k))continue;set.add(k);
      for(let z=-2;z<=2;z++)vw.push([rx,ry,z,WH,S,S,S]);}}}
  for(let g=0;g<NGON;g++){const a=(g/NGON)*Math.PI*2;const cos=Math.cos(a),sin=Math.sin(a);
    for(let r=3;r<=GOND_R;r++){vw.push([cos*r,sin*r,-1,F]);vw.push([cos*r,sin*r,0,F]);vw.push([cos*r,sin*r,1,F]);}}
  for(let g=0;g<NGON;g++){const a=(g/NGON)*Math.PI*2;
    vw.push([Math.cos(a)*(GOND_R+1),Math.sin(a)*(GOND_R+1),-2,LT,0.5,0.5,0.5]);
    vw.push([Math.cos(a)*(GOND_R+1),Math.sin(a)*(GOND_R+1),2,LT,0.5,0.5,0.5]);}

  const wheelMesh=bm(vw);
  const wheelGroup=new THREE.Group();
  wheelGroup.position.set(0,HUB_Y,0);
  wheelGroup.add(wheelMesh);

  const gondolaGroups=[];
  for(let g=0;g<NGON;g++){
    const a=(g/NGON)*Math.PI*2;const gx=Math.cos(a)*GOND_R,gy=Math.sin(a)*GOND_R;
    const gc=GC[g];const gv=[];
    for(let t=0;t<3;t++){gv.push([-0.3,-t,0,SP,0.3,1,0.3]);gv.push([0.3,-t,0,SP,0.3,1,0.3]);}
    const cx=-2,cy=-6,cz=-1.5;
    for(let x=0;x<4;x++)for(let z=0;z<3;z++)gv.push([cx+x,cy,cz+z,gc]);
    for(let y=1;y<=3;y++){gv.push([cx,cy+y,cz,gc]);gv.push([cx+3,cy+y,cz,gc]);gv.push([cx,cy+y,cz+2,gc]);gv.push([cx+3,cy+y,cz+2,gc]);}
    for(let x=0;x<4;x++){gv.push([cx+x,cy+3,cz,gc]);gv.push([cx+x,cy+3,cz+2,gc]);gv.push([cx+x,cy+1,cz,gc]);gv.push([cx+x,cy+1,cz+2,gc]);}
    for(let z=0;z<3;z++){gv.push([cx,cy+3,cz+z,gc]);gv.push([cx+3,cy+3,cz+z,gc]);}

    const gm=bm(gv);const gg=new THREE.Group();gg.position.set(gx,gy,0);gg.add(gm);

  }

  const group=new THREE.Group();

  return {group,wheelGroup,gondolaGroups};
}

  for(let x=1;x<=7;x++)for(let y=3;y<=7;y++)v.push([x,y,D,PK,1,1,1]);

  v.push([0,5,0,S2,1,1,D]);for(let x=1;x<=7;x++)v.push([x,5,0,PK,1,1,D]);v.push([2,5,0,WH,1,1,D]);v.push([8,5,0,S2,1,1,D]);
  v.push([0,4,0,S2,1,1,D]);for(let x=1;x<=7;x++)v.push([x,4,0,PK,1,1,D]);v.push([8,4,0,GY,1,1,D]);v.push([9,4,0,GY,1,1,D]);v.push([9,5,0,WH,1,1,D]);v.push([9,6,0,WH,1,1,D]);
  for(let x=1;x<=7;x++)v.push([x,3,0,PKD,1,1,D]);

  // 足
  v.push([2,2,0,S2,1,1,D]);v.push([3,2,0,S2,1,1,D]);v.push([5,2,0,S2,1,1,D]);v.push([6,2,0,S2,1,1,D]);
  v.push([2,1,0,S2,1,1,D]);v.push([3,1,0,S2,1,1,D]);v.push([5,1,0,S2,1,1,D]);v.push([6,1,0,S2,1,1,D]);
  for(const x of[2,3,5,6])for(let y=1;y<=2;y++)v.push([x,y,D,S2,1,1,1]);

  // 靴
  v.push([1,0,0,WH,1,1,D]);v.push([2,0,0,WH,1,1,D]);v.push([3,0,0,WH,1,1,D]);
  v.push([5,0,0,WH,1,1,D]);v.push([6,0,0,WH,1,1,D]);v.push([7,0,0,WH,1,1,D]);
  for(const x of[1,2,3,5,6,7])v.push([x,0,D,WH,1,1,1]);
  return v;
}

// もこもこした木（0.5ボクセルで細かく）大きく作って縮小
function buildTree(trunkH, crownR){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);
  const TC=[0x8a6a40,0x7a5a30,0x9a7a50]; // 幹3色
  const LC=[0x48a848,0x58b858,0x40a040,0x68c868,0x50b050,0x3a9a3a]; // 葉6色
  let seed=trunkH*17+crownR*31;
  function rng(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}

  // 幹（太さ2x2ボクセル、表面にバーク模様）
  for(let y=0;y<trunkH*2;y++){
    for(let dx=0;dx<=1;dx++)for(let dz=0;dz<=1;dz++){
      p(dx,y,dz,TC[Math.floor(rng()*TC.length)]);
    }
    // 幹の根元は太く
    if(y<3){
      p(-1,y,0,TC[0]);p(2,y,0,TC[0]);
      p(0,y,-1,TC[0]);p(0,y,2,TC[0]);
    }
  }

  // 樹冠（球状、半ボクセルで細かく。内外で色を変える）
  const cy=trunkH*2+crownR;
  const r2=crownR*crownR;
  for(let dx=-crownR;dx<=crownR;dx++)for(let dy=-crownR;dy<=crownR;dy++)for(let dz=-crownR;dz<=crownR;dz++){
    const d2=dx*dx+dy*dy+dz*dz;
    if(d2<=r2){
      // 表面に近いほど明るい緑
      const surface=d2>r2*0.6;
      const lc=surface?LC[Math.floor(rng()*3)+3]:LC[Math.floor(rng()*3)];
      // ところどころ隙間を空けてもこもこ感
      if(rng()>0.12) p(dx,cy+dy,dz,lc);
    }
  }
  // 上にぽこっと突き出る葉（もこもこ感）
  for(let i=0;i<4;i++){
    const ax=Math.floor(rng()*crownR*2-crownR);
    const az=Math.floor(rng()*crownR*2-crownR);
    if(ax*ax+az*az<r2*0.5){
      p(ax,cy+crownR,az,LC[3+Math.floor(rng()*3)]);
      p(ax+1,cy+crownR,az,LC[3+Math.floor(rng()*3)]);
    }
  }
  return v;
}

// 救急車
function buildAmbulance(){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);
  const WH=0xf0f0e8,RD=0xd04030,GL=0x80c8e8,BK=0x1a1a1a,MT=0x999999;
  const BL=0x3070c0,OR=0xe88830;
  // 車体（白、12x7x6ハーフボクセル）
  for(let x=0;x<12;x++)for(let z=0;z<6;z++){p(x,2,z,WH);p(x,3,z,WH);}
  for(let x=0;x<12;x++)for(let z=0;z<6;z++)p(x,4,z,WH);
  // 赤帯
  for(let x=0;x<12;x++){p(x,3,0,RD);p(x,3,5,RD);}
  // 窓エリア（前半はキャビン）
  for(let x=0;x<5;x++)for(let z=0;z<6;z++){p(x,5,z,WH);p(x,6,z,WH);}
  // キャビン窓
  for(const zw of[0,5])for(let x=1;x<=3;x++){p(x,5,zw,GL);p(x,6,zw,GL);}
  // フロントガラス
  for(let z=1;z<=4;z++){p(-1,5,z,GL);p(-1,6,z,GL);}
  // 屋根（キャビン部）
  for(let x=0;x<5;x++)for(let z=0;z<6;z++)p(x,7,z,WH);
  // 赤十字マーク（側面）
  for(const zw of[0,5]){p(8,4,zw,RD);p(7,5,zw,RD);p(8,5,zw,RD);p(9,5,zw,RD);p(8,6,zw,RD);}
  // 回転灯
  p(2,8,2,RD);p(2,8,3,BL);
  // タイヤ
  for(const tx of[2,9])for(const tz of[-1,6]){p(tx,1,tz,BK);p(tx+1,1,tz,BK);p(tx,0,tz,BK);p(tx+1,0,tz,BK);}
  // バンパー
  for(let z=0;z<6;z++){p(-1,2,z,MT);p(12,2,z,MT);}
  // ヘッドライト
  p(-1,3,1,WH);p(-1,3,4,WH);
  // テールライト
  p(12,3,1,RD);p(12,3,4,RD);
  // 後部ドアの線
  p(12,4,2,MT);p(12,4,3,MT);p(12,5,2,MT);p(12,5,3,MT);
  return v;
}

  const ST=0xb0b0a8,STD=0x909088,WT=0x60b0e0,WTL=0x80c8f0;

      else p(dx,1,dz,rng()>0.5?WT:WTL); // 水面
    }
  }
  // 中央の柱（装飾付き）
  for(let y=0;y<8;y++){p(0,y,0,ST);p(1,y,0,ST);p(0,y,1,ST);p(1,y,1,ST);}

  for(let dx=-1;dx<=2;dx++)for(let dz=-1;dz<=2;dz++)p(dx,8,dz,ST);

  return v;
}

// 病院（0.5ボクセルで細かく、大きく作って縮小）
function buildHospital(){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);
  const WH=0xf0f0e8,WHD=0xe0e0d0,GL=0x80c8e8,GLD=0x68b0d0;
  const RD=0xd04030,BL=0x4090c8,BLD=0x306898;
  const MT=0x888888,CN=0xc0b8a8,CND=0xa0988a;

  // 本体（20x24x14ハーフボクセル = 10x12x7ユニット）
  for(let x=0;x<20;x++)for(let z=0;z<14;z++){
    for(let y=0;y<24;y++){
      // 外壁のみ（内部は空洞）
      if(x===0||x===19||z===0||z===13||y===0||y===23){
        const isCornerTop=(y>=22)&&((x===0&&z===0)||(x===0&&z===13)||(x===19&&z===0)||(x===19&&z===13));
        if(!isCornerTop) p(x,y,z,y===0?CND:WH);
      }
    }
  }

  // 窓（規則的に並ぶ、青ガラス）各フロア4窓×2面
  for(let floor=0;floor<4;floor++){
    const fy=3+floor*5;
    // 正面（z=0）
    for(let wx=2;wx<18;wx+=4){
      for(let dy=0;dy<3;dy++)for(let dx=0;dx<2;dx++){
        p(wx+dx,fy+dy,-1,(dy===0||dy===2)?GLD:GL);
      }
    }
    // 背面（z=13）
    for(let wx=2;wx<18;wx+=4){
      for(let dy=0;dy<3;dy++)for(let dx=0;dx<2;dx++){
        p(wx+dx,fy+dy,14,(dy===0||dy===2)?GLD:GL);
      }
    }
    // 側面（x=0, x=19）
    for(let wz=2;wz<12;wz+=4){
      for(let dy=0;dy<3;dy++)for(let dz=0;dz<2;dz++){
        p(-1,fy+dy,wz+dz,(dy===0||dy===2)?GLD:GL);
        p(20,fy+dy,wz+dz,(dy===0||dy===2)?GLD:GL);
      }
    }
    // フロアライン
    for(let x=0;x<20;x++){p(x,fy-1,0,BLD);p(x,fy-1,13,BLD);}
  }

  // 玄関（正面中央、大きめ）
  for(let dx=7;dx<=12;dx++){
    p(dx,1,-1,GL);p(dx,2,-1,GL);p(dx,3,-1,GL);
  }
  // 玄関の庇
  for(let dx=6;dx<=13;dx++)for(let dz=-2;dz<=0;dz++) p(dx,4,dz,CN);
  // 柱
  for(let y=0;y<4;y++){p(6,y,-2,CN);p(13,y,-2,CN);}

  // 赤十字マーク（正面上部）
  for(let dy=-2;dy<=2;dy++) p(10,20+dy,-1,RD);
  for(let dx=-2;dx<=2;dx++) p(10+dx,20,-1,RD);

  // 「H」の看板
  p(9,22,-1,BL);p(11,22,-1,BL);p(10,21,-1,BL);
  for(let dy=20;dy<=22;dy++){p(8,dy,-1,BL);p(12,dy,-1,BL);}

  // 屋上設備
  for(let dx=2;dx<=4;dx++)for(let dz=3;dz<=5;dz++) p(dx,24,dz,MT);
  for(let dx=14;dx<=17;dx++)for(let dz=8;dz<=10;dz++) p(dx,24,dz,MT);
  // ヘリパッド風の十字
  for(let dx=8;dx<=11;dx++) p(dx,24,7,WH);
  for(let dz=5;dz<=9;dz++) p(10,24,dz,WH);

  return v;
}

// マンション（0.5ボクセルで細かく）
function buildApartment(){
  const v=[];const S=0.5;
  const p=(x,y,z,c)=>v.push([x*S,y*S,z*S,c,S,S,S]);
  const CR=0xf0e0c8,CRD=0xd8c8a8,GL=0x80c8e8,GLD=0x68b0d0;
  const OR=0xf09030,ORD=0xd07820,WH=0xf0f0e8;
  const BRN=0x8a6a40,MT=0x888888,PK=0xf0a0b0;

  // 本体（12x30x10）
  for(let x=0;x<12;x++)for(let z=0;z<10;z++){
    for(let y=0;y<30;y++){
      if(x===0||x===11||z===0||z===9||y===0||y===29){
        p(x,y,z,y===0?MT:CR);
      }
    }
  }

  // バルコニー＋窓（各フロア）
  for(let floor=0;floor<5;floor++){
    const fy=2+floor*5;
    // 正面（z=0）バルコニー付き窓
    for(let wx=1;wx<11;wx+=3){
      // 窓
      for(let dy=0;dy<3;dy++) p(wx,fy+dy,-1,(dy===1)?GL:GLD);
      for(let dy=0;dy<3;dy++) p(wx+1,fy+dy,-1,(dy===1)?GL:GLD);
      // バルコニー床
      p(wx-1,fy-1,-2,CRD);p(wx,fy-1,-2,CRD);p(wx+1,fy-1,-2,CRD);p(wx+2,fy-1,-2,CRD);
      // 手すり
      p(wx-1,fy,-2,MT);p(wx+2,fy,-2,MT);
      p(wx-1,fy,-2,MT);p(wx,fy,-2,MT);p(wx+1,fy,-2,MT);p(wx+2,fy,-2,MT);
    }
    // 背面窓
    for(let wx=2;wx<10;wx+=3){
      for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++) p(wx+dx,fy+dy,10,GL);
    }
    // フロアライン
    for(let x=0;x<12;x++) p(x,fy+3,0,ORD);
  }

  // 屋上
  for(let x=0;x<12;x++)for(let z=0;z<10;z++) p(x,30,z,CRD);
  // 給水タンク
  for(let dx=4;dx<=7;dx++)for(let dz=3;dz<=6;dz++)for(let dy=30;dy<=33;dy++) p(dx,dy,dz,0x60c8c0);
  p(5,34,4,MT);p(6,34,5,MT);

  // エントランス
  for(let dx=4;dx<=7;dx++)for(let dy=1;dy<=4;dy++) p(dx,dy,-1,GL);
  for(let dx=3;dx<=8;dx++) p(dx,5,-1,OR);
  for(let dx=3;dx<=8;dx++) p(dx,5,-2,OR);

  return v;
}

// 小さなクリニック（0.5ボクセルで細かく）
function buildClinic(){
  const v=[];const S=0.5;

  const WH=0xf0f0e8,PK=0xf0a0b0,PKL=0xf8c0d0,GL=0x80c8e8;

      if(x===0||x===13||z===0||z===9||y===0){

  // 2階の壁
  for(let x=0;x<14;x++)for(let z=0;z<10;z++){
    if(x===0||x===13||z===0||z===9) p(x,9,z,WH);
  }

  // 屋根（ピンク、三角屋根風に段差）
  for(let x=-1;x<=14;x++)for(let z=-1;z<=10;z++) p(x,10,z,PK);
  for(let x=0;x<=13;x++)for(let z=0;z<=9;z++) p(x,11,z,PK);
  for(let x=1;x<=12;x++)for(let z=1;z<=8;z++) p(x,12,z,PKL);

  // 窓（1階・2階）
  for(const fy of [2,7]){
    for(let wx=2;wx<12;wx+=3){
      for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++) p(wx+dx,fy+dy,-1,GL);
    }
  }
  // 側面窓
  for(const fy of [2,7]){
    for(let wz=2;wz<8;wz+=3){
      for(let dy=0;dy<2;dy++)for(let dz=0;dz<2;dz++) p(-1,fy+dy,wz+dz,GL);
      for(let dy=0;dy<2;dy++)for(let dz=0;dz<2;dz++) p(14,fy+dy,wz+dz,GL);
    }
  }

  // 玄関ドア
  for(let dy=1;dy<=4;dy++) p(6,dy,-1,BRN);
  for(let dy=1;dy<=4;dy++) p(7,dy,-1,BRN);
  // ドア上の庇
  for(let dx=4;dx<=9;dx++) p(dx,5,-2,PK);

  // 赤十字
  for(let dy=-1;dy<=1;dy++) p(7,8+dy,-1,RD);
  for(let dx=-1;dx<=1;dx++) p(7+dx,8,-1,RD);

  // 植え込み（玄関横）
  for(let dx=1;dx<=3;dx++){p(dx,1,-2,GR);p(dx,2,-2,GR);}
  for(let dx=10;dx<=12;dx++){p(dx,1,-2,GR);p(dx,2,-2,GR);}

  return v;
}

// 汎用人物ビルダー（大きく作る、buildDoctor/buildNurse準拠）
function buildPerson(shirtC, pantsC, hairC, shoeC){
  const v=[]; const D=7;
  const SK=0xf0c8a0, SD=0xe0b890, E=0x202020;
  const PKL=0xf8c0d0;
  const hc=hairC||0x3a2a1a, sc=shirtC||0xf0f0e8, pc=pantsC||0x2a3a6a, sh=shoeC||0x3a3a3a;
  // 髪
  for(let x=1;x<=7;x++) v.push([x,13,0,hc,1,1,D]);
  for(let x=0;x<=8;x++) v.push([x,12,0,hc,1,1,D]);
  for(let x=1;x<=7;x++) for(let y=10;y<=13;y++) v.push([x,y,D,hc,1,1,1]);
  // 顔
  v.push([0,11,0,hc,1,1,D]); for(let x=1;x<=7;x++) v.push([x,11,0,SK,1,1,D]); v.push([8,11,0,hc,1,1,D]);
  v.push([0,10,0,hc,1,1,D]); v.push([1,10,0,SK,1,1,D]); v.push([2,10,0,E,1,1,D]);
  v.push([3,10,0,SK,1,1,D]); v.push([4,10,0,SK,1,1,D]); v.push([5,10,0,SK,1,1,D]);
  v.push([6,10,0,E,1,1,D]); v.push([7,10,0,SK,1,1,D]); v.push([8,10,0,hc,1,1,D]);
  for(let y=8;y<=11;y++){v.push([0,y,D,SK,1,1,1]);v.push([8,y,D,SK,1,1,1]);}
  for(let x=1;x<=7;x++) v.push([x,9,0,SK,1,1,D]); v.push([2,9,0,PKL,1,1,D]); v.push([6,9,0,PKL,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,8,0,SK,1,1,D]); v.push([3,8,0,SD,1,1,D]); v.push([4,8,0,SD,1,1,D]); v.push([5,8,0,SD,1,1,D]);
  // 首
  v.push([3,7,0,SK,1,1,D]); v.push([4,7,0,SK,1,1,D]); v.push([5,7,0,SK,1,1,D]);
  // 体
  for(let x=0;x<=8;x++) v.push([x,6,0,sc,1,1,D]);
  for(let x=0;x<=8;x++) v.push([x,5,0,sc,1,1,D]);
  v.push([0,4,0,SK,1,1,D]); for(let x=1;x<=7;x++) v.push([x,4,0,sc,1,1,D]); v.push([8,4,0,SK,1,1,D]);
  for(let x=1;x<=7;x++) v.push([x,3,0,sc,1,1,D]);
  for(let x=1;x<=7;x++) for(let y=3;y<=6;y++) v.push([x,y,D,sc,1,1,1]);
  // ズボン
  v.push([2,2,0,pc,1,1,D]); v.push([3,2,0,pc,1,1,D]); v.push([5,2,0,pc,1,1,D]); v.push([6,2,0,pc,1,1,D]);
  v.push([2,1,0,pc,1,1,D]); v.push([3,1,0,pc,1,1,D]); v.push([5,1,0,pc,1,1,D]); v.push([6,1,0,pc,1,1,D]);
  for(const x of[2,3,5,6]) for(let y=1;y<=2;y++) v.push([x,y,D,pc,1,1,1]);
  // 靴
  v.push([1,0,0,sh,1,1,D]); v.push([2,0,0,sh,1,1,D]); v.push([3,0,0,sh,1,1,D]);
  v.push([5,0,0,sh,1,1,D]); v.push([6,0,0,sh,1,1,D]); v.push([7,0,0,sh,1,1,D]);
  for(const x of[1,2,3,5,6,7]) v.push([x,0,D,sh,1,1,1]);
  return v;
}

// 芝生の地面（ボクセルで表現、濃淡+花+草）
{
  const gv=[];
  const G1=0x5a9e38; // 芝生メイン
  const G2=0x6ab848; // 芝生明るめ
  const G3=0x4a8828; // 芝生暗め
  const G4=0x7ac858; // 芝生ハイライト
  const DR=0x8a7a58; // 土
  const gs=[G1,G1,G1,G2,G2,G3,G3,G4]; // ランダム用

  // シード付き擬似乱数（再現性）
  let seed=42;
  function rng(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}

  // 芝生タイル（-10〜40 x -10〜30）
  for(let x=-10;x<40;x++) for(let z=-10;z<30;z++){
    const gc=gs[Math.floor(rng()*gs.length)];
    gv.push([x,-0.15,z,gc,1,0.15,1]);
    // 少しの確率で土パッチ
    if(rng()<0.03) gv.push([x,-0.15,z,DR,1,0.15,1]);
  }

  // 小さな草（ところどころ高さ0.3の濃い緑ボクセル）
  for(let i=0;i<80;i++){
    const gx=Math.floor(rng()*50)-10;
    const gz=Math.floor(rng()*40)-10;
    // 建物・道路エリアを避ける
    if(gz>=-5&&gz<=0) continue; // 道路
    if(gx>=0&&gx<=28&&gz>=0&&gz<=18) continue; // 建物エリア
    gv.push([gx,0,gz,0x3a7a20,0.3,0.4,0.3]);
  }

  // 小花（白・黄・ピンク・赤をちらほら）
  const flowerColors=[0xf0f0e0,0xf0d848,0xf0a0b0,0xe05040,0xa0a0f0];
  for(let i=0;i<40;i++){
    const fx=Math.floor(rng()*50)-10;
    const fz=Math.floor(rng()*40)-10;
    if(fz>=-5&&fz<=0) continue;
    if(fx>=0&&fx<=28&&fz>=0&&fz<=18) continue;
    const fc=flowerColors[Math.floor(rng()*flowerColors.length)];
    gv.push([fx+0.3,0,fz+0.3,fc,0.3,0.3,0.3]);
    // 茎
    gv.push([fx+0.35,0,fz+0.35,0x4a8828,0.15,0.15,0.15]);
  }

  const grassMesh=bm(gv);
  grassMesh.receiveShadow=true;
  scene.add(grassMesh);

  // 遠景の地面（芝生の外側はシンプルな板で）
  const farGeo=new THREE.PlaneGeometry(200,200);
  farGeo.rotateX(-Math.PI/2);
  const farMat=new THREE.MeshLambertMaterial({color:0x6aaa40});
  const farGround=new THREE.Mesh(farGeo,farMat);
  farGround.position.set(10,-0.2,10);
  farGround.receiveShadow=true;
  scene.add(farGround);
}

// =====================================================
// アニメーション
// =====================================================
const SPEED=(Math.PI*2)/29;
const clock=new THREE.Clock();

function animate(time){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  // 観覧車回転
  const angle=time*0.001*SPEED;
  fw.wheelGroup.rotation.z=angle;
  for(const g of fw.gondolaGroups)g.rotation.z=-angle;

  // バス走行（左右に往復）
  busGroup.position.x = 5 + Math.sin(t*0.4)*12;

  // 全人物: 揺れるアイドルアニメーション
  for(let ci=0;ci<scene.children.length;ci++){
    const child=scene.children[ci];
    if(child._isPerson){
      child.rotation.y = child._baseRotY + Math.sin(t*0.8+ci*0.9)*0.15;
      child.rotation.z = Math.sin(t*0.5+ci*1.3)*0.06;
    }
  }

  controls.update();
  renderer.render(scene,camera);
}
animate(0);

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
