<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>路面電車 v1</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">路面電車 v1 — 大きく作成（縮小して街に配置する前提）</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(25,15,25);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(10,4,0);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(15,25,10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function box(v,bx,by,bz,w,h,d,c){
  for(let x=0;x<w;x++) for(let y=0;y<h;y++) for(let z=0;z<d;z++) v.push([bx+x,by+y,bz+z,c]);
}

function buildTram(){
  const v=[];

  const YL=0xe8c840, YLD=0xc8a828;
  const GR=0x50a050, GRD=0x3a8038;
  const WH=0xf0f0e8, CR=0xf0e0c8;
  const GL=0x90c8e0, GLD=0x70a8c0;
  const BK=0x303030, MT=0x808888;
  const RD=0xe05040, OR=0xf09030;

  // 電車サイズ: 20L x 8H x 6W (大きく作る)

  // === 車体下部（台車フレーム） ===
  box(v, 0,0,-1, 20,1,8, BK);

  // === 車輪 (4つ) ===
  v.push([2,0,-2, BK, 2,1,1]);
  v.push([2,0,7, BK, 2,1,1]);
  v.push([16,0,-2, BK, 2,1,1]);
  v.push([16,0,7, BK, 2,1,1]);

  // === 車体メイン（黄色） ===
  // 底板
  box(v, 0,1,-1, 20,1,8, YLD);

  // 左壁 (z=-1)
  for(let x=0;x<20;x++) for(let y=2;y<8;y++) v.push([x,y,-1,YL]);
  // 右壁 (z=6)
  for(let x=0;x<20;x++) for(let y=2;y<8;y++) v.push([x,y,6,YL]);

  // 前壁 (x=0)
  for(let z=0;z<6;z++) for(let y=2;y<8;y++) v.push([0,y,z,YL]);
  // 後壁 (x=19)
  for(let z=0;z<6;z++) for(let y=2;y<8;y++) v.push([19,y,z,YL]);

  // === 緑のライン（下部アクセント） ===
  for(let x=0;x<20;x++){
    v.push([x,2,-1.1,GR,1,2,0.1]);
    v.push([x,2,6.1,GR,1,2,0.1]);
  }

  // === 窓（左側・右側） ===
  // 左側 (z=-1) — 大きな窓
  for(let wx=2;wx<18;wx+=3){
    v.push([wx,4,-1.1,GL,2,3,0.1]);
  }
  // 右側 (z=6)
  for(let wx=2;wx<18;wx+=3){
    v.push([wx,4,6.1,GL,2,3,0.1]);
  }

  // === 前面窓 ===
  v.push([0.1,4,1,GL,0.1,3,4]);
  // 前面ライト
  v.push([-0.1,3,0,OR,0.2,1,1]);
  v.push([-0.1,3,5,OR,0.2,1,1]);

  // === 後面窓 ===
  v.push([19.9,4,1,GL,0.1,3,4]);
  // 後面ライト
  v.push([20.1,3,0,RD,0.2,1,1]);
  v.push([20.1,3,5,RD,0.2,1,1]);

  // === ドア（左側、中央付近） ===
  v.push([9,2,-1.1,GLD,1,5,0.1]);
  v.push([10,2,-1.1,GLD,1,5,0.1]);

  // === 屋根 ===
  box(v, -1,8,-2, 22,1,10, CR);
  // 屋根上のパンタグラフ台座
  box(v, 8,9,1, 4,1,4, MT);
  // パンタグラフ（集電装置）
  v.push([9,10,2.5,MT,0.5,3,0.5]);
  v.push([11,10,2.5,MT,0.5,3,0.5]);
  // パンタグラフ横棒
  v.push([8.5,12,2.5,MT,3,0.3,0.3]);
  // パンタグラフ上の集電板
  v.push([8,13,2,MT,4,0.3,2]);

  // === 行先表示板（前面上部） ===
  v.push([-0.2,7,1.5,BK,0.2,1,3]);
  v.push([-0.15,7.2,2,WH,0.15,0.6,2]); // 文字エリア（白）

  // === 車番プレート ===
  v.push([-0.2,2,2,WH,0.2,1,2]);

  // === 内部（座席） ===
  // 左側座席列
  for(let x=1;x<9;x+=2) v.push([x,2,0,OR,1,1,1]);
  for(let x=12;x<19;x+=2) v.push([x,2,0,OR,1,1,1]);
  // 右側座席列
  for(let x=1;x<9;x+=2) v.push([x,2,5,OR,1,1,1]);
  for(let x=12;x<19;x+=2) v.push([x,2,5,OR,1,1,1]);
  // 吊り革バー
  v.push([1,7,2.5,MT,18,0.3,0.3]);

  // === 線路 ===
  for(let x=-5;x<28;x++){
    v.push([x,-0.5,-1,MT,1,0.5,0.5]);
    v.push([x,-0.5,6,MT,1,0.5,0.5]);
  }
  // 枕木
  for(let x=-5;x<28;x+=2){
    v.push([x,-0.5,-2,WH,1,0.3,10]);
  }

  return v;
}

scene.add(bm(buildTram()));
scene.add(new THREE.GridHelper(60,30,0xccbb99,0xddccaa));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script></body></html>
