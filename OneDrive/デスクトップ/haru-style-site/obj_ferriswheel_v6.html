<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>観覧車 v6</title>
<style>*{margin:0;padding:0}body{background:#f0e2bb;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:13px sans-serif;color:#422612;background:rgba(255,255,255,0.8);padding:8px 14px;border-radius:8px}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">観覧車 v6 — 滑らかな円リム（0.5ボクセル）</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0e2bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,500);
camera.position.set(50,25,50);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,20,0);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(30,50,20);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

const F=0xd4a020,FD=0xb88a18,WH=0xe8e4d8,HB=0x707070;
const BP=0xa09888,BG=0x706860,LT=0xf8f0a0,SP=0x999999;
const GC=[0xe05040,0x4090d0,0x50a850,0xf0c030,0xe07030,0xd050a0,0x6060c0,0x40b0a0];

const RIM_R=10;     // larger rim for smoother circle
const GOND_R=17;    // gondolas outside rim
const HUB_Y=GOND_R+10; // higher to prevent ground clipping
const NGON=8;
const S=0.5;        // fine voxel size for rim

// ============================================================
// STATIC
// ============================================================
const vs=[];

// A-frame supports
for(const zz of[-2,2]){
  for(let y=0;y<=HUB_Y;y++){
    const t=y/HUB_Y;
    const lx=-7*(1-t); vs.push([lx,y,zz,F]);vs.push([lx+1,y,zz,F]);
    const rx=7*(1-t); vs.push([rx,y,zz,F]);vs.push([rx-1,y,zz,F]);
  }
  for(const y of[6,14]){
    const t=y/HUB_Y;const l=Math.floor(-7*(1-t)),r=Math.ceil(7*(1-t));
    for(let x=l;x<=r;x++) vs.push([x,y,zz,FD]);
  }
}
for(let y=0;y<=HUB_Y;y+=4) for(let z=-2;z<=2;z++) vs.push([0,y,z,FD,0.5,0.5,0.5]);

// Hub
for(let dx=-2;dx<=2;dx++) for(let dy=-2;dy<=2;dy++){
  if(dx*dx+dy*dy<=5) for(let z=-2;z<=2;z++) vs.push([dx,HUB_Y+dy,z,HB]);
}

// Base
for(let x=-9;x<=9;x++) for(let z=-4;z<=4;z++) vs.push([x,0,z,BP]);
for(let x=-8;x<=8;x++) for(let z=-3;z<=3;z++) vs.push([x,-1,z,BG]);
for(let x=-9;x<=9;x+=2){vs.push([x,1,-4,FD,0.3,1.5,0.3]);vs.push([x,1,4,FD,0.3,1.5,0.3]);}
for(let x=-9;x<=9;x++){vs.push([x,2,-4,FD,1,0.2,0.2]);vs.push([x,2,4,FD,1,0.2,0.2]);}

// Ticket booth
for(let x=0;x<3;x++) for(let y=1;y<=3;y++) for(let z=-1;z<=1;z++) vs.push([9+x,y,z,0xf0e8d0]);
for(let x=-0.5;x<3.5;x++) for(let z=-1.5;z<=1.5;z++) vs.push([9+x,4,z,0xc85030,1,0.5,1]);
vs.push([8.9,2,0,0xa0d8e8,0.1,1.5,1.5]);

scene.add(bm(vs));

// ============================================================
// WHEEL
// ============================================================
const vw=[];

// Inner white rim — 0.5 size voxels for smooth circle
// Two concentric rings (inner and outer edge) for thickness
{const set=new Set();
for(const r of[RIM_R-0.5, RIM_R, RIM_R+0.5]){
  for(let i=0;i<200;i++){
    const a=(i/200)*Math.PI*2;
    // Snap to 0.5 grid
    const rx=Math.round(Math.cos(a)*r/S)*S;
    const ry=Math.round(Math.sin(a)*r/S)*S;
    const k=rx+','+ry;if(set.has(k))continue;set.add(k);
    for(let z=-2;z<=2;z++) vw.push([rx,ry,z,WH,S,S,S]);
  }
}}

// 8 straight beams — hub to gondola
for(let g=0;g<NGON;g++){
  const a=(g/NGON)*Math.PI*2;
  const cos=Math.cos(a),sin=Math.sin(a);
  for(let r=3;r<=GOND_R;r+=1){
    vw.push([cos*r,sin*r,-1,F]);
    vw.push([cos*r,sin*r, 0,F]);
    vw.push([cos*r,sin*r, 1,F]);
  }
}

// Lights at tips
for(let g=0;g<NGON;g++){
  const a=(g/NGON)*Math.PI*2;
  vw.push([Math.cos(a)*(GOND_R+1),Math.sin(a)*(GOND_R+1),-2,LT,0.5,0.5,0.5]);
  vw.push([Math.cos(a)*(GOND_R+1),Math.sin(a)*(GOND_R+1), 2,LT,0.5,0.5,0.5]);
}

const wheelMesh=bm(vw);
const wheelGroup=new THREE.Group();
wheelGroup.position.set(0,HUB_Y,0);
wheelGroup.add(wheelMesh);
scene.add(wheelGroup);

// ============================================================
// GONDOLAS
// ============================================================
const gondolaGroups=[];
for(let g=0;g<NGON;g++){
  const a=(g/NGON)*Math.PI*2;
  const gx=Math.cos(a)*GOND_R,gy=Math.sin(a)*GOND_R;
  const gc=GC[g];const gv=[];

  // Hanging bars
  for(let t=0;t<3;t++){
    gv.push([-0.3,-t,0,SP,0.3,1,0.3]);
    gv.push([ 0.3,-t,0,SP,0.3,1,0.3]);
  }

  const cx=-2,cy=-6,cz=-1.5;

  // Floor (4x3)
  for(let x=0;x<4;x++) for(let z=0;z<3;z++) gv.push([cx+x,cy,cz+z,gc]);

  // 4 corner pillars
  for(let y=1;y<=3;y++){
    gv.push([cx,cy+y,cz,gc]);gv.push([cx+3,cy+y,cz,gc]);
    gv.push([cx,cy+y,cz+2,gc]);gv.push([cx+3,cy+y,cz+2,gc]);
  }

  // Top/bottom rails
  for(let x=0;x<4;x++){gv.push([cx+x,cy+3,cz,gc]);gv.push([cx+x,cy+3,cz+2,gc]);gv.push([cx+x,cy+1,cz,gc]);gv.push([cx+x,cy+1,cz+2,gc]);}
  for(let z=0;z<3;z++){gv.push([cx,cy+3,cz+z,gc]);gv.push([cx+3,cy+3,cz+z,gc]);}

  // Glass (front + sides)
  for(let x=1;x<3;x++) for(let y=2;y<=2;y++) gv.push([cx+x,cy+y,cz-0.1,0xa0dce8,1,1,0.1]);
  for(let y=2;y<=2;y++){
    gv.push([cx-0.1,cy+y,cz+1,0xa0dce8,0.1,1,1]);
    gv.push([cx+3.1,cy+y,cz+1,0xa0dce8,0.1,1,1]);
  }

  // Back wall
  for(let x=1;x<3;x++) for(let y=2;y<=2;y++) gv.push([cx+x,cy+y,cz+2,gc]);

  // Roof
  for(let x=-0.5;x<4.5;x++) for(let z=-0.5;z<3.5;z++) gv.push([cx+x,cy+4,cz+z,gc,1,0.4,1]);
  for(let x=0;x<4;x++) gv.push([cx+x,cy+4.4,cz+1,0xffffff,1,0.3,1]);

  const gm=bm(gv);
  const gg=new THREE.Group();
  gg.position.set(gx,gy,0);
  gg.add(gm);
  wheelGroup.add(gg);
  gondolaGroups.push(gg);
}

scene.add(new THREE.GridHelper(60,30,0xccbb99,0xddccaa));
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const SPEED=(Math.PI*2)/29;
function animate(time){
  requestAnimationFrame(animate);
  const angle=time*0.001*SPEED;
  wheelGroup.rotation.z=angle;
  for(const g of gondolaGroups) g.rotation.z=-angle;
  controls.update();renderer.render(scene,camera);
}
animate(0);
</script></body></html>
