<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>キャラ1体テスト v3 — 前後区別</title>
<style>*{margin:0;padding:0}body{background:#e8e0d0;overflow:hidden}canvas{display:block}
.info{position:fixed;top:16px;left:16px;font:14px sans-serif;color:#422612;background:rgba(255,255,255,0.9);padding:10px 16px;border-radius:8px;z-index:10}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head><body>
<div class="info">キャラ v3 — 前面=顔 / 背面=後頭部<br>Drag:回転 / Scroll:ズーム</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8e0d0);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200);
camera.position.set(5,8,-10);
const renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,1.5,0);

scene.add(new THREE.AmbientLight(0xffffff,1.5));
const sun=new THREE.DirectionalLight(0xfff5e0,2);sun.position.set(10,20,-10);scene.add(sun);

const floorGeo=new THREE.PlaneGeometry(20,20);floorGeo.rotateX(-Math.PI/2);
scene.add(new THREE.Mesh(floorGeo,new THREE.MeshLambertMaterial({color:0xc8c0b0})));
scene.add(new THREE.GridHelper(20,20,0x888888,0xcccccc));

function bm(data){
  const pos=[],nrm=[],col=[];const c=new THREE.Color();
  const b=new THREE.BoxGeometry(1,1,1),bp=b.attributes.position,bn=b.attributes.normal,bi=b.index;
  for(const[x,y,z,cc,sx=1,sy=1,sz=1]of data){c.set(cc);
    for(let i=0;i<bi.count;i++){const vi=bi.getX(i);
      pos.push(bp.getX(vi)*sx+x,bp.getY(vi)*sy+y,bp.getZ(vi)*sz+z);
      nrm.push(bn.getX(vi),bn.getY(vi),bn.getZ(vi));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.castShadow=true;m.receiveShadow=true;return m;
}

// ★★★ v3: 前面=顔、中間=肌、背面=後頭部（髪） ★★★
function buildCharacter(opts={}){
  const v=[];
  const D = 7; // z=0(前)〜z=6(後)
  const SK = opts.skin||0xf0c8a0, SD=0xe0b890, E=0x202020;
  const PKL=0xf8c0d0;
  const hc=opts.hair||0x3a2a1a, sc=opts.shirt||0xf0f0e8, pc=opts.pants||0x2a3a6a, sh=opts.shoe||0x3a3a3a;

  // ヘルパー: z=0〜D-1を同じ色で埋める
  function fill(x,y,c){ for(let z=0;z<D;z++) v.push([x,y,z,c]); }
  // 前面のみ（z=0）
  function front(x,y,c){ v.push([x,y,0,c]); }
  // 中間（z=1〜D-2）
  function mid(x,y,c){ for(let z=1;z<D-1;z++) v.push([x,y,z,c]); }
  // 背面のみ（z=D-1）
  function back(x,y,c){ v.push([x,y,D-1,c]); }
  // 前面=c1, 中間=c2, 背面=c3
  function fmb(x,y,c1,c2,c3){ front(x,y,c1); mid(x,y,c2); back(x,y,c3); }

  // ============ 髪（頭頂）============
  // y=13: 全部髪色
  for(let x=1;x<=7;x++) fill(x,13,hc);
  // y=12: 全部髪色
  for(let x=0;x<=8;x++) fill(x,12,hc);

  // ============ 顔（y=8〜11）============
  // y=11: 前=肌、側面=髪、後=髪
  fmb(0,11, hc,hc,hc);
  for(let x=1;x<=7;x++) fmb(x,11, SK,SK,hc);
  fmb(8,11, hc,hc,hc);

  // y=10: 前=目、中=肌、後=髪
  fmb(0,10, hc,hc,hc);
  fmb(1,10, SK,SK,hc);
  fmb(2,10, E,SK,hc);  // 左目
  fmb(3,10, SK,SK,hc);
  fmb(4,10, SK,SK,hc);
  fmb(5,10, SK,SK,hc);
  fmb(6,10, E,SK,hc);  // 右目
  fmb(7,10, SK,SK,hc);
  fmb(8,10, hc,hc,hc);

  // y=9: 前=ほっぺ、中=肌、後=髪
  for(let x=1;x<=7;x++) fmb(x,9, SK,SK,hc);
  fmb(2,9, PKL,SK,hc);  // 左ほっぺ
  fmb(6,9, PKL,SK,hc);  // 右ほっぺ

  // y=8: 前=口、中=肌、後=髪
  for(let x=1;x<=7;x++) fmb(x,8, SK,SK,hc);
  fmb(3,8, SD,SK,hc);  // 口
  fmb(4,8, SD,SK,hc);
  fmb(5,8, SD,SK,hc);

  // ============ 首 ============
  fmb(3,7, SK,SK,SK); fmb(4,7, SK,SK,SK); fmb(5,7, SK,SK,SK);

  // ============ 体 ============
  for(let x=0;x<=8;x++) fill(x,6,sc);
  for(let x=0;x<=8;x++) fill(x,5,sc);
  // y=4: 手=肌、体=シャツ
  fmb(0,4, SK,SK,SK); for(let x=1;x<=7;x++) fill(x,4,sc); fmb(8,4, SK,SK,SK);
  // y=3: 体
  for(let x=1;x<=7;x++) fill(x,3,sc);

  // ============ 下半身 ============
  if(opts.skirt){
    const skC=opts.skirtC||pc;
    for(let x=1;x<=7;x++) fill(x,2,skC);
    for(let x=0;x<=8;x++) fill(x,1,skC);
    fill(2,0,sh); fill(3,0,sh); fill(5,0,sh); fill(6,0,sh);
  } else {
    fill(2,2,pc); fill(3,2,pc); fill(5,2,pc); fill(6,2,pc);
    fill(2,1,pc); fill(3,1,pc); fill(5,1,pc); fill(6,1,pc);
    fill(1,0,sh); fill(2,0,sh); fill(3,0,sh); fill(5,0,sh); fill(6,0,sh); fill(7,0,sh);
  }

  // ============ アクセサリ ============

  // 帽子
  if(opts.hat){
    const hatC=opts.hatC||0xe05040;
    for(let x=0;x<=8;x++) fill(x,14,hatC);
    for(let x=1;x<=7;x++) fill(x,15,hatC);
  }

  // ロングヘア
  if(opts.longHair){
    // サイドの垂れ髪（体に接触、x=-1とx=9）
    for(let y=6;y<=11;y++) for(let z=1;z<D-1;z++){v.push([-1,y,z,hc]); v.push([9,y,z,hc]);}
    // 背面が長く垂れる（z=D, 本体z=D-1に接触）
    for(let x=1;x<=7;x++) for(let y=3;y<=11;y++) v.push([x,y,D,hc]);
  }

  // ポニーテール（背面から伸びる）
  if(opts.ponytail){
    for(let y=10;y<=13;y++) v.push([4,y,D,hc]);
    v.push([4,12,D+1,hc]); v.push([4,11,D+1,hc]); v.push([4,10,D+2,hc]);
  }

  // リュック（背面に接触）
  if(opts.bag){
    const bagC=opts.bagC||0x8a6040;
    for(let x=3;x<=5;x++) for(let y=4;y<=6;y++){v.push([x,y,D,bagC]); v.push([x,y,D+1,bagC]);}
    v.push([3,7,D-1,0x555555]); v.push([5,7,D-1,0x555555]); // ストラップ
  }

  return v;
}

// テスト1: フル装備（帽子+メガネ+リュック）
const test1 = bm(buildCharacter({
  shirt:0xe05040, pants:0x2a3a6a, hair:0xd4a040,
  hat:true, hatC:0x306898, bag:true, bagC:0x4090c8
}));
test1.scale.set(0.22,0.22,0.22);
test1.position.set(0,0.01,0);
scene.add(test1);

// テスト2: ロングヘア+スカート+ポニテ
const test2 = bm(buildCharacter({
  shirt:0xf0a0b0, pants:0xf0a0b0, hair:0x6a4a2a,
  longHair:true, ponytail:true, skirt:true, skirtC:0x2a3a6a
}));
test2.scale.set(0.22,0.22,0.22);
test2.position.set(3,0.01,0);
scene.add(test2);

// テスト3: シンプル（アクセサリなし）
const test3 = bm(buildCharacter({
  shirt:0x4090c8, pants:0x404040, hair:0x1a1a1a
}));
test3.scale.set(0.22,0.22,0.22);
test3.position.set(-3,0.01,0);
scene.add(test3);

// テスト4: 白衣+メガネ（医師）
const test4 = bm(buildCharacter({
  shirt:0xf0f0e8, pants:0x2a3a6a, hair:0xa0a0a0
}));
test4.scale.set(0.22,0.22,0.22);
test4.position.set(-6,0.01,0);
scene.add(test4);

// テスト5: 帽子のみ
const test5 = bm(buildCharacter({
  shirt:0x50a050, pants:0x404040, hair:0xf0d848, hat:true, hatC:0xe05040
}));
test5.scale.set(0.22,0.22,0.22);
test5.position.set(6,0.01,0);
scene.add(test5);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
