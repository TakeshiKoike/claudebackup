<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビジュアルノベル ビューア</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-color: #2d5a27;
            --secondary-color: #4a7c43;
            --accent-color: #8bc34a;
            --bg-dark: #1a1a2e;
            --bg-light: #f5f5f5;
            --text-dark: #333;
            --text-light: #fff;
        }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* タイトル画面 */
        #titleScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5));
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            color: white;
            text-align: center;
        }

        #titleScreen h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #titleScreen h2 {
            font-size: 1.3em;
            font-weight: normal;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .title-info {
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .title-info p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* JSON読み込みUI */
        .json-loader {
            background: rgba(255,255,255,0.15);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .json-loader label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95em;
            opacity: 0.9;
        }
        .json-loader input[type="file"] {
            display: none;
        }
        .json-loader .file-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .json-loader .file-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.6);
        }
        .json-loader .file-name {
            margin-top: 10px;
            font-size: 0.85em;
            opacity: 0.7;
        }

        #startButton {
            padding: 20px 60px;
            font-size: 1.4em;
            background: linear-gradient(135deg, #fff, #e8e8e8);
            color: var(--primary-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        #startButton:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        #startButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* MAP画面 */
        #mapScreen, #hospitalMapScreen, #homeMapScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 2000;
            display: none;
        }

        .map-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }

        .map-wrapper img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .location-marker {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .location-marker:hover {
            transform: translate(-50%, -100%) scale(1.15);
        }

        .marker-icon {
            width: 100%;
            height: 100%;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .marker-icon span {
            transform: rotate(45deg);
            font-size: 28px;
        }

        .marker-icon.home { background: #3498db; }
        .marker-icon.hospital { background: #e74c3c; }
        .marker-icon.pharmacy { background: #2ecc71; }
        .marker-icon.clinic { background: #9b59b6; }
        .marker-icon.nursing { background: #e91e63; }

        .marker-label {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            font-weight: bold;
        }

        .location-marker.next-destination .marker-icon {
            animation: pulse-marker 1.5s infinite;
        }

        .location-marker.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .location-marker.disabled .marker-icon {
            filter: grayscale(100%);
        }

        .location-marker.completed .marker-icon {
            opacity: 0.6;
        }

        .location-marker.completed::after {
            content: "\2713";
            position: absolute;
            top: -10px;
            right: -10px;
            background: #4CAF50;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes pulse-marker {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8); }
            50% { box-shadow: 0 0 25px 15px rgba(255, 215, 0, 0.3); }
        }

        .location-marker.next-destination::after {
            content: "\25BC 次へ";
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #333;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            animation: bounce-arrow 1s infinite;
        }

        @keyframes bounce-arrow {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(5px); }
        }

        .location-marker.visited .marker-icon {
            opacity: 0.5;
        }

        .location-marker.current .marker-icon {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .map-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
        }

        .map-header h3 { font-size: 1.2em; margin-bottom: 5px; }
        .map-header p { font-size: 0.9em; opacity: 0.9; }

        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .map-legend h4 { margin-bottom: 10px; color: #333; font-size: 0.95em; }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            font-size: 0.85em;
            color: #666;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        /* メインゲーム画面 */
        #gameScreen {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #backgroundLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #2d2d44;
            transition: background-image 0.5s ease;
        }

        #characterLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 220px;
            pointer-events: none;
        }

        .character-slot {
            position: absolute;
            bottom: 220px;
            max-width: 300px;
            max-height: 400px;
            transition: all 0.3s ease;
        }

        .character-slot.left { left: 10%; }
        .character-slot.center { left: 50%; transform: translateX(-50%); }
        .character-slot.right { right: 10%; }

        .character-slot img,
        .character-slot video {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            border-radius: 10px;
        }

        .character-slot video {
            background: transparent;
        }

        #dialogBox {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.85));
            padding: 20px 30px;
            min-height: 200px;
        }

        #speakerName {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1em;
        }

        #speakerName.narrator { background: #6b8e23; }
        #speakerName.thought { background: #4682b4; font-style: italic; }

        #dialogText {
            color: white;
            font-size: 1.15em;
            line-height: 1.8;
            min-height: 80px;
        }

        #dialogText.thought {
            font-style: italic;
            color: #b0c4de;
        }

        #navButtons {
            position: absolute;
            bottom: 15px;
            right: 30px;
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .nav-btn.prev { background: #666; color: white; }
        .nav-btn.next { background: var(--accent-color); color: var(--text-dark); }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #progressBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(255,255,255,0.2);
        }

        #progressFill {
            height: 100%;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        #sceneHeader {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .back-to-map {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .back-to-map:hover { background: rgba(0,0,0,0.9); }

        #audioControls {
            position: fixed;
            bottom: 220px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1500;
        }

        .audio-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .audio-btn:hover { background: rgba(0,0,0,0.9); }
        .audio-btn.off { background: #c62828; }

        #navControlPanel {
            position: fixed;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 3500;
        }

        .nav-control-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .nav-control-btn:hover { background: rgba(0,0,0,0.9); }

        /* シーン選択パネル */
        #sceneSelectPanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .scene-select-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .scene-select-content h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .scene-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scene-item:hover { background: #e0e0e0; }
        .scene-item.completed { background: #e8f5e9; }
        .scene-item.current { background: #fff3e0; border: 2px solid #ff9800; }
        .scene-item.locked { opacity: 0.5; pointer-events: none; }

        .scene-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }

        .scene-item.completed .scene-number { background: #4CAF50; }
        .scene-item.locked .scene-number { background: #9e9e9e; }
        .scene-title { flex: 1; font-weight: 500; }

        .scene-close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
        }

        /* 知識解説パネル */
        #knowledgePanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2500;
            padding: 20px;
        }

        .knowledge-content {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .knowledge-header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .knowledge-header h3 { font-size: 1.3em; }

        .knowledge-body {
            padding: 25px;
            line-height: 1.8;
            color: var(--text-dark);
            white-space: pre-line;
        }

        .knowledge-close {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--secondary-color);
            color: white;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 0 0 20px 20px;
        }

        .knowledge-close:hover { background: var(--primary-color); }

        /* クイズパネル */
        #quizPanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2500;
            padding: 20px;
        }

        .quiz-content {
            background: white;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .quiz-header {
            background: #ff9800;
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
        }

        .quiz-header h3 {
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-question {
            padding: 20px;
            font-size: 1.1em;
            line-height: 1.6;
            color: var(--text-dark);
            border-bottom: 1px solid #eee;
        }

        .quiz-options { padding: 15px; }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover:not(.disabled) {
            border-color: #ff9800;
            background: #fff3e0;
        }

        .quiz-option.selected {
            border-color: #2196f3;
            background: #e3f2fd;
        }

        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .quiz-option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .quiz-option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .quiz-feedback {
            display: none;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .quiz-feedback.show { display: block; }

        .quiz-feedback.correct {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }

        .quiz-feedback.incorrect {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }

        .quiz-submit {
            display: block;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 15px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-submit:hover:not(:disabled) { background: #f57c00; }
        .quiz-submit:disabled { background: #ccc; cursor: not-allowed; }

        .quiz-continue {
            display: none;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-continue:hover { background: var(--secondary-color); }

        /* レスポンシブ */
        @media (max-width: 768px) {
            #titleScreen h1 { font-size: 1.8em; }
            #titleScreen h2 { font-size: 1.1em; }
            .title-info { padding: 15px 20px; }
            #startButton { padding: 15px 40px; font-size: 1.2em; }

            .location-marker { width: 50px; height: 50px; }
            .marker-icon span { font-size: 22px; }

            .character-slot { max-width: 180px; max-height: 250px; }
            .character-slot img { max-height: 250px; }
            .character-slot.left { left: 5%; }
            .character-slot.right { right: 5%; }

            #dialogBox { padding: 15px 20px; min-height: 180px; }
            #dialogText { font-size: 1em; }
            #navButtons { right: 20px; gap: 10px; }
            .nav-btn { padding: 10px 20px; font-size: 0.9em; }

            #characterLayer { padding-bottom: 190px; }
            .character-slot { bottom: 190px; }
            #audioControls { bottom: 190px; }

            .map-legend { display: none; }
        }
    </style>
</head>
<body>
    <!-- タイトル画面 -->
    <div id="titleScreen">
        <h1 id="titleH1">ビジュアルノベル ビューア</h1>
        <h2 id="titleH2">シナリオJSONを読み込んでください</h2>
        <div class="title-info" id="titleInfo">
            <p>JSONファイルを選択して学習を開始してください</p>
        </div>
        <div class="json-loader">
            <label>シナリオJSONファイルを選択</label>
            <label class="file-btn" for="jsonFileInput">JSONファイルを開く</label>
            <input type="file" id="jsonFileInput" accept=".json">
            <div class="file-name" id="jsonFileName"></div>
        </div>
        <button id="startButton" disabled>学習を開始する</button>
    </div>

    <!-- MAP画面（動的生成） -->
    <div id="mapScreen">
        <div class="map-header">
            <h3 id="mapTitle">MAPで場所を選んでください</h3>
            <p id="mapInstruction">光っているマーカーをクリック</p>
        </div>
        <div class="map-container">
            <div class="map-wrapper" id="mapWrapper">
                <img src="" alt="街並みMAP" id="mapImage">
            </div>
        </div>
    </div>

    <!-- 病院MAP画面（動的生成） -->
    <div id="hospitalMapScreen" style="display: none;">
        <div class="map-header">
            <h3 id="hospitalMapTitle">病院内MAP</h3>
            <p id="hospitalMapInstruction">場所をクリックしてください</p>
        </div>
        <button class="back-to-map" id="backToTownFromHospital" style="position: absolute; top: 80px; left: 20px; z-index: 100;">&larr; 街並みMAP</button>
        <div class="map-container">
            <div class="map-wrapper" id="hospitalMapWrapper">
                <img src="" alt="病院内MAP" id="hospitalMapImage">
            </div>
        </div>
    </div>

    <!-- 自宅MAP画面（動的生成） -->
    <div id="homeMapScreen" style="display: none;">
        <div class="map-header">
            <h3 id="homeMapTitle">自宅内MAP</h3>
            <p id="homeMapInstruction">場所をクリックしてください</p>
        </div>
        <button class="back-to-map" id="backToTownFromHome" style="position: absolute; top: 80px; left: 20px; z-index: 100;">&larr; 街並みMAP</button>
        <div class="map-container">
            <div class="map-wrapper" id="homeMapWrapper">
                <img src="" alt="自宅内MAP" id="homeMapImage">
            </div>
        </div>
    </div>

    <!-- メインゲーム画面 -->
    <div id="gameScreen">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="backgroundLayer"></div>
        <div id="characterLayer">
            <div class="character-slot left" id="charLeft"></div>
            <div class="character-slot center" id="charCenter"></div>
            <div class="character-slot right" id="charRight"></div>
        </div>
        <div id="sceneHeader"></div>
        <button class="back-to-map" id="backToMap">&larr; MAP</button>
        <div id="dialogBox">
            <div id="speakerName"></div>
            <div id="dialogText"></div>
            <div id="navButtons">
                <button class="nav-btn prev" id="prevBtn">&larr; 戻る</button>
                <button class="nav-btn next" id="nextBtn">次へ &rarr;</button>
            </div>
        </div>
        <div id="audioControls">
            <button class="audio-btn" id="bgmToggle">BGM ON</button>
            <button class="audio-btn" id="voiceToggle">音声 ON</button>
        </div>
    </div>

    <!-- 知識解説パネル -->
    <div id="knowledgePanel">
        <div class="knowledge-content">
            <div class="knowledge-header">
                <span>&#x1F4DA;</span>
                <h3 id="knowledgeTitle"></h3>
            </div>
            <div class="knowledge-body" id="knowledgeText"></div>
            <button class="knowledge-close" id="knowledgeClose">理解しました</button>
        </div>
    </div>

    <!-- クイズパネル -->
    <div id="quizPanel">
        <div class="quiz-content">
            <div class="quiz-header">
                <h3><span>&#x2753;</span> 確認クイズ</h3>
            </div>
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
            <button class="quiz-submit" id="quizSubmit">回答する</button>
            <button class="quiz-continue" id="quizContinue">次へ進む</button>
        </div>
    </div>

    <!-- ナビゲーションコントロール -->
    <div id="navControlPanel">
        <button class="nav-control-btn" id="restartBtn">&#x1F504; 最初から</button>
        <button class="nav-control-btn" id="sceneSelectBtn">&#x1F4CB; シーン選択</button>
    </div>

    <!-- シーン選択パネル -->
    <div id="sceneSelectPanel">
        <div class="scene-select-content">
            <h3>&#x1F4CB; シーン選択</h3>
            <div class="scene-list" id="sceneList"></div>
            <button class="scene-close-btn" id="sceneSelectClose">閉じる</button>
        </div>
    </div>

    <script>
    // ========== VN: JSON駆動のビジュアルノベルエンジン ==========
    const VN = {
        scenes: [],
        characters: {},
        speakerNames: {},
        backgrounds: {},
        bgmFiles: {},
        videoFiles: {},
        expressionGuide: {},
        sceneLocationMap: {},
        sceneRoomMap: {},
        sceneFlow: [],
        maps: {},
        meta: {}
    };

    // ゲーム状態
    let currentSceneIndex = 0;
    let currentCutIndex = 0;
    let bgmEnabled = true;
    let voiceEnabled = true;
    let currentBgm = null;
    let currentVoice = null;
    let visitedLocations = new Set();
    let waitingForMapSelection = false;
    let completedScenes = new Set();
    let currentCutHasVideo = false;
    let scenarioLoaded = false;

    // JSON読み込み
    function loadScenario(json) {
        // メタ情報
        VN.meta = json.meta || {};

        // キャラクター
        VN.characters = json.characters || {};

        // 話者名
        VN.speakerNames = json.speakerNames || {};

        // 背景
        VN.backgrounds = json.backgrounds || {};

        // BGM
        VN.bgmFiles = json.bgm || {};

        // MAP
        VN.maps = json.maps || {};

        // シーンフロー
        VN.sceneFlow = json.sceneFlow || [];

        // シーン→場所マッピング
        VN.sceneLocationMap = json.sceneLocationMap || {};

        // シーン→部屋マッピング
        VN.sceneRoomMap = json.sceneRoomMap || {};

        // 動画ファイル
        VN.videoFiles = json.videoFiles || {};

        // シーンデータ
        VN.scenes = json.scenes || [];

        // 表情ガイドをcutIdキーのマップに展開
        VN.expressionGuide = {};
        VN.scenes.forEach(scene => {
            scene.cuts.forEach(cut => {
                if (cut.expressions && cut.expressions.length > 0) {
                    VN.expressionGuide[cut.id] = cut.expressions;
                }
            });
        });

        // タイトル画面更新
        document.getElementById('titleH1').textContent = VN.meta.title || 'ビジュアルノベル';
        document.getElementById('titleH2').textContent = VN.meta.subtitle || '';
        if (VN.meta.titleBackground) {
            document.getElementById('titleScreen').style.backgroundImage =
                `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${VN.meta.titleBackground}')`;
        }
        const infoDiv = document.getElementById('titleInfo');
        infoDiv.innerHTML = '';
        if (VN.meta.titleInfo) {
            VN.meta.titleInfo.forEach(line => {
                const p = document.createElement('p');
                p.textContent = line;
                infoDiv.appendChild(p);
            });
        }

        // MAP構築
        buildMapMarkers();

        // 開始ボタン有効化
        document.getElementById('startButton').disabled = false;
        scenarioLoaded = true;
    }

    // MAP マーカーを動的生成
    function buildMapMarkers() {
        // 街並みMAP
        if (VN.maps.town) {
            document.getElementById('mapImage').src = VN.maps.town.image;
            const wrapper = document.getElementById('mapWrapper');
            // 既存マーカー削除
            wrapper.querySelectorAll('.location-marker').forEach(m => m.remove());
            VN.maps.town.markers.forEach(m => {
                wrapper.appendChild(createMarkerElement(m));
            });
        }

        // サブMAP
        if (VN.maps.subMaps) {
            // 病院
            if (VN.maps.subMaps.hospital) {
                const hMap = VN.maps.subMaps.hospital;
                document.getElementById('hospitalMapImage').src = hMap.image;
                if (hMap.title) document.getElementById('hospitalMapTitle').textContent = hMap.title;
                const hWrapper = document.getElementById('hospitalMapWrapper');
                hWrapper.querySelectorAll('.location-marker').forEach(m => m.remove());
                hMap.markers.forEach(m => {
                    const el = createMarkerElement(m);
                    el.classList.add('sub-marker');
                    hWrapper.appendChild(el);
                });
            }
            // 自宅
            if (VN.maps.subMaps.home) {
                const homeMap = VN.maps.subMaps.home;
                document.getElementById('homeMapImage').src = homeMap.image;
                if (homeMap.title) document.getElementById('homeMapTitle').textContent = homeMap.title;
                const homeWrapper = document.getElementById('homeMapWrapper');
                homeWrapper.querySelectorAll('.location-marker').forEach(m => m.remove());
                homeMap.markers.forEach(m => {
                    const el = createMarkerElement(m);
                    el.classList.add('sub-marker');
                    homeWrapper.appendChild(el);
                });
            }
        }

        // イベントバインド
        bindMapEvents();
    }

    function createMarkerElement(markerData) {
        const div = document.createElement('div');
        div.className = 'location-marker';
        div.dataset.location = markerData.id;
        div.style.left = markerData.position.left;
        div.style.top = markerData.position.top;
        div.innerHTML = `
            <div class="marker-icon ${markerData.colorClass}"><span>${markerData.icon}</span></div>
            <div class="marker-label">${markerData.label}</div>
        `;
        return div;
    }

    function bindMapEvents() {
        // 街並みMAPマーカー
        document.querySelectorAll('#mapWrapper .location-marker').forEach(marker => {
            marker.addEventListener('click', () => handleMarkerClick(marker.dataset.location));
        });

        // 病院MAPマーカー
        document.querySelectorAll('#hospitalMapWrapper .location-marker').forEach(marker => {
            marker.addEventListener('click', () => handleSubMapMarkerClick('hospital', marker.dataset.location, marker.dataset.scene));
        });

        // 自宅MAPマーカー
        document.querySelectorAll('#homeMapWrapper .location-marker').forEach(marker => {
            marker.addEventListener('click', () => handleSubMapMarkerClick('home', marker.dataset.location, marker.dataset.scene));
        });
    }

    // 初期化
    function init() {
        document.getElementById('jsonFileInput').addEventListener('change', handleFileSelect);
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('sceneSelectBtn').addEventListener('click', showSceneSelect);
        document.getElementById('sceneSelectClose').addEventListener('click', closeSceneSelect);
        document.getElementById('backToMap').addEventListener('click', showMap);
        document.getElementById('bgmToggle').addEventListener('click', toggleBgm);
        document.getElementById('voiceToggle').addEventListener('click', toggleVoice);
        document.getElementById('knowledgeClose').addEventListener('click', closeKnowledge);
        document.getElementById('quizSubmit').addEventListener('click', submitQuiz);
        document.getElementById('quizContinue').addEventListener('click', closeQuiz);
        document.getElementById('prevBtn').addEventListener('click', prevCut);
        document.getElementById('nextBtn').addEventListener('click', nextCut);
        document.getElementById('backToTownFromHospital').addEventListener('click', backToTownMap);
        document.getElementById('backToTownFromHome').addEventListener('click', backToTownMap);

        // URLパラメータで自動読み込み
        const params = new URLSearchParams(window.location.search);
        const jsonFile = params.get('scenario');
        if (jsonFile) {
            fetch(jsonFile)
                .then(r => r.json())
                .then(json => {
                    loadScenario(json);
                    document.getElementById('jsonFileName').textContent = jsonFile + ' (自動読込)';
                })
                .catch(e => console.error('Auto-load failed:', e));
        }
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('jsonFileName').textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const json = JSON.parse(ev.target.result);
                loadScenario(json);
            } catch(err) {
                alert('JSONファイルの読み込みに失敗しました: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    // ゲーム開始
    function startGame() {
        if (!scenarioLoaded) return;
        document.getElementById('titleScreen').style.display = 'none';
        currentSceneIndex = 0;
        currentCutIndex = 0;
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    // MAP表示
    function showMap() {
        stopVoice();
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';

        const nextLoc = getNextLocation();
        const currentSceneId = VN.scenes[currentSceneIndex].id;

        if (nextLoc === 'home' && [3, 4, 5, 6, 9, 10].includes(currentSceneId)) {
            document.getElementById('homeMapScreen').style.display = 'block';
            updateSubMapMarkers('home');
            return;
        }

        document.getElementById('mapScreen').style.display = 'block';
        waitingForMapSelection = true;
        updateMarkers();

        if (nextLoc) {
            document.getElementById('mapTitle').textContent = '次の場所へ移動';
            document.getElementById('mapInstruction').textContent = '光っているマーカーをクリック';
        } else {
            document.getElementById('mapTitle').textContent = '学習完了！';
            document.getElementById('mapInstruction').textContent = 'お疲れ様でした';
        }
    }

    function getNextLocation() {
        if (currentSceneIndex >= VN.sceneFlow.length - 1) return null;
        return VN.sceneFlow[currentSceneIndex].nextLocation;
    }

    function updateMarkers() {
        const nextLoc = getNextLocation();
        const currentLoc = VN.sceneLocationMap[String(VN.scenes[currentSceneIndex].id)];

        document.querySelectorAll('#mapWrapper .location-marker').forEach(marker => {
            const loc = marker.dataset.location;
            marker.classList.remove('next-destination', 'current', 'visited', 'disabled');
            marker.style.cursor = 'default';

            if (loc === currentLoc) {
                marker.classList.add('current');
                visitedLocations.add(loc);
            }

            if (visitedLocations.has(loc)) {
                marker.classList.add('visited');
            }

            if (waitingForMapSelection && loc === nextLoc) {
                marker.classList.add('next-destination');
                marker.style.cursor = 'pointer';
            } else if (waitingForMapSelection) {
                marker.classList.add('disabled');
            }
        });
    }

    function handleMarkerClick(location) {
        if (!waitingForMapSelection) return;
        const marker = document.querySelector(`#mapWrapper [data-location="${location}"]`);
        if (marker && marker.classList.contains('disabled')) return;

        const nextLoc = getNextLocation();
        if (location !== nextLoc) return;

        if (location === 'hospital') { showHospitalMap(); return; }
        if (location === 'home') { showHomeMap(); return; }

        waitingForMapSelection = false;
        visitedLocations.add(location);
        currentSceneIndex++;
        currentCutIndex = 0;
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    function showHospitalMap() {
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'block';
        updateSubMapMarkers('hospital');
    }

    function showHomeMap() {
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'block';
        updateSubMapMarkers('home');
    }

    function backToTownMap() {
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('mapScreen').style.display = 'block';
    }

    function updateSubMapMarkers(mapType) {
        const mapId = mapType === 'hospital' ? 'hospitalMapScreen' : 'homeMapScreen';
        const nextSceneIndex = currentSceneIndex + 1;

        if (nextSceneIndex >= VN.scenes.length) {
            document.querySelectorAll(`#${mapId} .location-marker`).forEach(marker => {
                marker.classList.add('disabled');
                marker.classList.remove('next-destination');
                marker.style.cursor = 'default';
            });
            return;
        }

        const nextSceneId = VN.scenes[nextSceneIndex].id;
        const requiredRoom = VN.sceneRoomMap[String(nextSceneId)];

        document.querySelectorAll(`#${mapId} .location-marker`).forEach(marker => {
            const markerLocation = marker.dataset.location;
            marker.classList.remove('next-destination', 'disabled', 'completed');

            if (markerLocation === requiredRoom) {
                marker.classList.add('next-destination');
                marker.style.cursor = 'pointer';
                marker.dataset.scene = nextSceneId;
            } else {
                marker.classList.add('disabled');
                marker.style.cursor = 'default';
            }
        });
    }

    function handleSubMapMarkerClick(mapType, location, sceneId) {
        if (!sceneId) return;
        const mapId = mapType === 'hospital' ? 'hospitalMapScreen' : 'homeMapScreen';
        const marker = document.querySelector(`#${mapId} [data-location="${location}"]`);
        if (marker && marker.classList.contains('disabled')) return;

        waitingForMapSelection = false;
        visitedLocations.add(mapType);

        const targetSceneIndex = VN.scenes.findIndex(s => s.id === parseInt(sceneId));
        if (targetSceneIndex === -1) return;

        currentSceneIndex = targetSceneIndex;
        currentCutIndex = 0;

        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    // シーン描画
    function renderScene() {
        const scene = VN.scenes[currentSceneIndex];
        const cut = scene.cuts[currentCutIndex];

        // 背景
        const bgLayer = document.getElementById('backgroundLayer');
        if (scene.background && VN.backgrounds[scene.background]) {
            bgLayer.style.backgroundImage = `url('${VN.backgrounds[scene.background]}')`;
        } else {
            bgLayer.style.backgroundImage = 'none';
            bgLayer.style.background = 'linear-gradient(135deg, #2d5a27 0%, #1e3a1a 100%)';
        }

        // BGM
        if (bgmEnabled && scene.bgm) {
            playBgm(scene.bgm);
        }

        // キャラクター
        renderCharacters(cut.id);

        // 音声
        if (voiceEnabled && cut.id && !currentCutHasVideo) {
            playVoice(cut.id);
        }

        // セリフ
        const speaker = cut.speaker;
        const speakerEl = document.getElementById('speakerName');
        speakerEl.textContent = VN.speakerNames[speaker] || speaker;
        speakerEl.className = '';
        document.getElementById('dialogText').className = '';

        if (speaker === 'narration') {
            speakerEl.classList.add('narrator');
        } else if (cut.type === 'thought') {
            speakerEl.classList.add('thought');
            document.getElementById('dialogText').classList.add('thought');
        }

        document.getElementById('dialogText').textContent = cut.text;
        document.getElementById('sceneHeader').textContent = `Scene ${scene.id}: ${scene.title} (${currentCutIndex + 1}/${scene.cuts.length})`;

        updateProgress();
        updateNavButtons();
    }

    // キャラクター描画
    function renderCharacters(cutId) {
        document.getElementById('charLeft').innerHTML = '';
        document.getElementById('charCenter').innerHTML = '';
        document.getElementById('charRight').innerHTML = '';
        currentCutHasVideo = false;

        const charData = VN.expressionGuide[cutId];
        if (!charData || charData.length === 0) return;

        charData.forEach(charInfo => {
            const position = charInfo.position || 'center';
            const mediaHtml = getCharacterMedia(charInfo.id, charInfo.expression, cutId);

            if (position === 'left') {
                document.getElementById('charLeft').innerHTML = mediaHtml;
            } else if (position === 'right') {
                document.getElementById('charRight').innerHTML = mediaHtml;
            } else {
                document.getElementById('charCenter').innerHTML = mediaHtml;
            }
        });
    }

    function getCharacterMedia(charId, expression, cutId) {
        const char = VN.characters[charId];
        if (!char) return '';

        const videoKey = `${cutId}_${charId}`;
        if (VN.videoFiles[videoKey]) {
            currentCutHasVideo = true;
            const videoPath = `videos/${videoKey}.mp4`;
            return `<video src="${videoPath}" autoplay playsinline onended="onVideoEnded()" onerror="this.outerHTML=getCharacterImgFallback('${charId}', '${expression}')"></video>`;
        }

        let imgPath;
        if (expression) {
            imgPath = `characters/${char.folder}/${expression}.png`;
        } else {
            imgPath = `characters/${char.folder}/${char.defaultExpression || charId + '_05_neutral'}.png`;
        }
        return `<img src="${imgPath}" alt="${char.name}" onerror="this.style.display='none'">`;
    }

    function getCharacterImgFallback(charId, expression) {
        const char = VN.characters[charId];
        if (!char) return '';
        let imgPath;
        if (expression) {
            imgPath = `characters/${char.folder}/${expression}.png`;
        } else {
            imgPath = `characters/${char.folder}/${char.defaultExpression || charId + '_05_neutral'}.png`;
        }
        return `<img src="${imgPath}" alt="${char.name}" onerror="this.style.display='none'">`;
    }

    function onVideoEnded() {
        console.log('Video ended');
    }

    // BGM
    function playBgm(bgmId) {
        if (!VN.bgmFiles[bgmId]) return;
        if (currentBgm && currentBgm.src.includes(VN.bgmFiles[bgmId])) return;
        stopBgm();
        currentBgm = new Audio(VN.bgmFiles[bgmId]);
        currentBgm.loop = true;
        currentBgm.volume = 0.15;
        currentBgm.play().catch(e => console.log('BGM:', e));
    }

    function stopBgm() {
        if (currentBgm) { currentBgm.pause(); currentBgm = null; }
    }

    function toggleBgm() {
        bgmEnabled = !bgmEnabled;
        const btn = document.getElementById('bgmToggle');
        if (bgmEnabled) {
            btn.textContent = 'BGM ON';
            btn.classList.remove('off');
            const scene = VN.scenes[currentSceneIndex];
            if (scene && scene.bgm) playBgm(scene.bgm);
        } else {
            btn.textContent = 'BGM OFF';
            btn.classList.add('off');
            stopBgm();
        }
    }

    // 音声
    function playVoice(cutId) {
        stopVoice();
        currentVoice = new Audio(`audio/${cutId}.mp3`);
        currentVoice.volume = 0.8;
        currentVoice.play().catch(e => console.log('Voice:', e));
    }

    function stopVoice() {
        if (currentVoice) { currentVoice.pause(); currentVoice = null; }
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        const btn = document.getElementById('voiceToggle');
        if (voiceEnabled) {
            btn.textContent = '音声 ON';
            btn.classList.remove('off');
        } else {
            btn.textContent = '音声 OFF';
            btn.classList.add('off');
            stopVoice();
        }
    }

    // プログレス
    function updateProgress() {
        const scene = VN.scenes[currentSceneIndex];
        const progress = ((currentCutIndex + 1) / scene.cuts.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
    }

    // ナビゲーション
    function updateNavButtons() {
        const scene = VN.scenes[currentSceneIndex];
        document.getElementById('prevBtn').disabled = currentCutIndex === 0 && currentSceneIndex === 0;
        document.getElementById('nextBtn').textContent = currentCutIndex >= scene.cuts.length - 1 ? 'シーン終了' : '次へ \u2192';
    }

    function prevCut() {
        if (currentCutIndex > 0) {
            stopVoice();
            stopCurrentVideo();
            currentCutIndex--;
            renderScene();
        }
    }

    function nextCut() {
        stopVoice();
        stopCurrentVideo();
        const scene = VN.scenes[currentSceneIndex];
        if (currentCutIndex < scene.cuts.length - 1) {
            currentCutIndex++;
            renderScene();
        } else {
            endScene();
        }
    }

    function stopCurrentVideo() {
        document.querySelectorAll('#characterLayer video').forEach(video => {
            video.pause();
            video.currentTime = 0;
        });
    }

    // シーン終了
    function endScene() {
        const scene = VN.scenes[currentSceneIndex];
        completedScenes.add(scene.id);

        if (scene.knowledge) {
            showKnowledge(scene.knowledge);
        } else if (scene.quiz) {
            showQuiz(scene.quiz);
        } else {
            goToNextScene();
        }
    }

    function restartGame() {
        if (!confirm('最初からやり直しますか？')) return;
        stopVoice();
        stopBgm();
        currentSceneIndex = 0;
        currentCutIndex = 0;
        completedScenes.clear();
        visitedLocations.clear();
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('titleScreen').style.display = 'flex';
    }

    function showSceneSelect() {
        const sceneList = document.getElementById('sceneList');
        sceneList.innerHTML = '';

        VN.scenes.forEach((scene, index) => {
            const div = document.createElement('div');
            div.className = 'scene-item';
            if (index === currentSceneIndex) div.classList.add('current');
            else if (completedScenes.has(scene.id)) div.classList.add('completed');

            div.innerHTML = `
                <div class="scene-number">${scene.id}</div>
                <div class="scene-title">${scene.title}</div>
            `;
            div.addEventListener('click', () => goToScene(index));
            sceneList.appendChild(div);
        });

        document.getElementById('sceneSelectPanel').style.display = 'flex';
    }

    function closeSceneSelect() {
        document.getElementById('sceneSelectPanel').style.display = 'none';
    }

    function goToScene(sceneIndex) {
        closeSceneSelect();
        currentSceneIndex = sceneIndex;
        currentCutIndex = 0;
        document.getElementById('titleScreen').style.display = 'none';
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    function goToNextScene() {
        const nextLoc = getNextLocation();
        if (nextLoc) {
            showMap();
        } else if (currentSceneIndex < VN.scenes.length - 1) {
            currentSceneIndex++;
            currentCutIndex = 0;
            renderScene();
        } else {
            alert('学習完了！お疲れ様でした。');
            location.reload();
        }
    }

    // 知識解説
    function showKnowledge(knowledge) {
        document.getElementById('knowledgeTitle').textContent = knowledge.title;
        document.getElementById('knowledgeText').textContent = knowledge.text;
        document.getElementById('knowledgePanel').style.display = 'flex';
    }

    function closeKnowledge() {
        document.getElementById('knowledgePanel').style.display = 'none';
        const scene = VN.scenes[currentSceneIndex];
        if (scene.quiz) {
            showQuiz(scene.quiz);
        } else {
            goToNextScene();
        }
    }

    // クイズ
    let selectedOptions = new Set();
    let quizData = null;

    function showQuiz(quiz) {
        quizData = quiz;
        selectedOptions.clear();
        document.getElementById('quizQuestion').textContent = quiz.question;

        const container = document.getElementById('quizOptions');
        container.innerHTML = '';
        quiz.options.forEach((opt, i) => {
            const el = document.createElement('div');
            el.className = 'quiz-option';
            el.innerHTML = `<span class="option-marker">${String.fromCharCode(65 + i)}</span><span>${opt.text}</span>`;
            el.addEventListener('click', () => selectOption(i, el, quiz.multipleAnswer));
            container.appendChild(el);
        });

        document.getElementById('quizFeedback').className = 'quiz-feedback';
        document.getElementById('quizSubmit').style.display = 'block';
        document.getElementById('quizSubmit').disabled = true;
        document.getElementById('quizContinue').style.display = 'none';
        document.getElementById('quizPanel').style.display = 'flex';
    }

    function selectOption(index, element, multipleAnswer) {
        if (element.classList.contains('disabled')) return;
        if (multipleAnswer) {
            if (selectedOptions.has(index)) {
                selectedOptions.delete(index);
                element.classList.remove('selected');
            } else {
                selectedOptions.add(index);
                element.classList.add('selected');
            }
        } else {
            document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
            selectedOptions.clear();
            selectedOptions.add(index);
            element.classList.add('selected');
        }
        document.getElementById('quizSubmit').disabled = selectedOptions.size === 0;
    }

    function submitQuiz() {
        const options = document.querySelectorAll('.quiz-option');
        let allCorrect = true;
        let correctCount = 0;
        let selectedCorrectCount = 0;

        quizData.options.forEach((opt, i) => {
            options[i].classList.add('disabled');
            if (opt.correct) {
                correctCount++;
                options[i].classList.add('correct');
                if (selectedOptions.has(i)) selectedCorrectCount++;
            } else if (selectedOptions.has(i)) {
                options[i].classList.add('incorrect');
                allCorrect = false;
            }
        });

        if (selectedCorrectCount !== correctCount) allCorrect = false;

        const fb = document.getElementById('quizFeedback');
        fb.className = allCorrect ? 'quiz-feedback show correct' : 'quiz-feedback show incorrect';
        fb.innerHTML = allCorrect ? '<strong>\u2705 正解です！</strong>' : '<strong>\u274C 不正解です</strong><br>正解の選択肢を確認してください。';

        document.getElementById('quizSubmit').style.display = 'none';
        document.getElementById('quizContinue').style.display = 'block';
    }

    function closeQuiz() {
        document.getElementById('quizPanel').style.display = 'none';
        goToNextScene();
    }

    init();
    </script>
</body>
</html>
