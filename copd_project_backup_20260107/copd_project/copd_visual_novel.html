<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在宅療養を支える訪問看護 - COPD事例</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-color: #2d5a27;
            --secondary-color: #4a7c43;
            --accent-color: #8bc34a;
            --bg-dark: #1a1a2e;
            --bg-light: #f5f5f5;
            --text-dark: #333;
            --text-light: #fff;
        }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* タイトル画面 */
        #titleScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d5a27 0%, #1e3a1a 50%, #0d1f0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            color: white;
            text-align: center;
        }

        #titleScreen h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #titleScreen h2 {
            font-size: 1.3em;
            font-weight: normal;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .title-info {
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .title-info p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        #startButton {
            padding: 20px 60px;
            font-size: 1.4em;
            background: linear-gradient(135deg, #fff, #e8e8e8);
            color: var(--primary-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        #startButton:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        /* シーン選択画面 */
        #sceneSelectScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            z-index: 2500;
            display: none;
            overflow-y: auto;
            padding: 20px;
        }

        .scene-select-header {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .scene-select-header h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .scene-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .scene-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .scene-card.completed {
            border: 3px solid var(--accent-color);
        }

        .scene-card-header {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scene-number {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .scene-card-body {
            padding: 15px;
        }

        .scene-card-body p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .back-to-select {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2000;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .back-to-select:hover {
            background: rgba(0,0,0,0.9);
        }

        /* メインゲーム画面 */
        #gameScreen {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* 背景 */
        #backgroundLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #2d2d44;
            transition: background-image 0.5s ease;
        }

        /* キャラクターレイヤー */
        #characterLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 220px;
            pointer-events: none;
        }

        .character-slot {
            position: absolute;
            bottom: 220px;
            max-width: 300px;
            max-height: 400px;
            transition: all 0.3s ease;
        }

        .character-slot.left {
            left: 10%;
        }

        .character-slot.center {
            left: 50%;
            transform: translateX(-50%);
        }

        .character-slot.right {
            right: 10%;
        }

        .character-slot img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            border-radius: 10px;
        }

        /* ダイアログボックス */
        #dialogBox {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.85));
            padding: 20px 30px;
            min-height: 200px;
        }

        #speakerName {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1em;
        }

        #speakerName.narrator {
            background: #6b8e23;
        }

        #speakerName.thought {
            background: #4682b4;
            font-style: italic;
        }

        #dialogText {
            color: white;
            font-size: 1.15em;
            line-height: 1.8;
            min-height: 80px;
        }

        #dialogText.thought {
            font-style: italic;
            color: #b0c4de;
        }

        /* ナビゲーション */
        #navButtons {
            position: absolute;
            bottom: 15px;
            right: 30px;
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .nav-btn.prev {
            background: #666;
            color: white;
        }

        .nav-btn.next {
            background: var(--accent-color);
            color: var(--text-dark);
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* プログレスバー */
        #progressBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(255,255,255,0.2);
        }

        #progressFill {
            height: 100%;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        /* シーンヘッダー */
        #sceneHeader {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9em;
        }

        /* オーディオコントロール */
        #audioControls {
            position: fixed;
            bottom: 220px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1500;
        }

        .audio-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        .audio-btn.off {
            background: #c62828;
        }

        /* 知識解説パネル */
        #knowledgePanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .knowledge-content {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .knowledge-header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .knowledge-header h3 {
            font-size: 1.3em;
        }

        .knowledge-body {
            padding: 25px;
            line-height: 1.8;
            color: var(--text-dark);
            white-space: pre-line;
        }

        .knowledge-close {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--secondary-color);
            color: white;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 0 0 20px 20px;
        }

        .knowledge-close:hover {
            background: var(--primary-color);
        }

        /* クイズパネル */
        #quizPanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .quiz-content {
            background: white;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .quiz-header {
            background: #ff9800;
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
        }

        .quiz-header h3 {
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-question {
            padding: 20px;
            font-size: 1.1em;
            line-height: 1.6;
            color: var(--text-dark);
            border-bottom: 1px solid #eee;
        }

        .quiz-options {
            padding: 15px;
        }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover:not(.disabled) {
            border-color: #ff9800;
            background: #fff3e0;
        }

        .quiz-option.selected {
            border-color: #2196f3;
            background: #e3f2fd;
        }

        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .quiz-option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .quiz-option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .quiz-feedback {
            display: none;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .quiz-feedback.show {
            display: block;
        }

        .quiz-feedback.correct {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }

        .quiz-feedback.incorrect {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }

        .quiz-submit {
            display: block;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 15px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-submit:hover:not(:disabled) {
            background: #f57c00;
        }

        .quiz-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .quiz-continue {
            display: none;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-continue:hover {
            background: var(--secondary-color);
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            #titleScreen h1 { font-size: 1.8em; }
            #titleScreen h2 { font-size: 1.1em; }
            .title-info { padding: 15px 20px; }
            #startButton { padding: 15px 40px; font-size: 1.2em; }

            .character-slot {
                max-width: 180px;
                max-height: 250px;
            }

            .character-slot img {
                max-height: 250px;
            }

            .character-slot.left { left: 5%; }
            .character-slot.right { right: 5%; }

            #dialogBox {
                padding: 15px 20px;
                min-height: 180px;
            }

            #dialogText { font-size: 1em; }

            #navButtons {
                right: 20px;
                gap: 10px;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            #characterLayer {
                padding-bottom: 190px;
            }

            .character-slot {
                bottom: 190px;
            }

            #audioControls {
                bottom: 190px;
            }
        }

        @media (max-width: 480px) {
            .scene-grid {
                grid-template-columns: 1fr;
            }

            .character-slot {
                max-width: 140px;
                max-height: 200px;
            }

            .character-slot img {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- タイトル画面 -->
    <div id="titleScreen">
        <h1>在宅療養を支える訪問看護</h1>
        <h2>COPD事例 〜聖隷一男さんの物語〜</h2>
        <div class="title-info">
            <p>患者：聖隷一男さん（78歳）</p>
            <p>疾患：COPD（慢性閉塞性肺疾患）</p>
            <p>治療：在宅酸素療法</p>
            <p>全12シーン・77カット・10問のクイズ</p>
        </div>
        <button id="startButton">学習を開始する</button>
    </div>

    <!-- シーン選択画面 -->
    <div id="sceneSelectScreen">
        <div class="scene-select-header">
            <h2>シーン選択</h2>
            <p>学習したいシーンを選んでください</p>
        </div>
        <div class="scene-grid" id="sceneGrid"></div>
    </div>

    <!-- メインゲーム画面 -->
    <div id="gameScreen">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="backgroundLayer"></div>
        <div id="characterLayer">
            <div class="character-slot left" id="charLeft"></div>
            <div class="character-slot center" id="charCenter"></div>
            <div class="character-slot right" id="charRight"></div>
        </div>
        <div id="sceneHeader"></div>
        <button class="back-to-select" id="backToSelect">← シーン選択</button>
        <div id="dialogBox">
            <div id="speakerName"></div>
            <div id="dialogText"></div>
            <div id="navButtons">
                <button class="nav-btn prev" id="prevBtn">← 戻る</button>
                <button class="nav-btn next" id="nextBtn">次へ →</button>
            </div>
        </div>
        <div id="audioControls">
            <button class="audio-btn" id="bgmToggle">BGM ON</button>
            <button class="audio-btn" id="voiceToggle">音声 ON</button>
        </div>
    </div>

    <!-- 知識解説パネル -->
    <div id="knowledgePanel">
        <div class="knowledge-content">
            <div class="knowledge-header">
                <span>📚</span>
                <h3 id="knowledgeTitle"></h3>
            </div>
            <div class="knowledge-body" id="knowledgeText"></div>
            <button class="knowledge-close" id="knowledgeClose">理解しました</button>
        </div>
    </div>

    <!-- クイズパネル -->
    <div id="quizPanel">
        <div class="quiz-content">
            <div class="quiz-header">
                <h3><span>❓</span> 確認クイズ</h3>
            </div>
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
            <button class="quiz-submit" id="quizSubmit">回答する</button>
            <button class="quiz-continue" id="quizContinue">次へ進む</button>
        </div>
    </div>

    <script>
    // シナリオデータ
    const scenarioData = {
        "title": "在宅療養を支える訪問看護 - COPD事例",
        "scenes": [
            {
                "id": 1,
                "title": "イントロ",
                "background": null,
                "bgm": "main_theme",
                "cuts": [
                    {"id": "s01_01", "speaker": "narration", "text": "今回の主人公は聖隷一男さん、78歳の男性です。元公務員で、定年後は妻の市子さんとゴルフや旅行を楽しんでいました。"},
                    {"id": "s01_02", "speaker": "narration", "text": "3年前にCOPD（慢性閉塞性肺疾患）と診断され、在宅酸素療法を開始。先月、コロナ感染から急性増悪を起こし入院しましたが、退院して自宅療養を始めたところです。"},
                    {"id": "s01_03", "speaker": "narration", "text": "一男さんの視点で、訪問看護や地域の多職種連携を体験してみましょう。"}
                ],
                "knowledge": {
                    "title": "COPDとは",
                    "text": "COPD（Chronic Obstructive Pulmonary Disease）は、タバコ煙などの有害物質を長期に吸入することで生じる肺の炎症性疾患です。\n\n・肺胞の破壊（肺気腫）と気道の炎症により気流制限が生じる\n・日本では約530万人以上の患者がいると推定\n・主な症状：息切れ、慢性的な咳・痰\n・喫煙が最大の危険因子"
                }
            },
            {
                "id": 2,
                "title": "退院前カンファ",
                "background": "hospital_room",
                "bgm": "medical",
                "cuts": [
                    {"id": "s02_01", "speaker": "doctor", "text": "聖隷さん、入院中の治療で心不全の症状は改善しました。ただ、肺の状態は以前より悪化しています。", "characters": ["kazuo", "doctor"]},
                    {"id": "s02_02", "speaker": "kazuo", "type": "thought", "text": "（心の声）やっぱり悪くなっているのか...でも家に帰りたい。", "characters": ["kazuo", "doctor"]},
                    {"id": "s02_03", "speaker": "doctor", "text": "夜間のNPPV（非侵襲的陽圧換気療法）を自宅でも続けることをお勧めしますが、いかがですか？", "characters": ["kazuo", "doctor"]},
                    {"id": "s02_04", "speaker": "kazuo", "text": "先生、あの機械は眠れないし、つけるのも大変で...酸素だけでなんとかなりませんか？", "characters": ["kazuo", "doctor"]},
                    {"id": "s02_05", "speaker": "doctor", "text": "ご本人の意思を尊重します。ただ、急性増悪のリスクは高いことをご理解ください。何かあったらすぐに連絡してください。", "characters": ["kazuo", "doctor"]},
                    {"id": "s02_06", "speaker": "kazuo", "text": "わかりました。悪くなるなら、それも寿命かなと思っています。", "characters": ["kazuo", "doctor"]}
                ],
                "knowledge": {
                    "title": "NPPVとは",
                    "text": "NPPV（非侵襲的陽圧換気療法）は、マスクを介して陽圧をかけ呼吸を補助する治療法です。\n\n・気管挿管が不要なため「非侵襲的」\n・COPD急性増悪時の第一選択治療\n・マスクの不快感や圧迫感から継続が難しい患者も\n・患者の意思決定を尊重することが重要"
                },
                "quiz": {
                    "question": "COPD急性増悪時の人工呼吸管理として、最初に選択されることが多いのはどれか？",
                    "options": [
                        {"text": "気管挿管による人工呼吸", "correct": false},
                        {"text": "NPPV（非侵襲的陽圧換気療法）", "correct": true},
                        {"text": "高流量鼻カニュラ酸素療法", "correct": false},
                        {"text": "ネブライザー吸入", "correct": false}
                    ]
                }
            },
            {
                "id": 3,
                "title": "退院・帰宅",
                "background": "home_living",
                "bgm": "daily",
                "cuts": [

                    {"id": "s03_02", "speaker": "ichiko", "text": "お父さん、おかえりなさい。無理しないでね。ベッドの準備はしてあるから。", "characters": ["kazuo", "ichiko"]},

                    {"id": "s11_03", "speaker": "yamada", "text": "まず、いつもより息苦しさが強くなったら、酸素を4リットルに上げて、口すぼめ呼吸をしながら楽な姿勢をとってください。", "characters": ["kazuo", "yamada", "ichiko"]},
                    {"id": "s11_04", "speaker": "yamada", "text": "それでも改善しない場合や、次のような症状があったらすぐに連絡してください。①発熱がある ②痰の色が黄色や緑色に変わった ③胸の痛みがある ④意識がぼんやりする ⑤唇や爪が紫色になる", "characters": ["kazuo", "yamada", "ichiko"]},
                    {"id": "s11_05", "speaker": "kazuo", "text": "わかりました。緊急連絡先は冷蔵庫に貼ってあります。", "characters": ["kazuo", "yamada", "ichiko"]},
                    {"id": "s11_06", "speaker": "yamada", "text": "奥様も、何か気になることがあれば遠慮なく連絡してくださいね。24時間対応していますから。", "characters": ["kazuo", "yamada", "ichiko"]},
                    {"id": "s11_07", "speaker": "ichiko", "text": "夜中でも大丈夫なんですか？申し訳ない気がして...", "characters": ["kazuo", "yamada", "ichiko"]},
                    {"id": "s11_08", "speaker": "yamada", "text": "遠慮しないでください。早めに連絡していただいた方が、大事に至らずに済むことが多いんですよ。", "characters": ["kazuo", "yamada", "ichiko"]},
                    {"id": "s11_09", "speaker": "ichiko", "text": "わかりました。何かあったらすぐに連絡しますね。", "characters": ["kazuo", "yamada", "ichiko"]}
                ],
                "knowledge": {
                    "title": "COPD急性増悪の徴候",
                    "text": "【主要症状】\n・呼吸困難の悪化\n・痰の量の増加、色の変化（膿性）\n・発熱\n\n【その他の症状】\n・全身倦怠感の増強\n・チアノーゼ（唇・爪が紫色）\n・意識レベルの低下\n・下肢浮腫（右心不全の悪化）\n\n【急性増悪の主な原因】\n・気道感染（約7割）\n・大気汚染\n・原因不明（約3割）"
                },
                "quiz": {
                    "question": "COPD急性増悪の徴候として正しいのはどれか？（2つ選べ）",
                    "options": [
                        {"text": "膿性痰の増加", "correct": true},
                        {"text": "呼吸困難の軽減", "correct": false},
                        {"text": "食欲の増進", "correct": false},
                        {"text": "発熱", "correct": true}
                    ],
                    "multipleAnswer": true
                }
            },
            {
                "id": 12,
                "title": "エンディング",
                "background": null,
                "bgm": "main_theme",
                "cuts": [
                    {"id": "s12_01", "speaker": "narration", "text": "退院から3ヶ月。聖隷一男さんは、訪問看護師や多くの専門職に支えられながら、妻の市子さんと自宅での療養生活を続けています。"},
                    {"id": "s12_02", "speaker": "narration", "text": "入院前ほどの体力は戻っていませんが、毎日の口すぼめ呼吸と軽い運動を続け、少しずつ活動範囲を広げています。"},
                    {"id": "s12_03", "speaker": "narration", "text": "先日、念願だった家族での外食を実現。孫たちに囲まれて、一男さんは笑顔を見せていました。"},
                    {"id": "s12_04", "speaker": "narration", "text": "地域には、一男さんのような療養者を支えるさまざまな専門職がいます。訪問看護師、ケアマネジャー、かかりつけ医、薬剤師..."},
                    {"id": "s12_05", "speaker": "narration", "text": "それぞれが連携して、療養者と家族の「その人らしい生活」を支えています。"},
                    {"id": "s12_06", "speaker": "narration", "text": "皆さんも、地域の多職種連携について学び、チームの一員として活躍してください。【 完 】"}
                ],
                "knowledge": {
                    "title": "在宅療養を支える多職種連携",
                    "text": "【主な専門職と役割】\n・医師：診断・治療方針の決定\n・訪問看護師：状態観察・医療処置・療養相談\n・ケアマネジャー：ケアプラン作成・サービス調整\n・薬剤師：服薬管理・指導\n・理学療法士：リハビリテーション\n・介護福祉士：生活援助\n・地域包括支援センター：相談・調整\n\n多職種が情報を共有し、目標を共有することで、切れ目のない支援が可能になります。"
                }
            }
        ]
    };

    // キャラクター情報
    const characters = {
        kazuo: { name: "聖隷一男", folder: "kazuo_expressions" },
        ichiko: { name: "聖隷市子", folder: "ichiko_expressions" },
        yamada: { name: "山田看護師", folder: "yamada_expressions" },
        doctor: { name: "主治医", folder: "doctor_expressions" },
        pharmacist: { name: "薬剤師", folder: "pharmacist_expressions" },
        sato: { name: "佐藤ケアマネ", folder: "sato_expressions" }
    };

    // 背景画像マッピング
    const backgrounds = {
        hospital_room: "backgrounds/bg_hospital_room.png",
        home_living: "backgrounds/bg_home_living.png",
        home_bedroom: "backgrounds/bg_home_bedroom.png",
        pharmacy: "backgrounds/bg_pharmacy.png",
        clinic: "backgrounds/bg_clinic.png"
    };

    // BGMマッピング
    const bgmFiles = {
        main_theme: "bgm/bgm_main_theme.mp3",
        daily: "bgm/bgm_daily.mp3",
        medical: "bgm/bgm_medical.mp3",
        heartwarming: "bgm/bgm_heartwarming.mp3"
    };

    // 話者名マッピング
    const speakerNames = {
        narration: "ナレーション",
        kazuo: "聖隷一男",
        ichiko: "市子",
        yamada: "山田看護師",
        doctor: "主治医",
        pharmacist: "薬剤師",
        sato: "佐藤ケアマネ"
    };

    // ゲーム状態
    let currentSceneIndex = 0;
    let currentCutIndex = 0;
    let bgmEnabled = true;
    let voiceEnabled = true;
    let currentBgm = null;
    let currentVoice = null;
    let completedScenes = new Set();

    // DOM要素
    const titleScreen = document.getElementById('titleScreen');
    const sceneSelectScreen = document.getElementById('sceneSelectScreen');
    const gameScreen = document.getElementById('gameScreen');
    const backgroundLayer = document.getElementById('backgroundLayer');
    const dialogText = document.getElementById('dialogText');
    const speakerName = document.getElementById('speakerName');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const sceneHeader = document.getElementById('sceneHeader');

    // 初期化
    function init() {
        document.getElementById('startButton').addEventListener('click', showSceneSelect);
        document.getElementById('backToSelect').addEventListener('click', showSceneSelect);
        document.getElementById('bgmToggle').addEventListener('click', toggleBgm);
        document.getElementById('voiceToggle').addEventListener('click', toggleVoice);
        document.getElementById('knowledgeClose').addEventListener('click', closeKnowledge);
        document.getElementById('quizSubmit').addEventListener('click', submitQuiz);
        document.getElementById('quizContinue').addEventListener('click', closeQuiz);
        prevBtn.addEventListener('click', prevCut);
        nextBtn.addEventListener('click', nextCut);

        // シーンカード生成
        generateSceneCards();
    }

    // シーンカード生成
    function generateSceneCards() {
        const grid = document.getElementById('sceneGrid');
        grid.innerHTML = '';

        scenarioData.scenes.forEach((scene, index) => {
            const card = document.createElement('div');
            card.className = 'scene-card' + (completedScenes.has(scene.id) ? ' completed' : '');
            card.innerHTML = `
                <div class="scene-card-header">
                    <span class="scene-number">Scene ${scene.id}</span>
                    <span>${scene.title}</span>
                </div>
                <div class="scene-card-body">
                    <p>${scene.cuts.length}カット${scene.quiz ? ' / クイズあり' : ''}</p>
                </div>
            `;
            card.addEventListener('click', () => startScene(index));
            grid.appendChild(card);
        });
    }

    // シーン選択画面表示
    function showSceneSelect() {
        titleScreen.style.display = 'none';
        gameScreen.style.display = 'none';
        sceneSelectScreen.style.display = 'block';
        stopBgm();
        stopVoice();
        generateSceneCards();
    }

    // シーン開始
    function startScene(index) {
        currentSceneIndex = index;
        currentCutIndex = 0;
        sceneSelectScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        renderScene();
    }

    // シーン描画
    function renderScene() {
        const scene = scenarioData.scenes[currentSceneIndex];
        const cut = scene.cuts[currentCutIndex];

        // 背景設定
        if (scene.background) {
            backgroundLayer.style.backgroundImage = `url('${backgrounds[scene.background]}')`;
        } else {
            backgroundLayer.style.backgroundImage = 'none';
            backgroundLayer.style.background = 'linear-gradient(135deg, #2d5a27 0%, #1e3a1a 100%)';
        }

        // BGM再生
        if (bgmEnabled && scene.bgm) {
            playBgm(scene.bgm);
        }

        // 音声再生
        if (voiceEnabled && cut.id) {
            playVoice(cut.id);
        }

        // キャラクター表示
        renderCharacters(cut.characters || []);

        // セリフ表示
        const speaker = cut.speaker;
        speakerName.textContent = speakerNames[speaker] || speaker;
        speakerName.className = '';
        dialogText.className = '';

        if (speaker === 'narration') {
            speakerName.classList.add('narrator');
        } else if (cut.type === 'thought') {
            speakerName.classList.add('thought');
            dialogText.classList.add('thought');
        }

        dialogText.textContent = cut.text;

        // シーンヘッダー更新
        sceneHeader.textContent = `Scene ${scene.id}: ${scene.title} (${currentCutIndex + 1}/${scene.cuts.length})`;

        // プログレスバー更新
        updateProgress();

        // ナビゲーションボタン更新
        updateNavButtons();
    }

    // キャラクター描画
    function renderCharacters(charList) {
        const charLeft = document.getElementById('charLeft');
        const charCenter = document.getElementById('charCenter');
        const charRight = document.getElementById('charRight');

        charLeft.innerHTML = '';
        charCenter.innerHTML = '';
        charRight.innerHTML = '';

        if (!charList || charList.length === 0) return;

        if (charList.length === 1) {
            charCenter.innerHTML = getCharacterImg(charList[0]);
        } else if (charList.length === 2) {
            charLeft.innerHTML = getCharacterImg(charList[0]);
            charRight.innerHTML = getCharacterImg(charList[1]);
        } else if (charList.length >= 3) {
            charLeft.innerHTML = getCharacterImg(charList[0]);
            charCenter.innerHTML = getCharacterImg(charList[1]);
            charRight.innerHTML = getCharacterImg(charList[2]);
        }
    }

    // キャラクター画像取得
    function getCharacterImg(charId) {
        const char = characters[charId];
        if (!char) return '';

        // デフォルト表情を使用（一般表情の5番目: neutral相当）
        let imgPath;
        if (charId === 'kazuo') {
            imgPath = `characters/${char.folder}/kazuo_general_05_neutral.png`;
        } else {
            imgPath = `characters/${char.folder}/${charId}_05_neutral.png`;
        }

        return `<img src="${imgPath}" alt="${char.name}" onerror="this.style.display='none'">`;
    }

    // BGM再生
    function playBgm(bgmId) {
        if (currentBgm && currentBgm.src.includes(bgmFiles[bgmId])) return;

        stopBgm();
        currentBgm = new Audio(bgmFiles[bgmId]);
        currentBgm.loop = true;
        currentBgm.volume = 0.3;
        currentBgm.play().catch(e => console.log('BGM再生エラー:', e));
    }

    // BGM停止
    function stopBgm() {
        if (currentBgm) {
            currentBgm.pause();
            currentBgm = null;
        }
    }

    // BGMトグル
    function toggleBgm() {
        bgmEnabled = !bgmEnabled;
        const btn = document.getElementById('bgmToggle');
        if (bgmEnabled) {
            btn.textContent = 'BGM ON';
            btn.classList.remove('off');
            const scene = scenarioData.scenes[currentSceneIndex];
            if (scene.bgm) playBgm(scene.bgm);
        } else {
            btn.textContent = 'BGM OFF';
            btn.classList.add('off');
            stopBgm();
        }
    }

    // 音声再生
    function playVoice(cutId) {
        stopVoice();
        const audioPath = `audio/${cutId}.mp3`;
        currentVoice = new Audio(audioPath);
        currentVoice.volume = 0.8;
        currentVoice.play().catch(e => console.log('音声再生エラー:', e));
    }

    // 音声停止
    function stopVoice() {
        if (currentVoice) {
            currentVoice.pause();
            currentVoice = null;
        }
    }

    // 音声トグル
    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        const btn = document.getElementById('voiceToggle');
        if (voiceEnabled) {
            btn.textContent = '音声 ON';
            btn.classList.remove('off');
        } else {
            btn.textContent = '音声 OFF';
            btn.classList.add('off');
            stopVoice();
        }
    }

    // プログレス更新
    function updateProgress() {
        const scene = scenarioData.scenes[currentSceneIndex];
        const totalCuts = scene.cuts.length;
        const progress = ((currentCutIndex + 1) / totalCuts) * 100;
        progressFill.style.width = progress + '%';
    }

    // ナビゲーションボタン更新
    function updateNavButtons() {
        const scene = scenarioData.scenes[currentSceneIndex];
        const isFirstCut = currentCutIndex === 0;
        const isLastCut = currentCutIndex >= scene.cuts.length - 1;

        prevBtn.disabled = isFirstCut && currentSceneIndex === 0;

        if (isLastCut) {
            nextBtn.textContent = 'シーン終了';
        } else {
            nextBtn.textContent = '次へ →';
        }
    }

    // 前のカット
    function prevCut() {
        if (currentCutIndex > 0) {
            currentCutIndex--;
            renderScene();
        } else if (currentSceneIndex > 0) {
            currentSceneIndex--;
            currentCutIndex = scenarioData.scenes[currentSceneIndex].cuts.length - 1;
            renderScene();
        }
    }

    // 次のカット
    function nextCut() {
        const scene = scenarioData.scenes[currentSceneIndex];

        if (currentCutIndex < scene.cuts.length - 1) {
            currentCutIndex++;
            renderScene();
        } else {
            // シーン終了時
            endScene();
        }
    }

    // シーン終了処理
    function endScene() {
        const scene = scenarioData.scenes[currentSceneIndex];

        // 知識解説表示
        if (scene.knowledge) {
            showKnowledge(scene.knowledge);
        } else if (scene.quiz) {
            showQuiz(scene.quiz);
        } else {
            completeScene();
        }
    }

    // 知識解説表示
    function showKnowledge(knowledge) {
        document.getElementById('knowledgeTitle').textContent = knowledge.title;
        document.getElementById('knowledgeText').textContent = knowledge.text;
        document.getElementById('knowledgePanel').style.display = 'flex';
    }

    // 知識解説閉じる
    function closeKnowledge() {
        document.getElementById('knowledgePanel').style.display = 'none';
        const scene = scenarioData.scenes[currentSceneIndex];
        if (scene.quiz) {
            showQuiz(scene.quiz);
        } else {
            completeScene();
        }
    }

    // クイズ表示
    let selectedOptions = new Set();
    let quizData = null;

    function showQuiz(quiz) {
        quizData = quiz;
        selectedOptions.clear();

        document.getElementById('quizQuestion').textContent = quiz.question;

        const optionsContainer = document.getElementById('quizOptions');
        optionsContainer.innerHTML = '';

        quiz.options.forEach((opt, index) => {
            const optEl = document.createElement('div');
            optEl.className = 'quiz-option';
            optEl.innerHTML = `
                <span class="option-marker">${String.fromCharCode(65 + index)}</span>
                <span>${opt.text}</span>
            `;
            optEl.addEventListener('click', () => selectOption(index, optEl, quiz.multipleAnswer));
            optionsContainer.appendChild(optEl);
        });

        document.getElementById('quizFeedback').className = 'quiz-feedback';
        document.getElementById('quizFeedback').innerHTML = '';
        document.getElementById('quizSubmit').style.display = 'block';
        document.getElementById('quizSubmit').disabled = true;
        document.getElementById('quizContinue').style.display = 'none';
        document.getElementById('quizPanel').style.display = 'flex';
    }

    // 選択肢選択
    function selectOption(index, element, multipleAnswer) {
        if (element.classList.contains('disabled')) return;

        if (multipleAnswer) {
            if (selectedOptions.has(index)) {
                selectedOptions.delete(index);
                element.classList.remove('selected');
            } else {
                selectedOptions.add(index);
                element.classList.add('selected');
            }
        } else {
            document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
            selectedOptions.clear();
            selectedOptions.add(index);
            element.classList.add('selected');
        }

        document.getElementById('quizSubmit').disabled = selectedOptions.size === 0;
    }

    // クイズ回答
    function submitQuiz() {
        if (!quizData) return;

        const options = document.querySelectorAll('.quiz-option');
        let allCorrect = true;
        let correctCount = 0;
        let selectedCorrectCount = 0;

        quizData.options.forEach((opt, index) => {
            const optEl = options[index];
            optEl.classList.add('disabled');

            if (opt.correct) {
                correctCount++;
                optEl.classList.add('correct');
                if (selectedOptions.has(index)) {
                    selectedCorrectCount++;
                }
            } else if (selectedOptions.has(index)) {
                optEl.classList.add('incorrect');
                allCorrect = false;
            }
        });

        if (selectedCorrectCount !== correctCount || !allCorrect) {
            allCorrect = false;
        }

        const feedback = document.getElementById('quizFeedback');
        if (allCorrect) {
            feedback.className = 'quiz-feedback show correct';
            feedback.innerHTML = '<strong>✅ 正解です！</strong>';
        } else {
            feedback.className = 'quiz-feedback show incorrect';
            feedback.innerHTML = '<strong>❌ 不正解です</strong><br>正解の選択肢を確認してください。';
        }

        document.getElementById('quizSubmit').style.display = 'none';
        document.getElementById('quizContinue').style.display = 'block';
    }

    // クイズ閉じる
    function closeQuiz() {
        document.getElementById('quizPanel').style.display = 'none';
        completeScene();
    }

    // シーン完了
    function completeScene() {
        const scene = scenarioData.scenes[currentSceneIndex];
        completedScenes.add(scene.id);
        showSceneSelect();
    }

    // 初期化実行
    init();
    </script>
</body>
</html>
