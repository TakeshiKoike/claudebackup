<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在宅療養を支える訪問看護 - COPD事例</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-color: #2d5a27;
            --secondary-color: #4a7c43;
            --accent-color: #8bc34a;
            --bg-dark: #1a1a2e;
            --bg-light: #f5f5f5;
            --text-dark: #333;
            --text-light: #fff;
        }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* タイトル画面 */
        #titleScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('maps/map_town.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            color: white;
            text-align: center;
        }

        #titleScreen h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #titleScreen h2 {
            font-size: 1.3em;
            font-weight: normal;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .title-info {
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .title-info p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        #startButton {
            padding: 20px 60px;
            font-size: 1.4em;
            background: linear-gradient(135deg, #fff, #e8e8e8);
            color: var(--primary-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        #startButton:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        /* MAP画面 */
        #mapScreen, #hospitalMapScreen, #homeMapScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 2000;
            display: none;
        }

        .map-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }

        .map-wrapper img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .location-marker {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .location-marker:hover {
            transform: translate(-50%, -100%) scale(1.15);
        }

        .marker-icon {
            width: 100%;
            height: 100%;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .marker-icon span {
            transform: rotate(45deg);
            font-size: 28px;
        }

        .marker-icon.home { background: #3498db; }
        .marker-icon.hospital { background: #e74c3c; }
        .marker-icon.pharmacy { background: #2ecc71; }
        .marker-icon.clinic { background: #9b59b6; }
        .marker-icon.nursing { background: #e91e63; }

        .marker-label {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            font-weight: bold;
        }

        .location-marker.next-destination .marker-icon {
            animation: pulse-marker 1.5s infinite;
        }

        /* 無効なマーカー（まだ選択できない） */
        .location-marker.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .location-marker.disabled .marker-icon {
            filter: grayscale(100%);
        }

        /* 訪問済みマーカー */
        .location-marker.completed .marker-icon {
            opacity: 0.6;
        }

        .location-marker.completed::after {
            content: "✓";
            position: absolute;
            top: -10px;
            right: -10px;
            background: #4CAF50;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes pulse-marker {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8); }
            50% { box-shadow: 0 0 25px 15px rgba(255, 215, 0, 0.3); }
        }

        .location-marker.next-destination::after {
            content: "▼ 次へ";
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #333;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            animation: bounce-arrow 1s infinite;
        }

        @keyframes bounce-arrow {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(5px); }
        }

        .location-marker.visited .marker-icon {
            opacity: 0.5;
        }

        .location-marker.current .marker-icon {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }


        .map-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
        }

        .map-header h3 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .map-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .map-legend h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 0.95em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            font-size: 0.85em;
            color: #666;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        /* メインゲーム画面 */
        #gameScreen {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #backgroundLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #2d2d44;
            transition: background-image 0.5s ease;
        }

        #characterLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 220px;
            pointer-events: none;
        }

        .character-slot {
            position: absolute;
            bottom: 220px;
            max-width: 300px;
            max-height: 400px;
            transition: all 0.3s ease;
        }

        .character-slot.left { left: 10%; }
        .character-slot.center { left: 50%; transform: translateX(-50%); }
        .character-slot.right { right: 10%; }

        .character-slot img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            border-radius: 10px;
        }

        #dialogBox {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.85));
            padding: 20px 30px;
            min-height: 200px;
        }

        #speakerName {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1em;
        }

        #speakerName.narrator { background: #6b8e23; }
        #speakerName.thought { background: #4682b4; font-style: italic; }

        #dialogText {
            color: white;
            font-size: 1.15em;
            line-height: 1.8;
            min-height: 80px;
        }

        #dialogText.thought {
            font-style: italic;
            color: #b0c4de;
        }

        #navButtons {
            position: absolute;
            bottom: 15px;
            right: 30px;
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .nav-btn.prev { background: #666; color: white; }
        .nav-btn.next { background: var(--accent-color); color: var(--text-dark); }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #progressBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(255,255,255,0.2);
        }

        #progressFill {
            height: 100%;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        #sceneHeader {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .back-to-map {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .back-to-map:hover { background: rgba(0,0,0,0.9); }

        #audioControls {
            position: fixed;
            bottom: 220px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1500;
        }

        .audio-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .audio-btn:hover { background: rgba(0,0,0,0.9); }
        .audio-btn.off { background: #c62828; }

        /* ナビゲーションコントロール */
        #navControlPanel {
            position: fixed;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 3500;
        }

        .nav-control-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .nav-control-btn:hover { background: rgba(0,0,0,0.9); }

        /* シーン選択パネル */
        #sceneSelectPanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .scene-select-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .scene-select-content h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .scene-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scene-item:hover { background: #e0e0e0; }
        .scene-item.completed { background: #e8f5e9; }
        .scene-item.current { background: #fff3e0; border: 2px solid #ff9800; }
        .scene-item.locked { opacity: 0.5; pointer-events: none; }

        .scene-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }

        .scene-item.completed .scene-number { background: #4CAF50; }
        .scene-item.locked .scene-number { background: #9e9e9e; }

        .scene-title { flex: 1; font-weight: 500; }

        .scene-close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
        }

        /* 知識解説パネル */
        #knowledgePanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2500;
            padding: 20px;
        }

        .knowledge-content {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .knowledge-header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .knowledge-header h3 { font-size: 1.3em; }

        .knowledge-body {
            padding: 25px;
            line-height: 1.8;
            color: var(--text-dark);
            white-space: pre-line;
        }

        .knowledge-close {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--secondary-color);
            color: white;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 0 0 20px 20px;
        }

        .knowledge-close:hover { background: var(--primary-color); }

        /* クイズパネル */
        #quizPanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2500;
            padding: 20px;
        }

        .quiz-content {
            background: white;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .quiz-header {
            background: #ff9800;
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
        }

        .quiz-header h3 {
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-question {
            padding: 20px;
            font-size: 1.1em;
            line-height: 1.6;
            color: var(--text-dark);
            border-bottom: 1px solid #eee;
        }

        .quiz-options { padding: 15px; }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover:not(.disabled) {
            border-color: #ff9800;
            background: #fff3e0;
        }

        .quiz-option.selected {
            border-color: #2196f3;
            background: #e3f2fd;
        }

        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .quiz-option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .quiz-option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .quiz-feedback {
            display: none;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .quiz-feedback.show { display: block; }

        .quiz-feedback.correct {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }

        .quiz-feedback.incorrect {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }

        .quiz-submit {
            display: block;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 15px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-submit:hover:not(:disabled) { background: #f57c00; }
        .quiz-submit:disabled { background: #ccc; cursor: not-allowed; }

        .quiz-continue {
            display: none;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-continue:hover { background: var(--secondary-color); }

        /* レスポンシブ */
        @media (max-width: 768px) {
            #titleScreen h1 { font-size: 1.8em; }
            #titleScreen h2 { font-size: 1.1em; }
            .title-info { padding: 15px 20px; }
            #startButton { padding: 15px 40px; font-size: 1.2em; }

            .location-marker { width: 50px; height: 50px; }
            .marker-icon span { font-size: 22px; }

            .character-slot { max-width: 180px; max-height: 250px; }
            .character-slot img { max-height: 250px; }
            .character-slot.left { left: 5%; }
            .character-slot.right { right: 5%; }

            #dialogBox { padding: 15px 20px; min-height: 180px; }
            #dialogText { font-size: 1em; }
            #navButtons { right: 20px; gap: 10px; }
            .nav-btn { padding: 10px 20px; font-size: 0.9em; }

            #characterLayer { padding-bottom: 190px; }
            .character-slot { bottom: 190px; }
            #audioControls { bottom: 190px; }

            .map-legend { display: none; }
        }
    </style>
</head>
<body>
    <!-- タイトル画面 -->
    <div id="titleScreen">
        <h1>在宅療養を支える訪問看護</h1>
        <h2>COPD事例 〜聖隷一男さんの物語〜</h2>
        <div class="title-info">
            <p>患者：聖隷一男さん（78歳）</p>
            <p>疾患：COPD（慢性閉塞性肺疾患）</p>
            <p>治療：在宅酸素療法</p>
            <p>全12シーン・77カット・10問のクイズ</p>
        </div>
        <button id="startButton">学習を開始する</button>
    </div>

    <!-- MAP画面 -->
    <div id="mapScreen">
        <div class="map-header">
            <h3 id="mapTitle">MAPで場所を選んでください</h3>
            <p id="mapInstruction">光っているマーカーをクリック</p>
        </div>
        <div class="map-container">
            <div class="map-wrapper" id="mapWrapper">
                <img src="maps/map_town.png" alt="街並みMAP" id="mapImage">
                <!-- 病院マーカー（左下の赤十字建物） -->
                <div class="location-marker" data-location="hospital" style="left: 15%; top: 72%;">
                    <div class="marker-icon hospital"><span>🏥</span></div>
                    <div class="marker-label">総合病院</div>
                </div>
                <!-- 自宅マーカー（中央の住宅街） -->
                <div class="location-marker" data-location="home" style="left: 55%; top: 55%;">
                    <div class="marker-icon home"><span>🏠</span></div>
                    <div class="marker-label">聖隷さん宅</div>
                </div>
                <!-- 薬局マーカー（緑十字の建物） -->
                <div class="location-marker" data-location="pharmacy" style="left: 38%; top: 48%;">
                    <div class="marker-icon pharmacy"><span>💊</span></div>
                    <div class="marker-label">薬局</div>
                </div>
                <!-- 訪問看護ステーションマーカー（中央道路沿い右側奥の駐車場のある建物） -->
                <div class="location-marker" data-location="nursing" style="left: 52%; top: 25%;">
                    <div class="marker-icon nursing"><span>👩‍⚕️</span></div>
                    <div class="marker-label">訪問看護ステーション</div>
                </div>
                <!-- クリニックマーカー（右下の白い建物） -->
                <div class="location-marker" data-location="clinic" style="left: 70%; top: 75%;">
                    <div class="marker-icon clinic"><span>🩺</span></div>
                    <div class="marker-label">クリニック</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 病院MAP画面 -->
    <div id="hospitalMapScreen" style="display: none;">
        <div class="map-header">
            <h3 id="hospitalMapTitle">病院内MAP</h3>
            <p id="hospitalMapInstruction">場所をクリックしてください</p>
        </div>

    // ゲーム状態
    let currentSceneIndex = 0;
    let currentCutIndex = 0;
    let bgmEnabled = true;
    let voiceEnabled = true;
    let currentBgm = null;
    let currentVoice = null;
    let visitedLocations = new Set();
    let waitingForMapSelection = false;
    let completedScenes = new Set(); // 完了したシーンを追跡

    // シーン→部屋マッピング（サブMAP用）
    const SCENE_ROOM_MAP = {
        2: 'hospital_room',     // 病室
        3: 'home_living',       // リビング
        4: 'home_bedroom',      // 寝室
        5: 'home_bathroom',     // 浴室（入浴介助）
        6: 'home_bedroom',      // 寝室（呼吸リハビリ）
        9: 'home_living',       // リビング（ケアマネ訪問）
        10: 'home_living',      // リビング（妻との会話）
        11: 'home_bedroom'      // 寝室（急変時）

    // 初期化
    function init() {
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('sceneSelectBtn').addEventListener('click', showSceneSelect);
        document.getElementById('sceneSelectClose').addEventListener('click', closeSceneSelect);
        document.getElementById('backToMap').addEventListener('click', showMap);
        document.getElementById('bgmToggle').addEventListener('click', toggleBgm);
        document.getElementById('voiceToggle').addEventListener('click', toggleVoice);
        document.getElementById('knowledgeClose').addEventListener('click', closeKnowledge);
        document.getElementById('quizSubmit').addEventListener('click', submitQuiz);
        document.getElementById('quizContinue').addEventListener('click', closeQuiz);
        document.getElementById('prevBtn').addEventListener('click', prevCut);
        document.getElementById('nextBtn').addEventListener('click', nextCut);

        // 街並みMAPマーカーイベント
        document.querySelectorAll('#mapScreen .location-marker').forEach(marker => {
            marker.addEventListener('click', () => handleMarkerClick(marker.dataset.location));
        });

        // 病院MAPマーカーイベント
        document.querySelectorAll('#hospitalMapScreen .location-marker').forEach(marker => {
            marker.addEventListener('click', () => handleSubMapMarkerClick('hospital', marker.dataset.location, marker.dataset.scene));
        });

        // 自宅MAPマーカーイベント
        document.querySelectorAll('#homeMapScreen .location-marker').forEach(marker => {
            marker.addEventListener('click', () => handleSubMapMarkerClick('home', marker.dataset.location, marker.dataset.scene));
        });

        // サブMAPから街並みMAPへ戻るボタン
        document.getElementById('backToTownFromHospital').addEventListener('click', backToTownMap);
        document.getElementById('backToTownFromHome').addEventListener('click', backToTownMap);

    // ゲーム開始
    function startGame() {
        document.getElementById('titleScreen').style.display = 'none';
        currentSceneIndex = 0;
        currentCutIndex = 0;

        // イントロシーンを開始
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    // MAP表示（次の目的地に応じて適切なMAPを表示）
    function showMap() {
        stopVoice();
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';

        const nextLoc = getNextLocation();

        // 次の目的地が病院の場合は街並みMAP（病院へ移動するため）
        // 次の目的地が自宅の場合、現在のシーンによって判断
        const currentSceneId = scenarioData.scenes[currentSceneIndex].id;

        // 現在自宅にいて、次も自宅の場合は自宅MAP
        if (nextLoc === 'home' && [3, 4, 5, 6, 9, 10].includes(currentSceneId)) {
            document.getElementById('homeMapScreen').style.display = 'block';
            updateSubMapMarkers('home');
            return;
        }

        // それ以外は街並みMAPへ
        document.getElementById('mapScreen').style.display = 'block';
        waitingForMapSelection = true;
        updateMarkers();

        if (nextLoc) {
            document.getElementById('mapTitle').textContent = '次の場所へ移動';
            document.getElementById('mapInstruction').textContent = '光っているマーカーをクリック';
        } else {
            document.getElementById('mapTitle').textContent = '学習完了！';
            document.getElementById('mapInstruction').textContent = 'お疲れ様でした';
        }
    }

    // 次の場所を取得
    function getNextLocation() {
        if (currentSceneIndex >= SCENE_FLOW.length - 1) return null;
        return SCENE_FLOW[currentSceneIndex].nextLocation;
    }

    // マーカー更新（シナリオ順序に従い、次の目的地のみ有効化）
    function updateMarkers() {
        const nextLoc = getNextLocation();
        const currentLoc = SCENE_LOCATION_MAP[scenarioData.scenes[currentSceneIndex].id];

        // 街並みMAPのマーカーのみ更新（サブMAPは除外）
        document.querySelectorAll('#mapScreen .location-marker').forEach(marker => {
            const loc = marker.dataset.location;
            marker.classList.remove('next-destination', 'current', 'visited', 'disabled');
            marker.style.cursor = 'default';

            if (loc === currentLoc) {
                marker.classList.add('current');
                visitedLocations.add(loc);
            }

            if (visitedLocations.has(loc)) {
                marker.classList.add('visited');
            }

            if (waitingForMapSelection && loc === nextLoc) {
                // 次の目的地は有効化
                marker.classList.add('next-destination');
                marker.style.cursor = 'pointer';
            } else if (waitingForMapSelection) {
                // 次の目的地以外は無効化（半透明）
                marker.classList.add('disabled');
            }
        });
    }

    // マーカークリック処理（街並みMAP）
    function handleMarkerClick(location) {
        if (!waitingForMapSelection) return;

        // 無効化されたマーカーは無視
        const marker = document.querySelector(`#mapScreen [data-location="${location}"]`);
        if (marker && marker.classList.contains('disabled')) return;

        const nextLoc = getNextLocation();
        if (location !== nextLoc) return;

        // 病院または自宅の場合はサブMAPを表示
        if (location === 'hospital') {
            showHospitalMap();
            return;
        }
        if (location === 'home') {
            showHomeMap();
            return;
        }

        waitingForMapSelection = false;
        visitedLocations.add(location);

        // 次のシーンへ
        currentSceneIndex++;
        currentCutIndex = 0;

        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    // 病院MAP表示
    function showHospitalMap() {
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'block';
        updateSubMapMarkers('hospital');
    }

    // 自宅MAP表示
    function showHomeMap() {
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'block';
        updateSubMapMarkers('home');
    }

    // 街並みMAPへ戻る
    function backToTownMap() {
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('mapScreen').style.display = 'block';
    }

    // サブMAPマーカー更新（シナリオ順序に従い、次に必要なマーカーのみ有効化）
    function updateSubMapMarkers(mapType) {
        const mapId = mapType === 'hospital' ? 'hospitalMapScreen' : 'homeMapScreen';

        // 次のシーンを取得
        const nextSceneIndex = currentSceneIndex + 1;
        if (nextSceneIndex >= scenarioData.scenes.length) {
            // すべてのマーカーを無効化
            document.querySelectorAll(`#${mapId} .location-marker`).forEach(marker => {
                marker.classList.add('disabled');
                marker.classList.remove('next-destination');
                marker.style.cursor = 'default';
            });
            return;
        }

        const nextSceneId = scenarioData.scenes[nextSceneIndex].id;
        const requiredRoom = SCENE_ROOM_MAP[nextSceneId];

        document.querySelectorAll(`#${mapId} .location-marker`).forEach(marker => {
            const markerLocation = marker.dataset.location;

            marker.classList.remove('next-destination', 'disabled', 'completed');

            if (markerLocation === requiredRoom) {
                // 次に必要な場所 - 動的にシーンIDを設定
                marker.classList.add('next-destination');
                marker.style.cursor = 'pointer';
                marker.dataset.scene = nextSceneId;
            } else {
                // まだ必要ない場所は半透明に
                marker.classList.add('disabled');
                marker.style.cursor = 'default';
            }
        });
    }

    // サブMAPマーカークリック処理
    function handleSubMapMarkerClick(mapType, location, sceneId) {
        if (!sceneId) return; // シーンが設定されていない場所はスキップ

        // 無効化されたマーカーは無視（CSS pointer-events: noneのバックアップ）
        const mapId = mapType === 'hospital' ? 'hospitalMapScreen' : 'homeMapScreen';
        const marker = document.querySelector(`#${mapId} [data-location="${location}"]`);
        if (marker && marker.classList.contains('disabled')) return;

        waitingForMapSelection = false;
        visitedLocations.add(mapType);

        // 指定されたシーンへ移動
        const targetSceneIndex = scenarioData.scenes.findIndex(s => s.id === parseInt(sceneId));
        if (targetSceneIndex === -1) return;

        currentSceneIndex = targetSceneIndex;
        currentCutIndex = 0;

        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        renderScene();
    }

    // シーン描画
    function renderScene() {
        const scene = scenarioData.scenes[currentSceneIndex];
        const cut = scene.cuts[currentCutIndex];

        // 背景設定
        const bgLayer = document.getElementById('backgroundLayer');
        if (scene.background) {
            bgLayer.style.backgroundImage = `url('${backgrounds[scene.background]}')`;
        } else {
            bgLayer.style.backgroundImage = 'none';
            bgLayer.style.background = 'linear-gradient(135deg, #2d5a27 0%, #1e3a1a 100%)';
        }

        // BGM
        if (bgmEnabled && scene.bgm) {
            playBgm(scene.bgm);
        }

        // 音声
        if (voiceEnabled && cut.id) {
            playVoice(cut.id);
        }

        // キャラクター（cutIdを渡して表情ガイドから取得）
        renderCharacters(cut.id);

        // セリフ
        const speaker = cut.speaker;
        const speakerEl = document.getElementById('speakerName');
        speakerEl.textContent = speakerNames[speaker] || speaker;
        speakerEl.className = '';
        document.getElementById('dialogText').className = '';

        if (speaker === 'narration') {
            speakerEl.classList.add('narrator');
        } else if (cut.type === 'thought') {
            speakerEl.classList.add('thought');
            document.getElementById('dialogText').classList.add('thought');
        }

        document.getElementById('dialogText').textContent = cut.text;
        document.getElementById('sceneHeader').textContent = `Scene ${scene.id}: ${scene.title} (${currentCutIndex + 1}/${scene.cuts.length})`;

        updateProgress();
        updateNavButtons();
    }

    // キャラクター描画（表情ガイド対応）
    function renderCharacters(cutId) {
        document.getElementById('charLeft').innerHTML = '';
        document.getElementById('charCenter').innerHTML = '';
        document.getElementById('charRight').innerHTML = '';

        // 表情ガイドからキャラクター情報を取得
        const charData = expressionGuide[cutId];
        if (!charData || charData.length === 0) return;

        // position別に振り分け
        charData.forEach(charInfo => {
            const position = charInfo.position || 'center';
            const imgHtml = getCharacterImg(charInfo.id, charInfo.expression);

            if (position === 'left') {
                document.getElementById('charLeft').innerHTML = imgHtml;
            } else if (position === 'right') {
                document.getElementById('charRight').innerHTML = imgHtml;
            } else {
                document.getElementById('charCenter').innerHTML = imgHtml;
            }
        });
    }

    function getCharacterImg(charId, expression) {
        const char = characters[charId];
        if (!char) return '';

        // 表情が指定されている場合はその表情を使用
        let imgPath;
        if (expression) {
            imgPath = `characters/${char.folder}/${expression}.png`;
        } else {
            // デフォルトはneutral
            imgPath = charId === 'kazuo'
                ? `characters/${char.folder}/kazuo_general_05_neutral.png`
                : `characters/${char.folder}/${charId}_05_neutral.png`;
        }
        return `<img src="${imgPath}" alt="${char.name}" onerror="this.style.display='none'">`;
    }

    // BGM
    function playBgm(bgmId) {
        if (currentBgm && currentBgm.src.includes(bgmFiles[bgmId])) return;
        stopBgm();
        currentBgm = new Audio(bgmFiles[bgmId]);
        currentBgm.loop = true;
        currentBgm.volume = 0.15;
        currentBgm.play().catch(e => console.log('BGM:', e));
    }

    function stopBgm() {
        if (currentBgm) { currentBgm.pause(); currentBgm = null; }
    }

    function toggleBgm() {
        bgmEnabled = !bgmEnabled;
        const btn = document.getElementById('bgmToggle');
        if (bgmEnabled) {
            btn.textContent = 'BGM ON';
            btn.classList.remove('off');
            const scene = scenarioData.scenes[currentSceneIndex];
            if (scene.bgm) playBgm(scene.bgm);
        } else {
            btn.textContent = 'BGM OFF';
            btn.classList.add('off');
            stopBgm();
        }
    }

    // 音声
    function playVoice(cutId) {
        stopVoice();
        currentVoice = new Audio(`audio/${cutId}.mp3`);
        currentVoice.volume = 0.8;
        currentVoice.play().catch(e => console.log('Voice:', e));
    }

    function stopVoice() {
        if (currentVoice) { currentVoice.pause(); currentVoice = null; }
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        const btn = document.getElementById('voiceToggle');
        if (voiceEnabled) {
            btn.textContent = '音声 ON';
            btn.classList.remove('off');
        } else {
            btn.textContent = '音声 OFF';
            btn.classList.add('off');
            stopVoice();
        }
    }

    // プログレス
    function updateProgress() {
        const scene = scenarioData.scenes[currentSceneIndex];
        const progress = ((currentCutIndex + 1) / scene.cuts.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
    }

    // ナビゲーション
    function updateNavButtons() {
        const scene = scenarioData.scenes[currentSceneIndex];
        document.getElementById('prevBtn').disabled = currentCutIndex === 0 && currentSceneIndex === 0;
        document.getElementById('nextBtn').textContent = currentCutIndex >= scene.cuts.length - 1 ? 'シーン終了' : '次へ →';
    }

    function prevCut() {
        if (currentCutIndex > 0) {
            currentCutIndex--;
            renderScene();
        }
    }

    function nextCut() {
        const scene = scenarioData.scenes[currentSceneIndex];
        if (currentCutIndex < scene.cuts.length - 1) {
            currentCutIndex++;
            renderScene();
        } else {
            endScene();
        }
    }

    // シーン終了
    function endScene() {
        const scene = scenarioData.scenes[currentSceneIndex];
        // シーン完了を記録
        completedScenes.add(scene.id);

        if (scene.knowledge) {
            showKnowledge(scene.knowledge);
        } else if (scene.quiz) {
            showQuiz(scene.quiz);
        } else {
            goToNextScene();
        }
    }

    // 最初からやり直す
    function restartGame() {
        if (!confirm('最初からやり直しますか？')) return;
        stopVoice();
        stopBgm();
        currentSceneIndex = 0;
        currentCutIndex = 0;
        completedScenes.clear();
        visitedLocations.clear();
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('titleScreen').style.display = 'flex';
    }

    // シーン選択パネル表示
    function showSceneSelect() {
        const sceneList = document.getElementById('sceneList');
        sceneList.innerHTML = '';

        scenarioData.scenes.forEach((scene, index) => {
            const div = document.createElement('div');
            div.className = 'scene-item';

            // 現在のシーン
            if (index === currentSceneIndex) {
                div.classList.add('current');
            }
            // 完了済みシーン
            else if (completedScenes.has(scene.id)) {
                div.classList.add('completed');
            }

            div.innerHTML = `
                <div class="scene-number">${scene.id}</div>
                <div class="scene-title">${scene.title}</div>
            `;

            // すべてのシーンをクリック可能に
            div.addEventListener('click', () => goToScene(index));

            sceneList.appendChild(div);
        });

        document.getElementById('sceneSelectPanel').style.display = 'flex';
    }

    // シーン選択パネルを閉じる
    function closeSceneSelect() {
        document.getElementById('sceneSelectPanel').style.display = 'none';
    }

    // 指定シーンへジャンプ
    function goToScene(sceneIndex) {
        closeSceneSelect();
        currentSceneIndex = sceneIndex;
        currentCutIndex = 0;

        document.getElementById('titleScreen').style.display = 'none';
        document.getElementById('mapScreen').style.display = 'none';
        document.getElementById('hospitalMapScreen').style.display = 'none';
        document.getElementById('homeMapScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';

        renderScene();
    }

    function goToNextScene() {
        const nextLoc = getNextLocation();
        if (nextLoc) {
            showMap();
        } else if (currentSceneIndex < scenarioData.scenes.length - 1) {
            currentSceneIndex++;
            currentCutIndex = 0;
            renderScene();
        } else {
            alert('学習完了！お疲れ様でした。');
            location.reload();
        }
    }

    // 知識解説
    function showKnowledge(knowledge) {
        document.getElementById('knowledgeTitle').textContent = knowledge.title;
        document.getElementById('knowledgeText').textContent = knowledge.text;
        document.getElementById('knowledgePanel').style.display = 'flex';
    }

    function closeKnowledge() {
        document.getElementById('knowledgePanel').style.display = 'none';
        const scene = scenarioData.scenes[currentSceneIndex];
        if (scene.quiz) {
            showQuiz(scene.quiz);
        } else {
            goToNextScene();
        }
    }

    // クイズ
    let selectedOptions = new Set();
    let quizData = null;

    function showQuiz(quiz) {
        quizData = quiz;
        selectedOptions.clear();
        document.getElementById('quizQuestion').textContent = quiz.question;

        const container = document.getElementById('quizOptions');
        container.innerHTML = '';
        quiz.options.forEach((opt, i) => {
            const el = document.createElement('div');
            el.className = 'quiz-option';
            el.innerHTML = `<span class="option-marker">${String.fromCharCode(65 + i)}</span><span>${opt.text}</span>`;
            el.addEventListener('click', () => selectOption(i, el, quiz.multipleAnswer));
            container.appendChild(el);
        });

        document.getElementById('quizFeedback').className = 'quiz-feedback';
        document.getElementById('quizSubmit').style.display = 'block';
        document.getElementById('quizSubmit').disabled = true;
        document.getElementById('quizContinue').style.display = 'none';
        document.getElementById('quizPanel').style.display = 'flex';
    }

    function selectOption(index, element, multipleAnswer) {
        if (element.classList.contains('disabled')) return;
        if (multipleAnswer) {
            if (selectedOptions.has(index)) {
                selectedOptions.delete(index);
                element.classList.remove('selected');
            } else {
                selectedOptions.add(index);
                element.classList.add('selected');
            }
        } else {
            document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
            selectedOptions.clear();
            selectedOptions.add(index);
            element.classList.add('selected');
        }
        document.getElementById('quizSubmit').disabled = selectedOptions.size === 0;
    }

    function submitQuiz() {
        const options = document.querySelectorAll('.quiz-option');
        let allCorrect = true;
        let correctCount = 0;
        let selectedCorrectCount = 0;

        quizData.options.forEach((opt, i) => {
            options[i].classList.add('disabled');
            if (opt.correct) {
                correctCount++;
                options[i].classList.add('correct');
                if (selectedOptions.has(i)) selectedCorrectCount++;
            } else if (selectedOptions.has(i)) {
                options[i].classList.add('incorrect');
                allCorrect = false;
            }
        });

        if (selectedCorrectCount !== correctCount) allCorrect = false;

        const fb = document.getElementById('quizFeedback');
        fb.className = allCorrect ? 'quiz-feedback show correct' : 'quiz-feedback show incorrect';
        fb.innerHTML = allCorrect ? '<strong>✅ 正解です！</strong>' : '<strong>❌ 不正解です</strong><br>正解の選択肢を確認してください。';

        document.getElementById('quizSubmit').style.display = 'none';
        document.getElementById('quizContinue').style.display = 'block';
    }

    function closeQuiz() {
        document.getElementById('quizPanel').style.display = 'none';
        goToNextScene();
    }

    init();
    </script>
</body>
</html>
