<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訪問看護ステーション始めました！</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
      background: #0f0f1a;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ===== ヘッダー ===== */
    header {
      height: 70px;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 3px solid #3d5a80;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .title-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #4ecdc4 0%, #2ec4b6 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 20px rgba(78, 205, 196, 0.4);
    }
    .title-text {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .money-box {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid #ffd700;
      border-radius: 15px;
      padding: 12px 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
    }
    .money-icon { font-size: 30px; }
    .money-value {
      font-size: 32px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: -1px;
    }
    .money-value.negative { color: #ff6b6b; }

    .header-center {
      text-align: center;
    }
    .date-main {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }
    .date-sub {
      font-size: 13px;
      color: #8ecae6;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-box {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 20px;
      text-align: center;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
    }
    .stat-label {
      font-size: 11px;
      color: #8ecae6;
    }

    .speed-box {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      overflow: hidden;
    }
    .speed-btn {
      width: 50px;
      height: 45px;
      border: none;
      background: transparent;
      color: #8ecae6;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .speed-btn:hover { background: rgba(255,255,255,0.1); }
    .speed-btn.active {
      background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
      color: #fff;
    }

    /* ===== メインエリア ===== */
    .main-area {
      flex: 1;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: #0a0a14;
      min-height: 0;
    }

    /* ===== 2画面パネル ===== */
    .view-panel {
      flex: 1;
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .panel-header {
      height: 45px;
      background: linear-gradient(135deg, #2d3a4f 0%, #1a2332 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 2px solid #3d5a80;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-info {
      font-size: 12px;
      color: #8ecae6;
    }

    .panel-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ===== ステーション内観キャンバス ===== */
    #stationCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ===== マップキャンバス ===== */
    #mapCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ===== コントロールパネル ===== */
    .control-bar {
      height: 80px;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      gap: 20px;
      border-top: 3px solid #3d5a80;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
    }

    .action-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .action-btn:active { transform: translateY(0); }
    .action-btn .icon { font-size: 22px; }

    .btn-hire {
      background: linear-gradient(135deg, #4895ef 0%, #3f37c9 100%);
      color: #fff;
    }
    .btn-sales {
      background: linear-gradient(135deg, #f77f00 0%, #d62828 100%);
      color: #fff;
    }
    .btn-week {
      background: linear-gradient(135deg, #2ec4b6 0%, #028090 100%);
      color: #fff;
    }

    .info-display {
      display: flex;
      gap: 30px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .info-icon { font-size: 24px; }
    .info-text {
      font-size: 14px;
      color: #8ecae6;
    }
    .info-value {
      font-size: 20px;
      font-weight: 700;
    }

    .log-display {
      flex: 1;
      max-width: 500px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 10px 15px;
      max-height: 60px;
      overflow-y: auto;
    }
    .log-item {
      font-size: 12px;
      color: #8ecae6;
      padding: 3px 0;
    }
    .log-item.money { color: #ffd700; }
    .log-item.good { color: #2ec4b6; }
    .log-item.bad { color: #e63946; }

    /* ===== フローティングUI ===== */
    .floating-text {
      position: absolute;
      font-size: 20px;
      font-weight: 900;
      color: #2ec4b6;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      pointer-events: none;
      animation: floatUp 2s ease-out forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      20% { transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-60px) scale(1); }
    }

    /* ===== モーダル ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
      border-radius: 24px;
      padding: 35px;
      width: 90%;
      max-width: 550px;
      border: 2px solid #3d5a80;
      box-shadow: 0 30px 100px rgba(0,0,0,0.7);
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 25px;
      color: #fff;
    }
    .modal-body { margin-bottom: 25px; }

    .hire-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 400px;
      overflow-y: auto;
    }
    .hire-card {
      background: rgba(255,255,255,0.05);
      border: 2px solid #3d5a80;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hire-card:hover {
      background: rgba(78, 205, 196, 0.15);
      border-color: #4ecdc4;
      transform: translateX(10px);
    }
    .hire-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4ecdc4 0%, #2ec4b6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .hire-info { flex: 1; }
    .hire-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .hire-role {
      font-size: 13px;
      color: #8ecae6;
      margin-top: 2px;
    }
    .hire-salary {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
    }

    .summary-card {
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      padding: 25px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      font-size: 16px;
      color: #e0e0e0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row.income .val { color: #2ec4b6; font-weight: 700; }
    .summary-row.expense .val { color: #e63946; font-weight: 700; }
    .summary-row.total {
      border-top: 2px solid #3d5a80;
      margin-top: 15px;
      padding-top: 20px;
      font-size: 22px;
      font-weight: 900;
    }
    .summary-row.total.positive .val { color: #2ec4b6; }
    .summary-row.total.negative .val { color: #e63946; }

    .modal-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-btn:hover { transform: translateY(-2px); }
    .modal-btn.primary {
      background: linear-gradient(135deg, #2ec4b6 0%, #028090 100%);
      color: #fff;
      box-shadow: 0 6px 25px rgba(46, 196, 182, 0.4);
    }
    .modal-btn.secondary {
      background: #3d5a80;
      color: #fff;
      margin-top: 12px;
    }

    /* エンディング */
    .ending { text-align: center; }
    .ending-rank {
      font-size: 120px;
      margin-bottom: 20px;
    }
    .ending-title {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="title-box">
          <div class="title-icon">🏥</div>
          <div class="title-text">訪問看護ステーション<br>始めました！</div>
        </div>
        <div class="money-box">
          <span class="money-icon">💰</span>
          <span class="money-value" id="money">¥7,500,000</span>
        </div>
      </div>
      <div class="header-center">
        <div class="date-main" id="dateMain">2026年 1月 第1週</div>
        <div class="date-sub" id="dateSub">1年目 ― 残り60ヶ月</div>
      </div>
      <div class="header-right">
        <div class="stat-box">
          <div class="stat-value" id="patientCount">5</div>
          <div class="stat-label">利用者</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="staffCount">3</div>
          <div class="stat-label">スタッフ</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="monthRev">¥0</div>
          <div class="stat-label">今月売上</div>
        </div>
        <div class="speed-box">
          <button class="speed-btn active" data-speed="1">×1</button>
          <button class="speed-btn" data-speed="2">×2</button>
          <button class="speed-btn" data-speed="3">×3</button>
        </div>
      </div>
    </header>

    <div class="main-area">
      <!-- ステーション内観 -->
      <div class="view-panel">
        <div class="panel-header">
          <div class="panel-title">🏢 ステーション内</div>
          <div class="panel-info" id="stationInfo">スタッフ待機中</div>
        </div>
        <div class="panel-content">
          <canvas id="stationCanvas"></canvas>
        </div>
      </div>

      <!-- 地域マップ -->
      <div class="view-panel">
        <div class="panel-header">
          <div class="panel-title">🗺️ 地域マップ</div>
          <div class="panel-info" id="mapInfo">訪問エリア</div>
        </div>
        <div class="panel-content">
          <canvas id="mapCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="control-bar">
      <div class="action-buttons">
        <button class="action-btn btn-hire" id="btnHire">
          <span class="icon">👩‍⚕️</span>
          <span>スタッフ採用</span>
        </button>
        <button class="action-btn btn-sales" id="btnSales">
          <span class="icon">🤝</span>
          <span>営業活動</span>
        </button>
        <button class="action-btn btn-week" id="btnWeek">
          <span class="icon">📅</span>
          <span>次の週へ進む</span>
        </button>
      </div>

      <div class="info-display">
        <div class="info-item">
          <span class="info-icon">💵</span>
          <div>
            <div class="info-text">今月売上</div>
            <div class="info-value" id="infoRev">¥0</div>
          </div>
        </div>
        <div class="info-item">
          <span class="info-icon">📊</span>
          <div>
            <div class="info-text">累計利益</div>
            <div class="info-value" id="infoProfit">¥0</div>
          </div>
        </div>
      </div>

      <div class="log-display" id="logArea"></div>
    </div>
  </div>

  <!-- モーダル類 -->
  <div class="modal-overlay" id="modalHire">
    <div class="modal">
      <div class="modal-title">👩‍⚕️ スタッフ採用</div>
      <div class="modal-body"><div class="hire-list" id="hireList"></div></div>
      <button class="modal-btn secondary" onclick="closeModal('modalHire')">閉じる</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalSales">
    <div class="modal">
      <div class="modal-title">🤝 営業活動</div>
      <div class="modal-body">
        <p style="text-align:center;margin-bottom:25px;color:#8ecae6;font-size:16px;line-height:1.8">
          地域のケアマネージャーを訪問して<br>新規利用者を紹介してもらいます
        </p>
        <div class="summary-card">
          <div class="summary-row expense"><span>営業コスト</span><span class="val">-¥50,000</span></div>
          <div class="summary-row"><span>成功確率</span><span class="val" style="color:#4895ef">60%</span></div>
          <div class="summary-row"><span>獲得見込み</span><span class="val" style="color:#2ec4b6">1〜3名</span></div>
        </div>
      </div>
      <button class="modal-btn primary" id="btnDoSales">営業に行く！</button>
      <button class="modal-btn secondary" onclick="closeModal('modalSales')">やめる</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalMonth">
    <div class="modal">
      <div class="modal-title">📊 月末決算レポート</div>
      <div class="modal-body" id="monthBody"></div>
      <button class="modal-btn primary" id="btnNextMonth">来月へ進む</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalResult">
    <div class="modal">
      <div class="modal-title" id="resultTitle">結果</div>
      <div class="modal-body" id="resultBody" style="text-align:center;font-size:20px;color:#e0e0e0;line-height:2"></div>
      <button class="modal-btn secondary" onclick="closeModal('modalResult')">OK</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalEnding">
    <div class="modal ending">
      <div class="ending-rank" id="endRank">🏆</div>
      <div class="ending-title" id="endTitle">5年間お疲れ様でした！</div>
      <div class="summary-card" id="endStats"></div>
      <button class="modal-btn primary" style="margin-top:25px" onclick="location.reload()">もう一度プレイ</button>
    </div>
  </div>

  <script>
    // ===== ゲーム状態 =====
    const G = {
      year: 1, month: 1, week: 1,
      money: 7500000,
      monthRevenue: 0,
      totalRevenue: 0,
      totalExpense: 0,
      pendingIncome: [0, 0],
      speed: 1,
      paused: false,
      staff: [],
      patients: [],
      houses: [],
      salesDone: false
    };

    let stationCanvas, stationCtx, mapCanvas, mapCtx;
    let SW, SH, MW, MH; // キャンバスサイズ
    let lastTime = 0;

    const STAFF_INIT = [
      { id: 1, name: "山田花子", avatar: "👩‍⚕️", salary: 350000, role: "管理者", color: "#e63946" },
      { id: 2, name: "佐藤美咲", avatar: "👩", salary: 280000, role: "看護師", color: "#4895ef" },
      { id: 3, name: "鈴木太郎", avatar: "👨", salary: 280000, role: "看護師", color: "#2ec4b6" }
    ];

    const PATIENT_INIT = [
      { id: 1, name: "高橋", revenue: 74000 },
      { id: 2, name: "山本", revenue: 65000 },
      { id: 3, name: "田中", revenue: 35000 },
      { id: 4, name: "伊藤", revenue: 65000 },
      { id: 5, name: "渡辺", revenue: 49000 }
    ];

    let hireCandidates = [
      { name: "中村さくら", avatar: "👩", salary: 280000, role: "看護師", color: "#f77f00" },
      { name: "小林健一", avatar: "👨", salary: 260000, role: "看護師", color: "#7209b7" },
      { name: "加藤理恵", avatar: "👩", salary: 300000, role: "看護師", color: "#3a86ff" },
      { name: "吉田剛", avatar: "👨‍⚕️", salary: 320000, role: "ベテラン", color: "#06d6a0" }
    ];

    // ===== 初期化 =====
    function init() {
      stationCanvas = document.getElementById('stationCanvas');
      stationCtx = stationCanvas.getContext('2d');
      mapCanvas = document.getElementById('mapCanvas');
      mapCtx = mapCanvas.getContext('2d');

      resize();
      window.addEventListener('resize', resize);

      // スタッフ初期化
      G.staff = STAFF_INIT.map((s, i) => ({
        ...s,
        state: 'idle',
        // ステーション内座標
        sx: 0, sy: 0, targetSx: 0, targetSy: 0,
        // マップ座標
        mx: 0, my: 0, targetMx: 0, targetMy: 0,
        deskIndex: i,
        visitTimer: 0
      }));

      G.patients = [...PATIENT_INIT];
      generateHouses();

      updateUI();
      addLog("🏥 訪問看護ステーションを開業しました！", "good");
      setupEvents();
      requestAnimationFrame(gameLoop);
    }

    function resize() {
      const stationContainer = stationCanvas.parentElement;
      SW = stationCanvas.width = stationContainer.offsetWidth;
      SH = stationCanvas.height = stationContainer.offsetHeight;

      const mapContainer = mapCanvas.parentElement;
      MW = mapCanvas.width = mapContainer.offsetWidth;
      MH = mapCanvas.height = mapContainer.offsetHeight;

      // スタッフ位置更新
      G.staff.forEach((s, i) => {
        if (s.state === 'idle') {
          s.sx = s.targetSx = 100 + (i % 3) * 150;
          s.sy = s.targetSy = 180 + Math.floor(i / 3) * 120;
        }
      });

      if (G.houses.length > 0) generateHouses();
    }

    function generateHouses() {
      G.houses = [];
      const padding = 80;
      const stationX = MW / 2;
      const stationY = MH / 2;

      G.patients.forEach((p, i) => {
        const angle = (i / G.patients.length) * Math.PI * 2 + Math.random() * 0.5;
        const dist = 120 + Math.random() * (Math.min(MW, MH) / 2 - 150);
        G.houses.push({
          id: p.id,
          name: p.name,
          revenue: p.revenue,
          x: stationX + Math.cos(angle) * dist,
          y: stationY + Math.sin(angle) * dist,
          hue: Math.random() * 60 + 10
        });
      });
    }

    // ===== 描画：ステーション内観 =====
    function drawStation() {
      const ctx = stationCtx;

      // 床
      ctx.fillStyle = '#f5f0e6';
      ctx.fillRect(0, 0, SW, SH);

      // 床パターン
      ctx.strokeStyle = '#e0d8c8';
      ctx.lineWidth = 1;
      for (let x = 0; x < SW; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, SH);
        ctx.stroke();
      }
      for (let y = 0; y < SH; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(SW, y);
        ctx.stroke();
      }

      // 壁
      ctx.fillStyle = '#e8f4ea';
      ctx.fillRect(0, 0, SW, 80);
      ctx.strokeStyle = '#a8d5ba';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 0, SW, 80);

      // 窓
      for (let i = 0; i < 4; i++) {
        const wx = 80 + i * (SW - 160) / 3;
        drawWindow(ctx, wx, 15, 80, 50);
      }

      // ロゴ
      ctx.fillStyle = '#1e3a5f';
      ctx.font = 'bold 16px "Noto Sans JP"';
      ctx.textAlign = 'center';
      ctx.fillText('訪問看護ステーション ひまわり', SW / 2, 100);

      // デスク
      const deskPositions = [
        { x: 100, y: 180 },
        { x: 250, y: 180 },
        { x: 400, y: 180 },
        { x: 100, y: 300 },
        { x: 250, y: 300 },
        { x: 400, y: 300 }
      ];

      deskPositions.forEach((pos, i) => {
        if (pos.x < SW - 50) {
          drawDesk(ctx, pos.x, pos.y, i < G.staff.length);
        }
      });

      // 本棚
      drawBookshelf(ctx, SW - 80, 120);

      // 植物
      drawPlant(ctx, 30, SH - 100);
      drawPlant(ctx, SW - 50, SH - 100);

      // 受付カウンター
      drawReceptionDesk(ctx, SW / 2, SH - 60);

      // スタッフ描画
      G.staff.forEach(s => {
        if (s.state === 'idle' || s.state === 'preparing') {
          drawStaffInStation(ctx, s);
        }
      });

      // 時計
      drawClock(ctx, SW - 50, 30);
    }

    function drawWindow(ctx, x, y, w, h) {
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#5d4e37';
      ctx.lineWidth = 4;
      ctx.strokeRect(x, y, w, h);
      ctx.beginPath();
      ctx.moveTo(x + w/2, y);
      ctx.lineTo(x + w/2, y + h);
      ctx.moveTo(x, y + h/2);
      ctx.lineTo(x + w, y + h/2);
      ctx.stroke();

      // カーテン
      ctx.fillStyle = 'rgba(255,182,193,0.6)';
      ctx.fillRect(x, y, 15, h);
      ctx.fillRect(x + w - 15, y, 15, h);
    }

    function drawDesk(ctx, x, y, hasComputer) {
      // デスク天板
      ctx.fillStyle = '#d4a373';
      ctx.fillRect(x - 50, y - 10, 100, 50);
      ctx.strokeStyle = '#9c6644';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 50, y - 10, 100, 50);

      // 脚
      ctx.fillStyle = '#6c584c';
      ctx.fillRect(x - 45, y + 40, 8, 30);
      ctx.fillRect(x + 37, y + 40, 8, 30);

      // 椅子
      ctx.fillStyle = '#264653';
      ctx.beginPath();
      ctx.ellipse(x, y + 60, 20, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - 15, y + 45, 30, 20);

      if (hasComputer) {
        // モニター
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(x - 20, y - 35, 40, 30);
        ctx.fillStyle = '#4a90d9';
        ctx.fillRect(x - 17, y - 32, 34, 24);
        // スタンド
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(x - 5, y - 5, 10, 5);

        // キーボード
        ctx.fillStyle = '#333';
        ctx.fillRect(x - 25, y + 5, 50, 15);
      }
    }

    function drawBookshelf(ctx, x, y) {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(x - 30, y, 60, 150);
      ctx.strokeStyle = '#5d3a1a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 30, y, 60, 150);

      // 棚板
      for (let i = 1; i < 4; i++) {
        ctx.fillStyle = '#6b4423';
        ctx.fillRect(x - 28, y + i * 37, 56, 4);
      }

      // 本
      const bookColors = ['#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261'];
      for (let row = 0; row < 3; row++) {
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = bookColors[(row + i) % bookColors.length];
          ctx.fillRect(x - 25 + i * 11, y + 5 + row * 37, 9, 30);
        }
      }
    }

    function drawPlant(ctx, x, y) {
      // 鉢
      ctx.fillStyle = '#c4a484';
      ctx.beginPath();
      ctx.moveTo(x - 20, y);
      ctx.lineTo(x - 15, y + 40);
      ctx.lineTo(x + 15, y + 40);
      ctx.lineTo(x + 20, y);
      ctx.fill();
      ctx.strokeStyle = '#8b7355';
      ctx.stroke();

      // 土
      ctx.fillStyle = '#5d4037';
      ctx.beginPath();
      ctx.ellipse(x, y, 18, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 葉
      ctx.fillStyle = '#2e7d32';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        const angle = (i / 5) * Math.PI - Math.PI / 2;
        ctx.ellipse(x + Math.cos(angle) * 15, y - 30 + Math.sin(angle) * 10, 12, 25, angle + Math.PI/2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawReceptionDesk(ctx, x, y) {
      ctx.fillStyle = '#4a5568';
      ctx.fillRect(x - 100, y - 20, 200, 40);
      ctx.fillStyle = '#2d3748';
      ctx.fillRect(x - 95, y - 15, 190, 30);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px "Noto Sans JP"';
      ctx.textAlign = 'center';
      ctx.fillText('受付', x, y + 3);
    }

    function drawClock(ctx, x, y) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.stroke();

      const now = new Date();
      const hour = now.getHours() % 12;
      const min = now.getMinutes();

      // 時針
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      const hAngle = (hour / 12) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(hAngle) * 10, y + Math.sin(hAngle) * 10);
      ctx.stroke();

      // 分針
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      const mAngle = (min / 60) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(mAngle) * 15, y + Math.sin(mAngle) * 15);
      ctx.stroke();
    }

    function drawStaffInStation(ctx, s) {
      const x = s.sx, y = s.sy;

      // 影
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(x, y + 45, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 体
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.ellipse(x, y + 20, 18, 25, 0, 0, Math.PI * 2);
      ctx.fill();

      // 顔
      ctx.fillStyle = '#ffd5b4';
      ctx.beginPath();
      ctx.arc(x, y - 15, 18, 0, Math.PI * 2);
      ctx.fill();

      // 髪
      ctx.fillStyle = s.avatar.includes('👨') ? '#4a3728' : '#2d2d2d';
      ctx.beginPath();
      ctx.arc(x, y - 20, 18, Math.PI, Math.PI * 2);
      ctx.fill();

      // 目
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(x - 6, y - 15, 3, 0, Math.PI * 2);
      ctx.arc(x + 6, y - 15, 3, 0, Math.PI * 2);
      ctx.fill();

      // 口
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y - 8, 5, 0.2, Math.PI - 0.2);
      ctx.stroke();

      // 名札
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 18, y + 5, 36, 14);
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1;
      ctx.strokeRect(x - 18, y + 5, 36, 14);
      ctx.fillStyle = '#333';
      ctx.font = '8px "Noto Sans JP"';
      ctx.textAlign = 'center';
      ctx.fillText(s.name.slice(0, 2), x, y + 15);
    }

    // ===== 描画：マップ =====
    function drawMap() {
      const ctx = mapCtx;
      const centerX = MW / 2;
      const centerY = MH / 2;

      // 背景（芝生）
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(MW, MH));
      gradient.addColorStop(0, '#7cb342');
      gradient.addColorStop(1, '#558b2f');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, MW, MH);

      // 芝生テクスチャ
      ctx.fillStyle = 'rgba(139, 195, 74, 0.4)';
      for (let i = 0; i < 200; i++) {
        const tx = Math.random() * MW;
        const ty = Math.random() * MH;
        ctx.beginPath();
        ctx.arc(tx, ty, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 道路網
      drawRoadNetwork(ctx, centerX, centerY);

      // 家
      G.houses.forEach(h => drawHouseOnMap(ctx, h));

      // ステーション建物
      drawStationOnMap(ctx, centerX, centerY);

      // スタッフ（訪問中）
      G.staff.forEach(s => {
        if (s.state === 'going' || s.state === 'visiting' || s.state === 'returning') {
          drawStaffOnMap(ctx, s);
        }
      });
    }

    function drawRoadNetwork(ctx, cx, cy) {
      ctx.strokeStyle = '#9e9e9e';
      ctx.lineWidth = 25;
      ctx.lineCap = 'round';

      // メイン道路
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(MW, cy);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, MH);
      ctx.stroke();

      // 白線
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.setLineDash([15, 10]);
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(MW, cy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, MH);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawHouseOnMap(ctx, h) {
      const x = h.x, y = h.y;

      // 影
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(x + 5, y + 35, 30, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // 家本体
      ctx.fillStyle = `hsl(${h.hue}, 60%, 75%)`;
      ctx.fillRect(x - 25, y - 5, 50, 40);
      ctx.strokeStyle = `hsl(${h.hue}, 60%, 45%)`;
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 25, y - 5, 50, 40);

      // 屋根
      ctx.fillStyle = `hsl(${h.hue + 180}, 50%, 40%)`;
      ctx.beginPath();
      ctx.moveTo(x - 30, y - 5);
      ctx.lineTo(x, y - 30);
      ctx.lineTo(x + 30, y - 5);
      ctx.fill();

      // 窓
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(x - 18, y + 2, 14, 14);
      ctx.fillRect(x + 4, y + 2, 14, 14);
      ctx.strokeStyle = '#5d4e37';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - 18, y + 2, 14, 14);
      ctx.strokeRect(x + 4, y + 2, 14, 14);

      // ドア
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(x - 7, y + 18, 14, 17);

      // 名前ラベル
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.font = 'bold 11px "Noto Sans JP"';
      ctx.textAlign = 'center';
      ctx.fillText(`${h.name}様`, x, y + 55);

      // 収益表示
      ctx.fillStyle = '#2e7d32';
      ctx.font = 'bold 10px "Noto Sans JP"';
      ctx.fillText(`¥${Math.floor(h.revenue/1000)}K`, x, y - 38);
    }

    function drawStationOnMap(ctx, x, y) {
      // 影
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(x + 8, y + 55, 50, 15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 建物本体
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 45, y - 25, 90, 75);
      ctx.strokeStyle = '#1e3a5f';
      ctx.lineWidth = 3;
      ctx.strokeRect(x - 45, y - 25, 90, 75);

      // 屋根
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.moveTo(x - 55, y - 25);
      ctx.lineTo(x, y - 55);
      ctx.lineTo(x + 55, y - 25);
      ctx.fill();
      ctx.strokeStyle = '#9d0208';
      ctx.stroke();

      // 十字マーク
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✚', x, y - 32);

      // 看板
      ctx.fillStyle = '#4895ef';
      ctx.fillRect(x - 38, y - 15, 76, 25);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px "Noto Sans JP"';
      ctx.fillText('訪問看護ステーション', x, y + 2);

      // 入口
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(x - 12, y + 20, 24, 30);
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(x - 8, y + 25, 16, 15);
    }

    function drawStaffOnMap(ctx, s) {
      const x = s.mx, y = s.my;

      // 車
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.roundRect(x - 18, y - 10, 36, 20, 5);
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 窓
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(x - 12, y - 6, 10, 8);
      ctx.fillRect(x + 2, y - 6, 10, 8);

      // タイヤ
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(x - 10, y + 10, 5, 0, Math.PI * 2);
      ctx.arc(x + 10, y + 10, 5, 0, Math.PI * 2);
      ctx.fill();

      // 名前
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px "Noto Sans JP"';
      ctx.textAlign = 'center';
      ctx.fillText(s.name.slice(0, 2), x, y - 18);
    }

    // ===== ゲームループ =====
    function gameLoop(time) {
      if (!lastTime) lastTime = time;
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      if (!G.paused) {
        update(delta);
      }

      drawStation();
      drawMap();

      requestAnimationFrame(gameLoop);
    }

    function update(delta) {
      const centerX = MW / 2;
      const centerY = MH / 2;

      G.staff.forEach((s, i) => {
        // ステーション内位置
        const deskX = 100 + (s.deskIndex % 3) * 150;
        const deskY = 180 + Math.floor(s.deskIndex / 3) * 120;

        if (s.state === 'idle') {
          // デスク位置へ移動
          s.targetSx = Math.min(deskX, SW - 100);
          s.targetSy = deskY;
          s.sx += (s.targetSx - s.sx) * 0.1;
          s.sy += (s.targetSy - s.sy) * 0.1;

          // ランダムに訪問開始
          if (Math.random() < 0.005 * G.speed && G.houses.length > 0) {
            const house = G.houses[Math.floor(Math.random() * G.houses.length)];
            s.state = 'preparing';
            s.targetHouse = house;
            s.prepareTimer = 0;
            s.mx = centerX;
            s.my = centerY + 30;
          }
        } else if (s.state === 'preparing') {
          s.prepareTimer += delta * G.speed;
          // 受付へ移動
          s.targetSx = SW / 2;
          s.targetSy = SH - 100;
          s.sx += (s.targetSx - s.sx) * 0.15;
          s.sy += (s.targetSy - s.sy) * 0.15;

          if (s.prepareTimer > 0.8) {
            s.state = 'going';
            addLog(`${s.name.slice(0,2)}：${s.targetHouse.name}様宅へ出発`);
          }
        } else if (s.state === 'going') {
          s.targetMx = s.targetHouse.x;
          s.targetMy = s.targetHouse.y;
          const dx = s.targetMx - s.mx;
          const dy = s.targetMy - s.my;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const speed = 120 * G.speed;

          if (dist < 20) {
            s.state = 'visiting';
            s.visitTimer = 0;
          } else {
            s.mx += (dx / dist) * speed * delta;
            s.my += (dy / dist) * speed * delta;
          }
        } else if (s.state === 'visiting') {
          s.visitTimer += delta * G.speed;
          if (s.visitTimer > 2) {
            // 訪問完了
            const rev = Math.floor(s.targetHouse.revenue / 4);
            G.monthRevenue += rev;
            G.money += rev;
            addLog(`${s.name.slice(0,2)}：${s.targetHouse.name}様 +¥${rev.toLocaleString()}`, 'money');
            showFloating(mapCanvas.parentElement, s.targetHouse.x, s.targetHouse.y - 50, `+¥${rev.toLocaleString()}`);
            updateUI();
            s.state = 'returning';
          }
        } else if (s.state === 'returning') {
          const dx = centerX - s.mx;
          const dy = centerY + 30 - s.my;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const speed = 120 * G.speed;

          if (dist < 20) {
            s.state = 'idle';
            s.sx = SW / 2;
            s.sy = SH - 100;
          } else {
            s.mx += (dx / dist) * speed * delta;
            s.my += (dy / dist) * speed * delta;
          }
        }
      });

      // ステーション情報更新
      const working = G.staff.filter(s => s.state !== 'idle').length;
      document.getElementById('stationInfo').textContent = working > 0 ? `${working}名が訪問中` : 'スタッフ待機中';
      document.getElementById('mapInfo').textContent = `利用者 ${G.patients.length}名`;
    }

    function showFloating(container, x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      container.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    // ===== UI =====
    function updateUI() {
      const moneyEl = document.getElementById('money');
      moneyEl.textContent = `¥${G.money.toLocaleString()}`;
      moneyEl.className = 'money-value' + (G.money < 0 ? ' negative' : '');

      document.getElementById('dateMain').textContent = `${2025 + G.year}年 ${G.month}月 第${G.week}週`;
      const remaining = 60 - ((G.year - 1) * 12 + G.month - 1);
      document.getElementById('dateSub').textContent = `${G.year}年目 ― 残り${remaining}ヶ月`;

      document.getElementById('patientCount').textContent = G.patients.length;
      document.getElementById('staffCount').textContent = G.staff.length;
      document.getElementById('monthRev').textContent = `¥${Math.floor(G.monthRevenue / 1000)}K`;
      document.getElementById('infoRev').textContent = `¥${G.monthRevenue.toLocaleString()}`;
      document.getElementById('infoProfit').textContent = `¥${(G.totalRevenue - G.totalExpense).toLocaleString()}`;
    }

    function addLog(text, type = '') {
      const area = document.getElementById('logArea');
      const el = document.createElement('div');
      el.className = 'log-item ' + type;
      el.textContent = text;
      area.insertBefore(el, area.firstChild);
      while (area.children.length > 10) area.removeChild(area.lastChild);
    }

    // ===== イベント =====
    function setupEvents() {
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.onclick = () => {
          G.speed = parseInt(btn.dataset.speed);
          document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
      });

      document.getElementById('btnHire').onclick = showHireModal;
      document.getElementById('btnSales').onclick = () => {
        if (G.salesDone) return alert('今週は営業済みです');
        openModal('modalSales');
      };
      document.getElementById('btnDoSales').onclick = doSales;
      document.getElementById('btnWeek').onclick = advanceWeek;
      document.getElementById('btnNextMonth').onclick = nextMonth;
    }

    function showHireModal() {
      document.getElementById('hireList').innerHTML = hireCandidates.map((c, i) => `
        <div class="hire-card" onclick="doHire(${i})">
          <div class="hire-avatar" style="background:linear-gradient(135deg,${c.color},${c.color}dd)">${c.avatar}</div>
          <div class="hire-info">
            <div class="hire-name">${c.name}</div>
            <div class="hire-role">${c.role}</div>
          </div>
          <div class="hire-salary">¥${(c.salary/1000).toFixed(0)}K/月</div>
        </div>
      `).join('');
      openModal('modalHire');
    }

    function doHire(idx) {
      if (G.staff.length >= 6) return alert('スタッフは6名までです');
      const c = hireCandidates[idx];
      G.staff.push({
        id: Date.now(), name: c.name, avatar: c.avatar, salary: c.salary, role: c.role, color: c.color,
        state: 'idle', sx: SW/2, sy: SH - 100, mx: MW/2, my: MH/2, deskIndex: G.staff.length
      });
      hireCandidates.splice(idx, 1);

      const names = ["木村明日香", "林由美子", "清水誠一", "山崎愛美", "池田翔太"];
      const avatars = ["👩", "👨", "👩‍⚕️", "👨‍⚕️"];
      const colors = ["#f77f00", "#7209b7", "#3a86ff", "#06d6a0", "#e63946"];
      hireCandidates.push({
        name: names[Math.floor(Math.random() * names.length)],
        avatar: avatars[Math.floor(Math.random() * avatars.length)],
        salary: 250000 + Math.floor(Math.random() * 80000),
        role: "看護師",
        color: colors[Math.floor(Math.random() * colors.length)]
      });

      updateUI();
      addLog(`${c.name}が入職しました！`, 'good');
      closeModal('modalHire');
    }

    function doSales() {
      G.money -= 50000;
      G.salesDone = true;
      closeModal('modalSales');

      if (Math.random() < 0.6) {
        const count = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) addPatient();
        showResult('🎉 営業成功！', `${count}名の新規利用者を獲得しました！`);
        addLog(`営業成功！+${count}名獲得`, 'good');
      } else {
        showResult('😅 残念...', '今回は紹介に繋がりませんでした');
        addLog('営業：成果なし', 'bad');
      }
      updateUI();
    }

    function addPatient() {
      const names = ["佐々木", "松本", "井上", "木村", "林", "斎藤", "清水", "阿部"];
      const revenue = 30000 + Math.floor(Math.random() * 50000);
      const p = { id: Date.now() + Math.random(), name: names[Math.floor(Math.random() * names.length)], revenue };
      G.patients.push(p);

      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * (Math.min(MW, MH) / 2 - 150);
      G.houses.push({
        id: p.id, name: p.name, revenue,
        x: MW/2 + Math.cos(angle) * dist,
        y: MH/2 + Math.sin(angle) * dist,
        hue: Math.random() * 60 + 10
      });
    }

    function advanceWeek() {
      G.week++;
      G.salesDone = false;
      if (G.week > 4) {
        G.week = 1;
        showMonthEnd();
      } else {
        addLog(`${G.month}月 第${G.week}週`);
        updateUI();
      }
    }

    function showMonthEnd() {
      const revenue = G.monthRevenue;
      const salaries = G.staff.reduce((s, x) => s + x.salary, 0);
      const overhead = Math.floor(salaries * 0.15) + 260000;
      const bonus = (G.month === 6 || G.month === 12) ? Math.floor(salaries * 1.7) : 0;
      const totalExp = salaries + overhead + bonus;

      G.pendingIncome.push(revenue);
      const cashIn = G.pendingIncome.shift();
      const pl = cashIn - totalExp;

      G.totalRevenue += revenue;
      G.totalExpense += totalExp;

      document.getElementById('monthBody').innerHTML = `
        <div class="summary-card">
          <div class="summary-row income"><span>💰 売上（発生）</span><span class="val">+¥${revenue.toLocaleString()}</span></div>
          <div class="summary-row income"><span>💵 入金（2ヶ月前分）</span><span class="val">+¥${cashIn.toLocaleString()}</span></div>
          <div class="summary-row expense"><span>👥 人件費</span><span class="val">-¥${salaries.toLocaleString()}</span></div>
          <div class="summary-row expense"><span>🏢 諸経費</span><span class="val">-¥${overhead.toLocaleString()}</span></div>
          ${bonus > 0 ? `<div class="summary-row expense"><span>🎁 賞与</span><span class="val">-¥${bonus.toLocaleString()}</span></div>` : ''}
          <div class="summary-row total ${pl >= 0 ? 'positive' : 'negative'}">
            <span>月間収支</span><span class="val">${pl >= 0 ? '+' : ''}¥${pl.toLocaleString()}</span>
          </div>
        </div>
      `;

      G.money = G.money - G.monthRevenue + pl;
      G.monthRevenue = 0;
      openModal('modalMonth');
    }

    function nextMonth() {
      closeModal('modalMonth');
      G.month++;
      if (G.month > 12) { G.month = 1; G.year++; }

      if (G.money < -3000000) {
        showEnding('gameover');
      } else if (G.year > 5) {
        showEnding('clear');
      } else {
        addLog(`${G.month}月になりました`, 'good');
        updateUI();
      }
    }

    function showEnding(type) {
      const pl = G.totalRevenue - G.totalExpense;
      let rank, title;
      if (type === 'gameover') { rank = '💀'; title = 'GAME OVER'; }
      else {
        if (pl > 30000000 && G.patients.length >= 15) rank = '🏆 S';
        else if (pl > 20000000) rank = '🥇 A';
        else if (pl > 0) rank = '🥈 B';
        else rank = '🥉 C';
        title = '5年間お疲れ様でした！';
      }
      document.getElementById('endRank').textContent = rank;
      document.getElementById('endTitle').textContent = title;
      document.getElementById('endStats').innerHTML = `
        <div class="summary-row"><span>累計売上</span><span class="val" style="color:#2ec4b6">¥${G.totalRevenue.toLocaleString()}</span></div>
        <div class="summary-row"><span>累計支出</span><span class="val" style="color:#e63946">¥${G.totalExpense.toLocaleString()}</span></div>
        <div class="summary-row total ${pl >= 0 ? 'positive' : 'negative'}"><span>最終損益</span><span class="val">¥${pl.toLocaleString()}</span></div>
        <div class="summary-row"><span>最終利用者</span><span class="val">${G.patients.length}名</span></div>
        <div class="summary-row"><span>最終スタッフ</span><span class="val">${G.staff.length}名</span></div>
      `;
      openModal('modalEnding');
    }

    function showResult(title, body) {
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultBody').innerHTML = body;
      openModal('modalResult');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); G.paused = true; }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); G.paused = false; }

    init();
  </script>
</body>
</html>
